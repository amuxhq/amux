name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      without-build-host:
        description: "Run the Linux gate on the runner alone, as a fork's pull request does"
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to a branch stops the run of the one before it, which would
# otherwise hold the runners the newer one waits for. A run started by hand
# is apart from them: it neither stops a push's run nor is stopped by one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'push' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # The build host whose NativeLink the Linux gate sends its actions to, a
  # machine on the tailnet the runner joins (docs/CI.md, "The Linux gate").
  BUILD_HOST: nova.tail656fe8.ts.net

jobs:
  linux:
    name: Linux gate
    runs-on: ubuntu-latest
    # Measured: with the build host in reach, a landed commit is the time to
    # set up Nix and premerge's cache hits. Without it (a fork's pull
    # request), the runner builds and tests everything itself, on four cores.
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
    env:
      # A fork's pull request gets no secrets, so no tailnet: it runs on the
      # runner alone, slower but the same checks.
      REMOTE: ${{ secrets.TS_OAUTH_CLIENT_ID != '' && inputs.without-build-host != true }}
    outputs:
      miri: ${{ steps.cargo.outputs.miri }}
      sanitizers: ${{ steps.cargo.outputs.sanitizers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The protocol and store checks read the latest release tag's
          # schemas, and the Cargo checks compare with an earlier commit.
          fetch-depth: 0
      - name: Refuse fixture update flags
        run: scripts/no-update-flags.sh
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
      - name: Join the tailnet
        if: env.REMOTE == 'true'
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ env.BUILD_HOST }}
      - name: Send Buck2's actions to the build host
        if: env.REMOTE == 'true'
        run: echo "AMUX_NATIVELINK=grpc://$BUILD_HOST:50051" >> "$GITHUB_ENV"
      - name: Fetch the pinned tools
        run: nix develop --command true
      # Without the build host, a NativeLink of the runner's own takes its
      # place, so every action still runs sandboxed through a worker. Its
      # cache goes on the runner's larger second disk. Its worker offers the
      # runner's real cores, and a test that takes the whole worker asks
      # for that many (AMUX_LINUX_WORKER_CORES), so it runs alone as it
      # would on the build host.
      - name: Start a NativeLink on the runner
        if: env.REMOTE != 'true'
        run: |
          sudo mkdir -p /mnt/nativelink && sudo chown "$(id -u):$(id -g)" /mnt/nativelink
          echo "AMUX_LINUX_WORKER_CORES=$(nproc)" >> "$GITHUB_ENV"
          nohup nix develop --command scripts/py scripts/nativelink.py serve /mnt/nativelink --cores "$(nproc)" > /mnt/nativelink/log 2>&1 &
          for _ in $(seq 60); do nc -z 127.0.0.1 50051 && exit 0; sleep 1; done
          cat /mnt/nativelink/log; exit 1
      - name: Say which Cargo checks this change reaches
        id: cargo
        env:
          EVENT: ${{ github.event_name }}
          PULL_BASE: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        # A push is compared with the last push whose run finished, passing
        # or failing, and not with the push before it: that one's run may
        # have been stopped by this one, its changes never judged. With no
        # such run, or for a run started by hand, they all run.
        run: |
          case "$EVENT" in
            push)
              base=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=$GITHUB_REF_NAME&event=push&status=completed&per_page=50" \
                --jq '[.workflow_runs[] | select(.conclusion == "success" or .conclusion == "failure")][0].head_sha // ""' || true)
              ;;
            pull_request) base=$PULL_BASE ;;
            *) base= ;;
          esac
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "compared with $base"
            nix develop --command python3 scripts/landing.py covers --base "$base" | tee -a "$GITHUB_OUTPUT"
          else
            echo "nothing to compare with: every Cargo check runs"
            printf 'miri=true\nsanitizers=true\n' | tee -a "$GITHUB_OUTPUT"
          fi
      # The gate every landing passes: through Buck2, every test, the
      # repository's and the JavaScript's checks and Clippy, so a commit the
      # landing queue or a premerge already tested is cache hits; and the
      # checks that stay scripts.
      # Without it, the Android app's half runs beside this one, in the
      # job below: all of it on one four-core runner takes longer than a
      # test run's bound.
      - name: Run the gate (just premerge)
        run: nix develop --command just ${{ env.REMOTE == 'true' && 'premerge' || 'premerge-half workspace' }}
      - name: Say what Buck2 ran and what came from the cache
        if: always()
        # Each build's log, then each test run's, each oldest first.
        run: |
          cat > "$RUNNER_TEMP/summaries.sh" <<'EOF'
          for log in buck-out/v2/log/*_build_*.pb.zst buck-out/v2/log/*_test_*.pb.zst; do
            [ -e "$log" ] || continue
            scripts/buck2 log summary "$log" | grep -E '^Showing|^- (Local|Remote|Cached|Other) actions' || true
          done
          EOF
          nix develop --command sh "$RUNNER_TEMP/summaries.sh"
      - name: Audit the browser extension's shipped dependencies
        if: always()
        run: nix develop --command just browser audit
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: always()
        with:
          key: doctest
      # The documentation tests are Cargo's: Buck2's need every compile in
      # its nightly-features mode (docs/BUILD.md).
      - name: Run the documentation tests
        if: always()
        run: nix develop --command just doctest

  # The Android app's half of the gate (`just premerge-half android`), on a
  # runner of its own, when the Linux gate has no build host to share the
  # work with: a fork's pull request, or a run by hand without it. With the
  # build host, the Linux gate runs all of the gate and this does nothing.
  android:
    name: Linux gate, Android app
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      REMOTE: ${{ secrets.TS_OAUTH_CLIENT_ID != '' && inputs.without-build-host != true }}
    steps:
      - if: env.REMOTE != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.REMOTE != 'true'
        uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
      - name: Fetch the pinned tools
        if: env.REMOTE != 'true'
        run: nix develop --command true
      # Without the build host, a NativeLink of the runner's own takes its
      # place, so every action still runs sandboxed through a worker. Its
      # cache goes on the runner's larger second disk. Its worker offers the
      # runner's real cores, and a test that takes the whole worker asks
      # for that many (AMUX_LINUX_WORKER_CORES), so it runs alone as it
      # would on the build host.
      - name: Start a NativeLink on the runner
        if: env.REMOTE != 'true'
        run: |
          sudo mkdir -p /mnt/nativelink && sudo chown "$(id -u):$(id -g)" /mnt/nativelink
          echo "AMUX_LINUX_WORKER_CORES=$(nproc)" >> "$GITHUB_ENV"
          nohup nix develop --command scripts/py scripts/nativelink.py serve /mnt/nativelink --cores "$(nproc)" > /mnt/nativelink/log 2>&1 &
          for _ in $(seq 60); do nc -z 127.0.0.1 50051 && exit 0; sleep 1; done
          cat /mnt/nativelink/log; exit 1
      - name: Run the Android app's half of the gate
        if: env.REMOTE != 'true'
        run: nix develop --command just premerge-half android

  # Miri and the sanitizers rebuild the standard library under their checks
  # (`-Zbuild-std`), which Buck2's Rust rules can't, so they run under Cargo:
  # in the landing queue before a push, and here after one, when the push
  # changed what they check (scripts/landing.py covers). A Mac's landing
  # can't run the thread sanitizer, and a merge made in GitHub's page runs
  # neither, so this runs them whoever landed the change.
  cargo:
    name: ${{ matrix.check }}
    needs: linux
    if: always() && (needs.linux.outputs.miri == 'true' || needs.linux.outputs.sanitizers == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COVERED: ${{ matrix.key == 'miri' && needs.linux.outputs.miri || needs.linux.outputs.sanitizers }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: Pointer checks over the C ABI
            run: just miri
            key: miri
          - check: Address sanitizer
            run: just sanitize address
            key: sanitize-address
          - check: Thread sanitizer
            run: just sanitize thread
            key: sanitize-thread
    # A leg the push doesn't reach skips every step.
    steps:
      - if: env.COVERED == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.COVERED == 'true'
        uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
      - if: env.COVERED == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.key }}
      - name: Run ${{ matrix.run }}
        if: env.COVERED == 'true'
        run: nix develop --command ${{ matrix.run }}

  # The workspace's tests on Windows (docs/CI.md, "The Windows job"). The
  # build host's Linux worker compiles and links every Windows binary; then
  # a NativeLink on this runner, in front of the build host's cache, runs
  # the tests on a Windows worker of its own, so the runner compiles
  # nothing and a test whose inputs haven't changed is a cache hit. A
  # fork's pull request, with no tailnet, tests under Cargo on the runner.
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      REMOTE: ${{ secrets.TS_OAUTH_CLIENT_ID != '' && inputs.without-build-host != true }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Refuse fixture update flags
        run: scripts/no-update-flags.sh
      # Python 3.14 unpacks the pinned Buck2 (scripts/buck-tools.py: the
      # runner has no zstd). Windows' Python installers make only `python`,
      # and `python3` is a stub that offers the Microsoft Store; Buck2 runs
      # one helper here by that name (it fetches the git dependencies, which
      # runs locally).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Name the runner's Python python3 too
        run: |
          dir=$(dirname "$(command -v python)")
          [ -e "$dir/python3.exe" ] || cp "$dir/python.exe" "$dir/python3.exe"
          python3 --version
      - if: env.REMOTE == 'true'
        uses: ./.github/actions/setup-just
      - name: Join the tailnet
        if: env.REMOTE == 'true'
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ env.BUILD_HOST }}
      - name: Build every Windows binary on the build host
        if: env.REMOTE == 'true'
        run: AMUX_NATIVELINK="grpc://$BUILD_HOST:50051" just check-windows
      # The tests' results from earlier runs: the build host's cache can't
      # be written from here, so they are kept in GitHub's (the NativeLink
      # config, build/nativelink/windows.json5, says why that is enough).
      - name: Restore the Windows tests' results
        if: env.REMOTE == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/test-results
          key: windows-test-results-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            windows-test-results-${{ github.sha }}-
            windows-test-results-
      # One step, so the NativeLink it starts in the background is still
      # running while the tests do.
      - name: Run the tests on a Windows worker
        if: env.REMOTE == 'true'
        run: |
          rm -f "$RUNNER_TEMP/nativelink/port"
          scripts/py scripts/nativelink.py windows "$RUNNER_TEMP/nativelink" --remote "grpc://$BUILD_HOST:50051" \
            --results "$RUNNER_TEMP/test-results" > "$RUNNER_TEMP/nativelink.log" 2>&1 &
          # It listens on a port the system picks (scripts/nativelink.py).
          port=$(scripts/py -c 'import pathlib, socket, sys, time
          port = pathlib.Path(sys.argv[1])
          for _ in range(60):
              try:
                  number = int(port.read_text())
                  socket.create_connection(("127.0.0.1", number), 1).close()
                  print(number); sys.exit(0)
              except (OSError, ValueError):
                  time.sleep(1)
          sys.exit("nativelink did not start")' "$RUNNER_TEMP/nativelink/port") || { cat "$RUNNER_TEMP/nativelink.log"; exit 1; }
          AMUX_NATIVELINK="grpc://127.0.0.1:$port" just test-windows
      - name: Say what Buck2 ran and what came from the cache
        if: always() && env.REMOTE == 'true'
        run: |
          for log in buck-out/v2/log/*_build_*.pb.zst buck-out/v2/log/*_test_*.pb.zst; do
            [ -e "$log" ] || continue
            scripts/buck2 log summary "$log" | grep -E '^Showing|^- (Local|Remote|Cached|Other) actions' || true
          done
      - name: Show NativeLink's log
        if: failure() && env.REMOTE == 'true'
        run: tail -n 300 "$RUNNER_TEMP/nativelink.log" || true
      - name: Keep the Windows tests' results
        if: always() && env.REMOTE == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/test-results
          key: windows-test-results-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      # Without the build host: what the Windows tests ran under before
      # Buck2, on the runner's own four cores. A fork's run reads the Rust
      # cache main's runs saved; a run by hand on main without the build
      # host is what saves it.
      - if: env.REMOTE != 'true'
        uses: ./.github/actions/setup-rust
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
          nextest: "true"
          sccache: "true"
      - name: Run the workspace tests under Cargo
        if: env.REMOTE != 'true'
        run: just cargo-test -- --profile ci --exclude models

  # The Apple apps and the workspace's tests on macOS, through Buck2
  # (docs/CI.md, "The macOS jobs"). A NativeLink on the runner, in front of
  # the build host's cache, runs every action on a macOS worker of its own;
  # the results are kept in GitHub's cache, since the build host's can't be
  # written from here, so an action whose inputs haven't changed is a hit.
  # Two jobs side by side, since they share little: the apps build the
  # bridge for the phone, the simulator and the Mac, the tests the workspace
  # for this Mac. A fork's pull request, with no tailnet, runs on the
  # runner's NativeLink alone.
  macos:
    name: ${{ matrix.name }}
    runs-on: macos-26
    timeout-minutes: 100
    env:
      REMOTE: ${{ secrets.TS_OAUTH_CLIENT_ID != '' && inputs.without-build-host != true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The phone's suites lease the golden simulator, which the first
          # step makes; then everything under apps/apple builds and its
          # tests run: the package suites and the hosted app suite on the
          # simulator, the Mac's tests on the runner. The phone's shipping
          # build is left to `just ios release` on the Mac: its bridge is a
          # fat-LTO link of the whole Rust graph for one more target, the
          # heaviest build in the job on this runner's three cores, and it
          # reruns on every Rust change.
          - name: Apple apps
            key: apple
            run: just ios simulator golden && scripts/buck2 build //apps/apple/... && scripts/buck2 test //apps/apple/...
          # Every workspace test that isn't Linux-only, the terminal
          # journeys among them: the macOS half of what the Linux gate runs.
          - name: macOS tests
            key: tests
            run: just test //crates/...
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Refuse fixture update flags
        run: scripts/no-update-flags.sh
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version | grep -Fx 'Xcode 26.6'
      - name: Assert simulator runtime and device type
        if: matrix.key == 'apple'
        run: |
          xcrun simctl list runtimes --json | jq -e '.runtimes[] | select(.identifier == "com.apple.CoreSimulator.SimRuntime.iOS-26-5" and .isAvailable == true)'
          xcrun simctl list devicetypes --json | jq -e '.devicetypes[] | select(.identifier == "com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro")'
      # Python 3.14 unpacks the pinned Buck2 and NativeLink
      # (scripts/buck-tools.py).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      # The pinned toolchain Buck2's Rust rules call by path, with the
      # phone's targets; Buck2 keeps its own outputs, so no Cargo cache.
      - uses: ./.github/actions/setup-rust
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
          cache: "false"
      # The harness drives terminal sessions in tmux.
      - name: Install tmux
        run: brew install tmux
      - name: Join the tailnet
        if: env.REMOTE == 'true'
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ env.BUILD_HOST }}
      # The tailscale action points the whole of a macOS runner's DNS at
      # MagicDNS, which cannot answer public names there: github.com stopped
      # resolving and the NativeLink download failed. Give the system resolver
      # back to the runner's own servers and send only the tailnet's domain to
      # MagicDNS, the split Tailscale's own macOS client sets up.
      - name: Resolve only the tailnet's names through MagicDNS
        if: env.REMOTE == 'true'
        run: |
          sudo networksetup -setdnsservers Ethernet Empty
          sudo networksetup -setsearchdomains Ethernet Empty
          sudo mkdir -p /etc/resolver
          echo "nameserver 100.100.100.100" | sudo tee "/etc/resolver/${BUILD_HOST#*.}" > /dev/null
          sudo dscacheutil -flushcache
          sudo killall -HUP mDNSResponder
          scripts/py -c 'import socket, sys; [print(name, socket.gethostbyname(name)) for name in sys.argv[1:]]' \
            github.com "$BUILD_HOST"
      - name: Restore the results of earlier runs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/results
          key: macos-${{ matrix.key }}-results-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            macos-${{ matrix.key }}-results-${{ github.sha }}-
            macos-${{ matrix.key }}-results-
      - name: Start a NativeLink on the runner
        run: |
          if [ "$REMOTE" = true ]; then
            nohup scripts/py scripts/nativelink.py macos "$RUNNER_TEMP/nativelink" --remote "grpc://$BUILD_HOST:50051" \
              --results "$RUNNER_TEMP/results" > "$RUNNER_TEMP/nativelink.log" 2>&1 &
          else
            nohup scripts/py scripts/nativelink.py run --remote none > "$RUNNER_TEMP/nativelink.log" 2>&1 &
          fi
          for _ in $(seq 60); do nc -z 127.0.0.1 50051 && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/nativelink.log"; exit 1
      # Bounded below the job's timeout, so a run that runs out of time
      # still keeps what it finished: a job stopped by its own timeout or
      # cancelled doesn't get to save the results, and every run after it
      # started cold again.
      - name: Run ${{ matrix.name }}
        timeout-minutes: 75
        env:
          AMUX_NATIVELINK: grpc://127.0.0.1:50051
        run: ${{ matrix.run }}
      - name: Say what Buck2 ran and what came from the cache
        if: always()
        run: |
          for log in buck-out/v2/log/*_build_*.pb.zst buck-out/v2/log/*_test_*.pb.zst; do
            [ -e "$log" ] || continue
            scripts/buck2 log summary "$log" | grep -E '^Showing|^- (Local|Remote|Cached|Other) actions' || true
          done
      - name: Show NativeLink's log
        if: failure()
        run: tail -n 300 "$RUNNER_TEMP/nativelink.log" || true
      - name: Keep the results
        if: always() && env.REMOTE == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/results
          key: macos-${{ matrix.key }}-results-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
