[package]
name = "ui-view"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Pure content values both amux clients compose: chat rows, ask cards, the strip, the fleet and the review document"
publish = false
autotests = false

[features]
default = []
# JSON Schema derives for generating the Swift mirrors (`ios-tools`).
schema = ["dep:schemars", "ui-state/schema", "wire/schema"]

[dependencies]
attachments = { workspace = true }
preview = { workspace = true }
pulldown-cmark = { workspace = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true }
ui-state = { workspace = true }
wire = { workspace = true }

[dev-dependencies]
interpret = { workspace = true }
proptest = { workspace = true }
prost = { workspace = true }

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true
