// Classes the Compose compiler should treat as stable in :features and :shell.
//
// `sh.amux.values` is generated from the Rust values that cross the bridge:
// every class there is a data class of read-only properties, decoded fresh
// for each change and never mutated afterwards. `sh.amux.words` holds the
// wording and parsing helpers built on them, equally immutable. Both live in
// pure JVM modules without the Compose compiler, so without this file every
// composable taking one of them is restartable but never skippable.
sh.amux.values.**
sh.amux.words.**
