[[row]]
id = "C15"
item = "Question"
claude_pty = { mark = "full", carriers = ["ask:question", "item:ask.question", "item:ask.closed.answers"], golden = [" ask final ", " question×", " ASK_OUTCOME_ANSWERED answered "] }
claude_sdk = { mark = "full", carriers = ["ask:question", "item:ask.question", "item:ask.closed.answers"], golden = [" ask final ", " question×", " ASK_OUTCOME_ANSWERED answered "] }
codex = { mark = "partial", carriers = ["ask:question", "item:ask.question", "item:ask.closed.answers"], golden = [" ask final ", " question×", " ASK_OUTCOME_ANSWERED answered "] }

[[row]]
id = "C16"
item = "Plan review"
claude_pty = { mark = "full", carriers = ["item:plan", "ask:plan"], golden = [" plan final ", " PLAN_VERDICT_SENT_BACK"] }
claude_sdk = { mark = "full", carriers = ["item:plan", "ask:plan"], golden = [" plan final ", " PLAN_VERDICT_APPROVED"] }
