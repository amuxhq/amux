]

[[contract]]
id = "fleet-row-facts"
source = "invariant"
section = "Fleet"
claim = "Every agent has a name, a word pair when none was given; its since-when moves only when its phase does, so home keeps its order while agents stream; families sit in their loudest member's section, newest first."
