syntax = "proto3";

package amux.v1;

import "amux/v1/claude.proto";
import "amux/v1/codex.proto";
import "amux/v1/records.proto";

// The agent process's contract with its daemon: the input vocabulary, the
// immutable spec file each incarnation starts from, and the frames on the
// agent directory's ctl.sock. The journal between them frames Step
// (records.proto).

// A client-generated input id, the agent's kind, and that kind's input
// message encoded. Daemons forward the bytes untouched; only the agent of
// that kind decodes them, so an arm or field this daemon does not know
// reaches a newer agent intact. The reply is the interpreter's verdict,
// never a handover receipt. The daemon decodes a copy for its analytics and
// tolerates a copy it cannot decode.
message Input {
  bytes input_id = 1;
  Kind kind = 2;
  // ClaudePtyInput, ClaudeSdkInput or CodexInput, as `kind` names.
  bytes body = 3;
}

// A prompt with its client-generated input id, where a whole Input would
// admit arms that are not a prompt.
message PromptSubmission {
  bytes input_id = 1;
  PromptInput prompt = 2;
}

// One immutable file per incarnation, spec.<n> in the agent directory. The
// daemon writes it before each spawn and never rewrites it; a resume writes
// the next one from current config.
message AgentSpec {
  // The directory name; ours, never the provider's.
  bytes agent_id = 1;
  bytes profile_id = 2;
  // claude_pty | claude_sdk | codex
  string kind = 3;
  // The project directory the provider child is launched in, frozen at
  // spawn.
  string cwd = 4;
  // The agent's name when this incarnation was spawned; a rename while it
  // runs reaches the row, and a Codex agent hears it on ctl.sock.
  string name = 5;
  // The inventory row's parent, host and id, so a child resumed from its
  // spec on one host still addresses a parent on another.
  optional AgentParent parent = 6;
  // Exactly what the daemon resolved: model, permission mode, sandbox.
  repeated string provider_args = 7;
  map<string, string> provider_env = 8;
  // As configured, re-resolved on every spawn and resume.
  string provider_command = 9;
  // Exactly what the agent process reads at start and nothing the daemon
  // consumes.
  EffectiveConfig config = 10;
  // Which binary wrote this.
  string daemon_version = 11;
  int64 created_at_ms = 12;
  // The n in spec.<n>.
  uint32 incarnation = 13;
  // The path that ran for this incarnation: a record, not an instruction.
  string provider_binary = 14;
  // What that binary reported, for the same reason.
  string provider_version = 15;
  // What seeds the child's queue: the spawn's prompt, or a parent's
  // message on a parent-driven resume. Daemon-owned; a client never
  // supplies an envelope.
  optional Bootstrap bootstrap = 16;
  // What the host's provider offers, from the daemon's copy for the host,
  // for a kind that cannot be asked itself: terminal Claude. Absent when
  // the host has no copy.
  optional Catalogue offered = 17;
  // The branch the agent's worktree was made from, when its host made one:
  // what its git facts measure the branch against. Absent otherwise, and
  // the repository's default branch is the base.
  optional string base_branch = 18;
}

message Bootstrap {
  oneof of {
    PromptSubmission prompt = 1;
    Envelope agent_message = 2;
  }
}

// What `amux catalogue <provider>` learned by running the provider just
// long enough to ask. The helper writes it; the daemon keeps it as its copy
// for the host, stamped with when it was asked.
message ProviderOffer {
  // Decoded: the daemon encodes it and names the copy by the hash of
  // exactly those bytes.
  Catalogue catalogue = 1;
  bool signed_in = 2;
  // What `<provider> --version` printed, as printed.
  string provider_version = 3;
  int64 asked_at_ms = 4;
}

message EffectiveConfig {
  // Hook policy: which provider hooks the agent process installs.
  repeated string hooks = 1;
  // How long the agent waits for a daemon after ctl.sock closes (or before
  // one first dials in) before it drains.
  uint32 grace_ms = 2;
  // How long a draining agent with no daemon keeps an ask open before it
  // exits orphaned.
  uint32 drain_ms = 3;
  uint64 facts_ring_bytes = 4;
  uint64 journal_segment_bytes = 5;
  optional string model = 6;
  // The permission and mode the agent was created with, as its catalogue
  // names them.
  optional string permission = 7;
  optional string mode = 8;
  // Environment additions for the provider child.
  map<string, string> env = 9;
  // The canonical install path the hook binary and tool server run from.
  string install_path = 10;
}

// ctl.sock frames, length-prefixed, no version integer.
// EOF in either direction means the peer is gone.
message CtlFrame {
  oneof of {
    // Agent to daemon, first frame.
    AgentHello hello = 1;
    // Agent to daemon: the journal grew.
    Nudge nudge = 2;
    // Daemon to agent: a person's input, bytes as the client sent them.
    Input input = 3;
    // Daemon to agent: an agent message with its daemon-set envelope; the
    // recipient's interpreter picks the carrier. Answered by `reply` keyed
    // by the envelope id.
    Envelope agent_message = 4;
    // Daemon to agent: asks for its part of a dump bundle, answered by
    // `dump`.
    AgentDumpRequest dump_request = 5;
    // Daemon to agent (Codex): the agent was renamed; Codex's thread takes
    // the name so Codex's own app shows what amux does.
    Rename rename = 6;
    // Daemon to agent.
    Stop stop = 7;
    // Agent to daemon, answering a dump request.
    DumpPart dump = 8;
    // Agent to daemon: the verdict on an input (keyed by its input id) or
    // on an agent message (keyed by its envelope id). The daemon relays an
    // input's verdict as the SendInput reply and uses a message's verdict
    // to settle its delivery.
    Verdict reply = 9;
  }
}

message AgentDumpRequest {
  bytes dump_id = 1;
}

message Rename {
  string name = 1;
}

message AgentHello {
  bytes agent_id = 1;
  string agent_version = 2;
  uint64 journal_offset = 3;
}

message Nudge {}

message Stop {
  StopMode mode = 1;
}

// Named apart from the Interrupt input so the two are never confused.
enum StopMode {
  GRACEFUL = 0;
  ABORT = 1;
  KILL = 2;
}

// The agent process's part of a dump: its facts ring and checkpoint,
// already redacted.
message DumpPart {
  bytes dump_id = 1;
  repeated DumpFile files = 2;
}

message DumpFile {
  string name = 1;
  bytes contents = 2;
}

message Verdict {
  // The input id or the envelope id.
  bytes id = 1;
  SendInputResponse verdict = 2;
}

// pty.sock frames, framed as on ctl.sock. Raw attach is local only: a
// terminal client on the agent's machine finds pty.sock by path and is
// attached for as long as it holds the connection. EOF from the agent means
// the view ended (the agent exited, or a Codex view's process did).
message PtyFrame {
  oneof of {
    // Agent to client, first frame.
    PtyHello hello = 1;
    // Agent to client, files mode: the terminal log now ends at this
    // position.
    uint64 written = 2;
    // Agent to client, stream mode: what the view's terminal drew.
    bytes output = 3;
    // Client to agent: bytes for the terminal, as typed.
    bytes keys = 4;
    // Client to agent.
    PtyResize resize = 5;
    // Agent to client, last frame: why the connection ends.
    string closed = 6;
  }
}

enum PtyMode {
  // Terminal Claude: the one terminal's bytes are the pty/ files; the
  // client reads them by position and the agent says how far they go.
  PTY_MODE_FILES = 0;
  // Codex: each connection is its own `codex resume` on the agent's thread,
  // its bytes streamed and never retained.
  PTY_MODE_STREAM = 1;
}

message PtyHello {
  PtyMode mode = 1;
  // Files mode: the oldest byte the pty/ files still hold, where a client
  // rebuilding the screen starts reading.
  uint64 start = 2;
  // Files mode: where the terminal log ends now.
  uint64 written = 3;
}

message PtyResize {
  uint32 rows = 1;
  uint32 cols = 2;
}
