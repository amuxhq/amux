# CI checks every protocol model at its CI bounds and walks the simulated
# stories under a few seeds on each push. This workflow checks the models
# at their nightly bounds, which explore further than a push can wait for,
# each model in a job of its own, and walks thousands of seeds per story.
name: Models at nightly bounds

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  nightly:
    name: Nightly bounds (${{ matrix.model }})
    runs-on: ubuntu-latest
    # GitHub's cap for a hosted job: the single daemon's peer took two hours
    # on the enrolled Mac's 12 threads, and the runner is several times slower.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        model: [client, composed, family, lifecycle, path, presence, relay, replication, single_daemon, socket, supervisor, workspaces]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The models job's cache: this job builds the same test binaries.
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: models
          save-if: "false"
          nextest: "true"
      - name: Check the model at its nightly bounds
        run: just models-nightly ${{ matrix.model }}

  seeds:
    name: Simulated stories, many seeds
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: test
          save-if: "false"
          nextest: "true"
      # The models run in the matrix above, so this walks seeds only; each
      # story prints its failing seeds and a failing seed the `just sim
      # --seed` that reruns it. `just sim` is bounded for its few seeds a
      # push; this walk takes about twenty minutes, so it carries its own.
      - name: Walk every simulated story under 2000 seeds
        run: scripts/bounded 3000 scripts/py scripts/sim.py --seeds 2000
