# `just proto-compat` runs both checks: `buf lint` on the tree, and `buf
# breaking` against the latest release (docs/WIRE.md says what they guard).
version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  ignore:
    # Vendored: the googleapis files, as Google wrote them.
    - proto/google
breaking:
  use:
    - PACKAGE
    # A retired field or enum value may go, but only if its number is left
    # `reserved`; plain PACKAGE would refuse any deletion at all.
    - FIELD_NO_DELETE_UNLESS_NUMBER_RESERVED
    - ENUM_VALUE_NO_DELETE_UNLESS_NUMBER_RESERVED
  except:
    - FIELD_NO_DELETE
    - ENUM_VALUE_NO_DELETE
  ignore:
    - proto/google
  # One rename, CreateAgentRequest.new_worktree to new_workspace, keeping
  # its number and type: protobuf sends numbers, the Swift apps reach the
  # daemon through the FFI's own JSON values, and amux has no third-party
  # clients, so only Rust callers changed. Remove this after the next
  # release tag, which carries the new name.
  ignore_only:
    FIELD_SAME_NAME:
      - proto/amux/v1/agent_service.proto
    FIELD_SAME_JSON_NAME:
      - proto/amux/v1/agent_service.proto
