[package]
name = "store"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The profile store: one SQLite file per profile holding own and replica agent rows"
publish = false

[features]
default = ["bundled"]
bundled = ["rusqlite/bundled"]

[dependencies]
prost = { workspace = true }
rusqlite = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
wire = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
