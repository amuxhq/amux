[package]
name = "tui"
version = "0.5.0"
edition.workspace = true
license.workspace = true
description = "amux terminal client: the fleet and the chat, composed from the view library"
publish = false
autotests = false

[features]
default = []
# Named frames over interpreter fixtures, for goldens and screenshots.
fixtures = []

# Views come from ui-view over the state ui-runtime's drivers keep; the TUI
# owns layout, keys and ephemeral view state only.
[dependencies]
attachments = { workspace = true }
client = { workspace = true }
ui-runtime = { workspace = true }
ui-state = { workspace = true }
settings = { workspace = true }
ui-view = { workspace = true }
wire = { workspace = true }
anyhow = { workspace = true }
arboard = { workspace = true }
base64 = "0.22"
crossterm = { workspace = true, features = ["event-stream"] }
futures-util = { workspace = true }
png = { workspace = true }
ratatui = { workspace = true }
prost = { workspace = true }
pulldown-cmark = { workspace = true }
syntect = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
# Display-cell measurement for wrapping and border math — the same
# versions ratatui itself renders with, so the two never disagree.
unicode-segmentation = "1"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
signal-hook = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
interpret = { workspace = true }
prost = { workspace = true }
provider-fakes = { workspace = true }
tempfile = { workspace = true }
testnet = { workspace = true }

[[test]]
name = "integration"
path = "tests/integration.rs"
