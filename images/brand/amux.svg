      C 695,242 740,272 764,319 L 864,529
      C 804,415 748,378 684,387
      C 570,400 461,536 300,712 Z"/>
    <linearGradient id="blue-ribbon" gradientUnits="userSpaceOnUse" x1="400" y1="850" x2="720" y2="405">
      <stop stop-color="#078bff"/>
      <stop offset=".5" stop-color="#096cf7"/>
      <stop offset="1" stop-color="#253abe"/>
    </linearGradient>
    <radialGradient id="rear-glow" gradientUnits="userSpaceOnUse" cx="1060" cy="850" r="580">
      <stop stop-color="#ffc365"/>
      <stop offset=".2" stop-color="#ffad60"/>
      <stop offset=".4" stop-color="#ff7395"/>
      <stop offset=".64" stop-color="#7e4bd5"/>
      <stop offset=".85" stop-color="#2e42c4"/>
      <stop offset="1" stop-color="#2e42c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crown-spectrum" gradientUnits="userSpaceOnUse" x1="445" y1="350" x2="700" y2="540">
      <stop stop-color="#079fff"/>
      <stop offset=".42" stop-color="#347aff"/>
      <stop offset="1" stop-color="#9747ff"/>
    </linearGradient>
    <radialGradient id="crown-light" gradientUnits="userSpaceOnUse" cx="630" cy="235" r="245">
