# The phone's gate, apart from ci.yml so that it runs only when a change
# reaches the phone. Whatever else the bridge reads crosses to Swift as the
# generated mirrors in apps/apple, which a workspace test holds to the Rust
# definitions, so a shape change upstream cannot land without touching the
# app. Behaviour upstream is the workspace tests' to judge, and ci.yml's iOS
# target check compiles the bridge's graph on every push. The phone's own
# scripts and tools live under apps/apple and crates/ios-tools; the files
# named one by one are the shared runners the gate's recipes call.
name: iOS gate

on:
  push:
    branches: [main]
    paths: &phone
      - 'apps/apple/**'
      - 'crates/app-ffi/**'
      - 'crates/app-embedded/**'
      - 'crates/app-runtime/**'
      - 'crates/ios-tools/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'scripts/bounded'
      - 'scripts/no-update-flags.sh'
      - 'scripts/py'
      - 'scripts/sqlite_linkage.py'
      - 'scripts/with'
      - '.github/actions/setup-just/**'
      - '.github/workflows/ios.yml'
  pull_request:
    branches: [main]
    paths: *phone
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  gate:
    name: iOS gate
    runs-on: macos-26
    # The gate builds the app and runs the suites one simulator can answer.
    # The capture suites are not here: see `just ios captures`.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Refuse fixture update flags
        shell: bash
        run: scripts/no-update-flags.sh
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version | grep -Fx 'Xcode 26.6'
      - name: Assert simulator runtime and device type
        run: |
          xcrun simctl list runtimes --json | jq -e '.runtimes[] | select(.identifier == "com.apple.CoreSimulator.SimRuntime.iOS-26-5" and .isAvailable == true)'
          xcrun simctl list devicetypes --json | jq -e '.devicetypes[] | select(.identifier == "com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro")'
      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
        with:
          components: clippy
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      # Named, because the iOS captures job restores it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ios-gate
      - uses: ./.github/actions/setup-just
      - name: Install build tools
        run: brew install xcodegen
      # The bridge is five minutes of the gate and most pushes that reach it
      # change no Rust. Its own recipe skips cargo when the fingerprint of its
      # inputs matches what it last built, so a bridge restored under that
      # fingerprint is used as it is.
      - name: Fingerprint the bridge's inputs
        id: bridge
        run: echo "fingerprint=$(scripts/py -B apps/apple/Tools/ios-rust.py --fingerprint)" >> "$GITHUB_OUTPUT"
      - name: Restore the bridge built from these sources
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            target/ios/AmuxAppDebugTools.xcframework
            target/ios/AmuxApp.xcframework
            target/ios/AmuxApp.xcframework.stand-in
            target/ios/rust-stamp.json
            target/ios/framework.sha256
          key: ios-bridge-xcode-26.6-${{ hashFiles('.github/workflows/ios.yml') }}-${{ steps.bridge.outputs.fingerprint }}
      - name: Run the iOS gate
        run: just ios gate
      - name: Upload the shipped-scope audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-scope-audit
          path: target/ios/scope-audit
          if-no-files-found: warn
          retention-days: 7
