      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="warm-fold" gradientUnits="userSpaceOnUse" x1="712" y1="703" x2="1024" y2="977">
      <stop stop-color="#303bb6"/>
      <stop offset=".3" stop-color="#a64bba"/>
      <stop offset=".58" stop-color="#ff7374"/>
      <stop offset="1" stop-color="#ffc158"/>
