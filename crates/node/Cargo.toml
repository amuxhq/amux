[package]
name = "node"
version = "0.10.0"
edition.workspace = true
license.workspace = true
description = "The amux daemon: installation, profile runtimes, the agent registry and startup"
publish = false
autotests = false

[dependencies]
log-file = { workspace = true }
agent-dir = { workspace = true }
attachments = { workspace = true }
analytics = { workspace = true }
git-facts = { workspace = true }
# Names each changed file's language by the rule every client colours
# code by.
highlight = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
jiff = { workspace = true }
core-ring = { workspace = true }
daemon-core = { workspace = true }
relay-core = { workspace = true }
path-core = { workspace = true }
socket-core = { workspace = true }
futures-util = { workspace = true }
hyper-util = { workspace = true }
http-body = { workspace = true }
quinn = { workspace = true }
rcgen = { workspace = true }
release = { workspace = true }
supervisor-core = { workspace = true }
ring = { workspace = true }
rustls = { workspace = true }
socket2 = { workspace = true }
tokio-rustls = { workspace = true }
tokio-util = { workspace = true }
tower = { workspace = true }
webpki-roots = { workspace = true }
hpke = { workspace = true }
redaction = { workspace = true }
journal = { workspace = true }
prost = { workspace = true }
reqwest = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
settings = { workspace = true }
sha2 = { workspace = true }
store = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "v5"] }
wire = { workspace = true, features = ["grpc"] }
zstd = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# wt is Unix-only, and the phone's runtime hosts no agents, so it makes no
# workspaces.
[target.'cfg(all(unix, not(any(target_os = "ios", target_os = "android"))))'.dependencies]
wt = { workspace = true }

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
if-addrs = { workspace = true }
mdns-sd = "0.21"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
source-tree = { workspace = true }
interpret = { workspace = true }
release = { workspace = true, features = ["test-key"] }
journal = { workspace = true, features = ["synthetic"] }
patience = { workspace = true }
provider-fakes = { workspace = true }
replay-support = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }
# The shared review page, drawn from what the host answers.
ui-view = { workspace = true }

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true
