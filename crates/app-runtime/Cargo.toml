[package]
name = "app-runtime"
version = "0.2.0"
edition.workspace = true
license.workspace = true
description = "The phone's chats and fleet over the local runtime: session and fleet drivers with changes gathered for the host's next turn"
publish = false
autotests = false

[features]
default = []
# JSON Schema derives for generating the Swift mirrors (`ios-tools`).
schema = ["dep:schemars", "ui-state/schema", "ui-view/schema", "wire/schema"]

[dependencies]
client = { workspace = true }
prost = { workspace = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true }
tokio = { workspace = true }
ui-runtime = { workspace = true }
ui-state = { workspace = true }
ui-view = { workspace = true }
wire = { workspace = true }

[dev-dependencies]
models = { workspace = true }
provider-fakes = { workspace = true }
serde_json = { workspace = true }
testnet = { workspace = true }

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true
