thiserror = { workspace = true }
tokio = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
provider-fakes = { workspace = true }
release = { workspace = true, features = ["test-key"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
