[workspace]
resolver = "2"
members = [
    "crates/agent",
    "crates/analytics",
    "crates/app-embedded",
    "crates/app-ffi",
    "crates/app-runtime",
    "crates/agent-dir",
    "crates/amux",
    "crates/attachments",
    "crates/claude",
    "crates/claude-protocol",
    "crates/claude-specs",
    "crates/client",
    "crates/codex",
    "crates/codex-protocol",
    "crates/codex-specs",
    "crates/fake-amux",
    "crates/git-facts",
    "crates/interpret",
    "crates/journal",
    "crates/model",
    "crates/models",
    "crates/node",
    "crates/patience",
    "crates/provider-fakes",
    "crates/pty-host",
    "crates/qualification",
    "crates/redaction",
    "crates/replay-support",
    "crates/settings",
    "crates/shot",
    "crates/store",
    "crates/testnet",
    "crates/tui",
    "crates/tui-set",
    "crates/ui-runtime",
    "crates/ui-state",
    "crates/ui-view",
    "crates/release",
    "crates/version-stamp",
    "crates/wire",
    "crates/xtask",
]

[workspace.package]
edition = "2024"
license = "FSL-1.1-ALv2"

[workspace.dependencies]
# Internal
agent = { path = "crates/agent" }
agent-dir = { path = "crates/agent-dir" }
analytics = { path = "crates/analytics" }
app-embedded = { path = "crates/app-embedded" }
app-ffi = { path = "crates/app-ffi" }
app-runtime = { path = "crates/app-runtime" }
node = { path = "crates/node" }
patience = { path = "crates/patience" }
release = { path = "crates/release" }
version-stamp = { path = "crates/version-stamp" }
testnet = { path = "crates/testnet" }
client = { path = "crates/client" }
interpret = { path = "crates/interpret" }
journal = { path = "crates/journal" }
model = { path = "crates/model" }
models = { path = "crates/models" }
store = { path = "crates/store" }
wire = { path = "crates/wire" }
settings = { path = "crates/settings" }
attachments = { path = "crates/attachments" }
git-facts = { path = "crates/git-facts" }
ui-runtime = { path = "crates/ui-runtime" }
ui-state = { path = "crates/ui-state" }
ui-view = { path = "crates/ui-view" }
tui = { path = "crates/tui" }
pty-host = { path = "crates/pty-host" }
provider-fakes = { path = "crates/provider-fakes" }
claude = { path = "crates/claude" }
claude-protocol = { path = "crates/claude-protocol" }
codex = { path = "crates/codex" }
codex-protocol = { path = "crates/codex-protocol" }
redaction = { path = "crates/redaction" }

# Shared
portable-pty = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "process", "fs", "signal", "test-util"] }
tokio-util = { version = "0.7", features = ["compat"] }
libc = "0.2"
signal-hook = "0.3"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The Swift mirrors of the shared values are generated from their schemas.
schemars = "1"
postcard = { version = "1", features = ["alloc"] }
serde_yaml = "0.9"
toml = "0.8.23"
prost = "0.14"
prost-types = "0.14"
protoc-bin-vendored = "3"
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower = "0.5"
hyper-util = { version = "0.1", features = ["tokio"] }
hyper = { version = "1", features = ["http1", "server"] }
http-body-util = "0.1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
futures-util = "0.3"
yamux = "0.14"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
gethostname = "1"
oauth2 = "5"
async-trait = "0.1"
# default-features off to avoid enabling both ring and aws-lc-rs (reqwest
# already activates ring; having both makes rustls panic at runtime).
tokio-rustls = { version = "0.26", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
webpki-roots = "1"
rustls-pemfile = "2"
ring = "0.17"
curve25519-dalek = "4.1"
rcgen = { version = "0.14.8", default-features = false, features = ["crypto", "pem", "ring"] }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
semver = "1"
sha2 = "0.10"
fontdue = "0.9"
gif = "0.14.2"
png = "0.17.16"
# The system clipboard, for pasting an image or a file into a chat draft.
arboard = "3.6"
socket2 = "0.6"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0.101"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
tracing-appender = "0.2"
tempfile = "3"
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "serde"] }
pulldown-cmark = { version = "0.13", default-features = false }
# Grammars only (no themes: the terminal's palette colours the tokens), with
# the pure-Rust regex engine so no C library is linked.
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
shell-words = "1"
glob = "0.3"
bytes = "1"
qrcode = { version = "0.14", default-features = false }
nix = { version = "0.31", features = ["process", "signal"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["hooks"] }
rustix = { version = "1.1", features = ["fs"] }
if-addrs = "0.13"
# A screen model of an attached agent's terminal, so leaving it for the
# fleet and coming back repaints the same process where it was.
vt100 = "0.15"
# Compression for the channels between daemons; the raw streaming API only.
zstd = { version = "0.13", default-features = false }
# The exhaustive checker the protocol models run under; its seeded chooser
# drives their walks.
stateright = "0.31"

# Cargo defaults macOS debug profiles to split-debuginfo = "unpacked", which
# keeps every codegen unit's object file under target/<profile>/deps for the
# debugger and never removes it; with incremental compilation each rebuild
# leaves the previous session's objects behind. Measured at 26 GiB of the
# canonical's 45 GiB target and 158 GiB in one worktree. "packed" keeps one
# dSYM per product binary instead (dsymutil runs at link, for a few binaries).
# The Apple-only rustflag lives in .cargo/config.toml so Windows never receives
# a split-debuginfo value it does not support. Development and tests share this
# profile so each workspace crate has one reusable configuration.
#
# No debug info at all, even line tables: every test and tool binary then got
# a dSYM, 5.7 GiB of the canonical's 17 GiB target, and each wt tree rewrites
# them all whenever a core crate changes. Panic and assert messages still name
# their file and line; that comes from the panic, not from debug info. Use the
# full-debug profile for a debugger.
[profile.dev]
debug = false
incremental = true
panic = "unwind"

# What a release ships, for the daemon and the phone alike, and what perf runs
# measure, so the numbers are the shipped binary's. Whole-program optimisation
# (fat LTO over one codegen unit) makes the binaries smaller and no slower, at
# the cost of a much longer build. Line tables are split from the daemon when
# the release workflow strips it, and published beside it so a crash can be
# symbolicated later; the app's linker leaves them out of the phone's binary.
[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
panic = "abort"
incremental = false

[profile.full-debug]
inherits = "dev"
debug = 2

# The bridge every development build of the phone app links. Optimised like a
# release, but without LTO: whole-program optimisation would take a core edit's
# rebuild from about 30 seconds to about 100, and keep a copy of every crate's
# LLVM bitcode beside its code, five times the library's size on disk.
[profile.phone-dev]
inherits = "release"
lto = false
codegen-units = 16
debug = false
