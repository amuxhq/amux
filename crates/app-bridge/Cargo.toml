[package]
name = "app-bridge"
version = "0.2.0"
edition.workspace = true
license.workspace = true
description = "The language-neutral bridge over the embedded runtime, its chats and fleet, with view values as JSON"
publish = false

[features]
default = []
# Affordances a driving build carries and a shipping build must not.
debug-tools = []

[dependencies]
app-embedded = { workspace = true }
app-runtime = { workspace = true }
client = { workspace = true }
futures-util = { workspace = true }
node = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
ui-state = { workspace = true }
ui-view = { workspace = true }
wire = { workspace = true }

# Installing amux is a desktop app's first call; the phone hosts its own
# runtime and has nothing to install.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
installer = { workspace = true }
