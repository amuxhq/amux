[package]
name = "qualification"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
autotests = false

[features]
# The release perf binary. The workloads themselves build without it, so
# their smoke runs in the ordinary test lane.
perf = []
# The live provider compatibility lane: real providers under the operator's
# login, run only on request through `just live`.
live = []

[lib]

[[bin]]
name = "perf"
path = "src/bin/perf.rs"
required-features = ["perf"]

# The relay's scaling curve, built in release by `just relay-curve`.
[[bin]]
name = "relay-curve"
path = "src/bin/relay_curve.rs"
required-features = ["perf"]

# The performance workloads' topologies, written for `testnet serve` (the
# phone's by `just ios perf`); needs no feature, so the ordinary tools build
# carries it.
[[bin]]
name = "perf-topology"
path = "src/bin/perf_topology.rs"
test = false

# The live lane's probes: each stands in for its provider on the PATH,
# records what crosses, and joins a passing capture to the provider's
# corpus. Built by `just live` beside amux and the fakes.
[[bin]]
name = "claude-probe"
path = "src/bin/claude_probe/main.rs"

[[bin]]
name = "codex-probe"
path = "src/bin/codex_probe/main.rs"

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
node = { workspace = true }
provider-fakes = { workspace = true }
pty-host = { workspace = true }
quinn = { workspace = true }
rcgen = { workspace = true }
redaction = { workspace = true }
rustls = { workspace = true }
semver = { workspace = true, features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
testnet = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tonic = { workspace = true }
uuid = { workspace = true }
wire = { workspace = true, features = ["grpc"] }

[target.'cfg(unix)'.dependencies]
futures-util = { workspace = true }
libc = { workspace = true }
tokio-tungstenite = { workspace = true }

[dev-dependencies]
agent-dir = { workspace = true }
bytes = { workspace = true }
hyper-util = { workspace = true }
interpret = { workspace = true }
prost = { workspace = true }
tempfile = { workspace = true }
tower = { workspace = true }
ui-state = { workspace = true }
unicode-width = "0.2"
vt100 = { workspace = true }

[[test]]
name = "claude_pty_live"
path = "tests/claude_pty_live.rs"
harness = false
required-features = ["live"]

[[test]]
name = "claude_sdk_live"
path = "tests/claude_sdk_live.rs"
harness = false
required-features = ["live"]

[[test]]
name = "codex_live"
path = "tests/codex_live.rs"
harness = false
required-features = ["live"]

[[test]]
name = "integration"
path = "tests/integration.rs"
