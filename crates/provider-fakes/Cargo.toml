[package]
name = "provider-fakes"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Scripted stand-ins for the Claude, Codex and ACP agent binaries, for tests"
publish = false
autotests = false

[dependencies]
acp-protocol.workspace = true
jiff = { workspace = true }
claude-protocol.workspace = true
codex-protocol.workspace = true
futures-util = { workspace = true }
libc = { workspace = true }
pty-host = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[[bin]]
name = "fake-claude-sdk"
path = "src/bin/fake_claude_sdk.rs"

[[bin]]
name = "fake-claude-pty"
path = "src/bin/fake_claude_pty.rs"

[[bin]]
name = "fake-codex"
path = "src/bin/fake_codex.rs"

[[bin]]
name = "fake-acp"
path = "src/bin/fake_acp.rs"

[dev-dependencies]
source-tree = { workspace = true }
patience = { workspace = true }

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true
