syntax = "proto3";

package amux.v1;

import "amux/v1/link.proto";
import "amux/v1/records.proto";

// The inventory: hosts and agent rows, as InventoryService.SubscribeInventory
// streams them.

// Hosts and agent rows: the current set, CaughtUp, then deltas. A listing is
// this stream read to CaughtUp.
message InventoryEvent {
  oneof of {
    HostEntry host = 1;
    HostRemoved host_removed = 2;
    Agent agent = 3;
    AgentRemoved agent_removed = 4;
    CaughtUp caught_up = 5;
    // The stream fell behind and closes after this; the client resubscribes
    // at once and reconciles against the fresh listing.
    Lagged lagged = 6;
  }
}

// One host set: every trusted host is in every snapshot whatever its
// presence; candidates come and go with discovery and with the neighbors
// that announce them. HostRemoved only on untrust, or when a candidate
// disappears.
message HostEntry {
  // The host as it announced itself in its handshake; a paired host's name
  // is the one this machine's trust entry keeps for it.
  Host host = 1;
  // Bumped only after an unclean reboot of that host.
  uint64 generation = 2;
  // The agent programs the host runs, in the order a picker lists them:
  // Claude and Codex always, then each ACP agent the host offers once it
  // has asked it, built-in ones first.
  repeated ProviderOnHost providers = 3;
  oneof standing {
    // Paired with this machine, or this machine itself.
    Trusted trusted = 4;
    // Never paired: found by discovery, or announced by a neighbor.
    Candidate candidate = 5;
  }
  // Set when this host wants notifications: the key they are sealed to, on
  // the host's own entry in the inventory it serves. A daemon reads it only
  // from that stream, whose handshake proves who sent it, and keeps it with
  // its trust in the host; it is not on `Host`, which neighbors repeat.
  optional PushKey push_key = 6;
  // Where this host offers to start an agent, said on its own entry and
  // repeated as it said them: the folders its person pinned, in their
  // order, then the ones its agents started in, newest first, then the ones
  // Claude Code and Codex ran in lately outside amux. Each path once, at
  // most a few dozen. Clients search it themselves.
  repeated Folder folders = 7;
  // What experiments say about the host, each entry keyed by an
  // experiment's version and holding an encoded amux.experimental message.
  // A build reads only the entries of the versions it implements and
  // ignores every other key. The map is promised; its entries are not.
  // Empty outside experiments.
  map<string, bytes> experimental = 1000;
}

// A folder a host offers to start an agent in.
message Folder {
  // Absolute and canonical, on the host that offers it.
  string path = 1;
  // Its last component, as a picker names it.
  string name = 2;
  FolderKind kind = 3;
  // When an agent, or Claude Code or Codex outside amux, last started
  // there; absent for a pinned folder nothing started in yet.
  optional int64 last_used_ms = 4;
  // The working tree the folder is in; absent outside Git.
  optional Checkout checkout = 5;
}

// Why a host offers a folder. UNSPECIFIED is never sent.
enum FolderKind {
  FOLDER_KIND_UNSPECIFIED = 0;
  // Its person pinned it: the repositories in its settings.
  FOLDER_KIND_PINNED = 1;
  // An agent started there lately.
  FOLDER_KIND_RECENT = 2;
  // Claude Code or Codex ran there lately, outside amux.
  FOLDER_KIND_HISTORY = 3;
}

// A public key notifications are sealed to.
message PushKey {
  PushSuite suite = 1;
  bytes public_key = 2;
}

enum PushSuite {
  PUSH_SUITE_UNSPECIFIED = 0;
  // HPKE: DHKEM(X25519, HKDF-SHA256), HKDF-SHA256, ChaCha20-Poly1305.
  PUSH_SUITE_HPKE_X25519_CHACHA20 = 1;
}

message Trusted {
  // How the host reads from the daemon that lists it, from the outcome of
  // opening a channel to it. A host whose route comes up keeps the reach it
  // had until the first channel attempt on that route concludes.
  oneof reach {
    // The host is this machine itself.
    Here here = 1;
    // A channel to the host opened on a route still listed.
    Online online = 2;
    // The relay refused the channel because the account's plan carries no
    // connection between hosts: upgrading reaches this host.
    Away away = 3;
    // Anything else: no route, or a channel that failed for any reason but
    // the plan (no route at the relay, rate limited, revoked,
    // TLS or identity failure, timeout, link gone).
    Offline offline = 4;
  }
  // Whether this machine's copy of the host's inventory has caught up on a
  // live stream from it: its agents are as the host lists them now, not as
  // they were remembered. Cleared when the host is lost; a client that
  // reads every trusted host current has reconciled with its fleet.
  bool current = 5;
}

message Here {}

message Online {
  // The kind of route the channel opened on.
  RouteKind route = 1;
  // A direct route over a network both machines are on: a private,
  // unique-local, link-local or loopback address, as a client says Local.
  bool same_network = 2;
}

message Away {}

message Offline {
  // The outcome of the daemon's last failed dial attempt at this host,
  // cleared when a route comes up.
  optional string last_dial_error = 1;
  // The host closed its link saying it no longer trusts this machine;
  // cleared when it links to this machine again.
  bool revoked = 2;
}

message Candidate {
  // Where discovery found it; what pairing dials.
  repeated string addrs = 1;
  // The neighbors that announce the host, nearest route first: the ones
  // pairing goes through when no address answers. Each is one this machine
  // holds a link with, so an announcement is never more than one hop.
  // `capabilities.cloud_relay` is set from how this machine admitted that
  // link, not from what the neighbor said: the cloud relay forwards only for
  // a paid account, and a paired host forwards on any plan.
  repeated Host announced_by = 2;
  // The host's discovery advertisement says a pairing window is open on it,
  // so a PIN or QR secret can succeed now.
  bool pairing_open = 3;
}

// One agent program a host runs. Kind-neutral, so in the inventory and
// not a per-kind body: a client reads it to name an agent and decide what
// New Agent offers before any agent of the program exists, for programs
// it has never heard of.
message ProviderOnHost {
  // The provider's id: "claude", "codex", or an ACP agent's id
  // ("antigravity", "opencode", "grok", or one a person added in the host's
  // config). What CreateAgentRequest, GetCatalogueRequest and
  // Agent.provider name it by.
  string provider = 1;
  // The hash GetCatalogue answers with for this provider; absent until the
  // host has asked it, which GetCatalogue does.
  optional bytes catalogue = 2;
  // Whether the provider was signed in when the host asked it; says
  // nothing while `catalogue` is absent.
  bool signed_in = 3;
  // How clients name and start it.
  ProviderDescriptor descriptor = 4;
  // Each kind the provider runs as on this host, the descriptor's `kind`
  // among them: what CreateAgentRequest.kind may name. Terminal Claude is
  // not hosted on Windows.
  repeated KindOnHost kinds = 5;
}

// One kind a provider runs as on a host.
message KindOnHost {
  Kind kind = 1;
  // What an agent of this kind started on this host now can do: what a
  // client reads for an agent until its first snapshot says what it can.
  AgentCapabilities capabilities = 2;
}

// What a client needs to name a provider and start one of its agents,
// without knowing the provider.
message ProviderDescriptor {
  // What people call it ("Claude", "Codex", "OpenCode", or the name a
  // person gave their own agent).
  string name = 1;
  // The kind a new agent of this provider starts as on this host: for
  // Claude, the one the host's settings choose (terminal or headless).
  Kind kind = 2;
  // What a person does to sign in, in the provider's or amux's words
  // ("Run `opencode auth login` in the terminal"); empty when nothing is
  // known. amux never signs in for a person.
  string sign_in_hint = 3;
  // The program's version as it gave it when the host asked; empty where it
  // gives none.
  string version = 4;
}

// How this machine reaches a host, or how a pairing peer was reached. No
// value for "no route": the host reads offline.
enum RouteKind {
  ROUTE_KIND_UNSPECIFIED = 0;
  ROUTE_KIND_DIRECT = 1;
  ROUTE_KIND_RELAY = 2;
  ROUTE_KIND_SSH = 3;
}

message HostRemoved {
  bytes host_id = 1;
}

// The inventory row: lifecycle, filing and family from the daemon, and the
// status its newest snapshot reports, copied whole, never a snapshot.
message Agent {
  bytes agent_id = 1;
  bytes host_id = 2;
  Kind kind = 3;
  // Which agent program it runs, by its provider id ("claude", "codex", or
  // an ACP agent's, as ProviderOnHost names it). Clients name the agent
  // with the descriptor its host lists for that id.
  string provider = 4;
  // Every agent has one: the one it was given, else one the daemon chose.
  // Unique on its host: what agents and commands address it by.
  string name = 5;
  string cwd = 6;
  optional AgentRef parent = 7;
  int64 created_at_ms = 8;
  Lifecycle lifecycle = 9;
  // How the newest incarnation ended; absent while it runs.
  optional IncarnationEnd exit = 10;
  uint32 incarnation = 11;
  // Live agents below this one, on every host the agent's host knows of:
  // what a stop or delete would cut. Best effort; a host out of reach may
  // be undercounted.
  uint32 descendants = 12;
  // How the person filed the agent, apart from its lifecycle: an exited
  // agent left open reads as an ordinary one, and a closed one is done
  // with.
  Filing filing = 13;
  // When the filing last changed, on the clock of the agent's host; pins
  // are listed in this order.
  int64 filed_at_ms = 14;
  // Set on a provider subagent: an agent that Claude's Agent tool or a Codex
  // child thread started inside its parent's provider process. It has no
  // process, directory or composer of its own, its parent is always the
  // agent whose process runs it, and it takes no messages. Absent on every
  // agent amux started itself.
  optional NativeChild native = 15;
  // What the agent's newest snapshot said of it: its phase, git facts,
  // title, settings and the rest. Default until its first snapshot.
  AgentStatus status = 16;
  // What experiments say about the agent, each entry keyed by an
  // experiment's version (e.g. "workspaces/1") and holding an encoded
  // amux.experimental message. A build reads and writes only the entries of
  // the versions it implements and has on, and ignores every other key.
  // The map is promised; its entries are not. Empty outside experiments.
  map<string, bytes> experimental = 1000;
}

// What marks a provider subagent's row.
message NativeChild {
  // The provider's own id for it: Claude's agent id, Codex's thread id.
  string provider_child_id = 1;
}

enum Filing {
  FILING_UNSPECIFIED = 0;
  FILING_OPEN = 1;
  // Kept at the top of the fleet. Only an agent with no parent is pinned.
  FILING_PINNED = 2;
  // Done with: stopped when it was live, out of other agents' listing, and
  // the only kind retention deletes. A message from the person or its own
  // parent resumes it, filed open again.
  FILING_CLOSED = 3;
}

enum Lifecycle {
  LIFECYCLE_UNSPECIFIED = 0;
  LIFECYCLE_LIVE = 1;
  LIFECYCLE_EXITED = 2;
}

// The row left this daemon's view, which is not always deletion at the
// origin: a host that stops listing an agent, or that this machine stops
// trusting, takes its rows with it.
message AgentRemoved {
  bytes host_id = 1;
  bytes agent_id = 2;
}
