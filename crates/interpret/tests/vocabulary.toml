claude_sdk = { mark = "full", carriers = ["item:turn"], golden = [" turn final ", "TURN_OUTCOME_INTERRUPTED"] }
codex = { mark = "full", carriers = ["item:turn"], golden = [" turn final ", "TURN_OUTCOME_INTERRUPTED"] }

[[row]]
