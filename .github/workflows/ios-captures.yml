# The real interaction journeys and the accessibility sweep, dispatched by
# hand.
name: iOS captures

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # The build host whose cache the runner's NativeLink fronts (ci.yml's
  # macOS jobs say why).
  BUILD_HOST: nova.tail656fe8.ts.net

jobs:
  captures:
    name: iOS captures
    runs-on: macos-26
    # The capture suites drive the app on the golden device through served
    # networks. Leave room for the uploads.
    timeout-minutes: 270
    env:
      REMOTE: ${{ secrets.TS_OAUTH_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version | grep -Fx 'Xcode 26.6'
      - name: Assert simulator runtime and device type
        run: |
          xcrun simctl list runtimes --json | jq -e '.runtimes[] | select(.identifier == "com.apple.CoreSimulator.SimRuntime.iOS-26-5" and .isAvailable == true)'
          xcrun simctl list devicetypes --json | jq -e '.devicetypes[] | select(.identifier == "com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro")'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      # The journeys' tools still build with Cargo (`just ios tools`).
      - uses: ./.github/actions/setup-rust
        with:
          targets: aarch64-apple-ios-sim
          shared-key: ios-captures
      - name: Install tmux
        run: brew install tmux
      - name: Join the tailnet
        if: env.REMOTE == 'true'
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ env.BUILD_HOST }}
      # The tailscale action points the whole of a macOS runner's DNS at
      # MagicDNS, which cannot answer public names there: github.com stopped
      # resolving and the NativeLink download failed. Give the system resolver
      # back to the runner's own servers and send only the tailnet's domain to
      # MagicDNS, the split Tailscale's own macOS client sets up.
      - name: Resolve only the tailnet's names through MagicDNS
        if: env.REMOTE == 'true'
        run: |
          sudo networksetup -setdnsservers Ethernet Empty
          sudo networksetup -setsearchdomains Ethernet Empty
          sudo mkdir -p /etc/resolver
          echo "nameserver 100.100.100.100" | sudo tee "/etc/resolver/${BUILD_HOST#*.}" > /dev/null
          sudo dscacheutil -flushcache
          sudo killall -HUP mDNSResponder
          scripts/py -c 'import socket, sys; [print(name, socket.gethostbyname(name)) for name in sys.argv[1:]]' \
            github.com "$BUILD_HOST"
      # The Apple apps job's results, read-only, so the app and the UI tests
      # it already built are hits.
      - name: Restore the Apple apps job's results
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/results
          key: macos-apple-results-${{ github.sha }}-
          restore-keys: macos-apple-results-
      - name: Start a NativeLink on the runner
        run: |
          if [ "$REMOTE" = true ]; then
            nohup scripts/py scripts/nativelink.py macos "$RUNNER_TEMP/nativelink" --remote "grpc://$BUILD_HOST:50051" \
              --results "$RUNNER_TEMP/results" > "$RUNNER_TEMP/nativelink.log" 2>&1 &
          else
            nohup scripts/py scripts/nativelink.py run --remote none > "$RUNNER_TEMP/nativelink.log" 2>&1 &
          fi
          for _ in $(seq 60); do nc -z 127.0.0.1 50051 && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/nativelink.log"; exit 1
      # Every suite here drives the golden device; the small one is not used.
      - name: Boot the golden simulator
        run: just ios simulator golden
      - name: Run the capture suites
        env:
          AMUX_NATIVELINK: grpc://127.0.0.1:50051
        run: just ios captures
      - name: Upload journeys and the audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-captures
          path: |
            target/journeys/phone
            target/ios/accessibility
          if-no-files-found: warn
          retention-days: 7
