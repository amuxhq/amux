[package]
name = "daemon-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The daemon as one function of its state and an input: typed inputs in, typed outputs out"
publish = false

[dependencies]
postcard = { workspace = true }
journal = { workspace = true }
prost = { workspace = true }
serde = { workspace = true }
store = { workspace = true }
tracing = { workspace = true }
wire = { workspace = true }

[dev-dependencies]
journal = { workspace = true, features = ["synthetic"] }
tempfile = { workspace = true }
