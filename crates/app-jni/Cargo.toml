[package]
name = "app-jni"
version = "0.2.0"
edition.workspace = true
license.workspace = true
description = "The JNI facade the Android app calls: the embedded runtime, its chats and fleet, with view values as JSON"
publish = false

[lib]
name = "amux_app"
crate-type = ["cdylib"]

[features]
default = []
# Affordances a driving build carries and a shipping build must not.
debug-tools = ["app-bridge/debug-tools"]

[dependencies]
app-bridge = { workspace = true }
jni = { workspace = true }
libc = { workspace = true }

[lints]
workspace = true
