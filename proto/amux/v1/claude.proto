syntax = "proto3";

package amux.v1;

import "amux/v1/chat.proto";

// Claude's bodies: the item and snapshot messages encoded into Item.body
// and Snapshot.body for both kinds claude_pty and claude_sdk, the inputs
// each kind accepts, and the answers inside them.

message ClaudeCreateConfig {
  // Extra provider arguments exactly as the person gave them.
  repeated string args = 1;
  optional string model = 2;
  optional string effort = 3;
  // A permission Claude offers ("default", "acceptEdits", "plan", "auto",
  // "bypassPermissions").
  optional string permission = 4;
}

// ---------------------------------------------------------------------------
// Items and snapshots (for both Claude kinds)
// ---------------------------------------------------------------------------

message ClaudeItem {
  oneof kind {
    Prompt prompt = 1;
    Text message = 2;
    Thinking thinking = 3;
    ToolCall tool = 4;
    Turn turn = 5;
    Compaction compaction = 6;
    AgentMessage agent_message = 9;
    ApiError api_error = 10;
    Boundary boundary = 11;
    SlashOutput slash = 12;
    Unrecognized unrecognized = 13;
    // A prompt delivered into the running turn; the text is the envelope's.
    Steer steer = 14;
    // An ask that is its own row: a tool server's form or link, or a
    // dialog terminal Claude shows that no hook can answer.
    AskItem ask = 15;
    // The plan Claude declared, keyed by the call that declared it.
    Plan plan = 16;
    Task task = 17;
    Status status = 18;
    ModelSwitch model_switch = 19;
  }
}

// A task headless Claude reports whose starting call it never showed; a
// task of a known call is progress on that call instead.
message Task {
  string task_id = 1;
  string description = 2;
  TaskState state = 3;
  uint32 tool_count = 4;
  string last_tool = 5;
  uint64 tokens = 6;
}

enum TaskState {
  TASK_STATE_UNSPECIFIED = 0;
  TASK_STATE_RUNNING = 1;
  TASK_STATE_COMPLETED = 2;
  TASK_STATE_FAILED = 3;
  TASK_STATE_STOPPED = 4;
}

// A status headless Claude reports as an event worth a row; drawn hidden,
// read by the activity line until the compaction row lands.
message Status {
  SdkStatus status = 1;
  // Claude's own word, always carried.
  string word = 2;
}

enum SdkStatus {
  SDK_STATUS_UNSPECIFIED = 0;
  SDK_STATUS_COMPACTING = 1;
}

// Phase lives in the Snapshot envelope, once.
message ClaudeSnapshot {
  repeated Ask asks = 1;
  TaskList tasks = 2;
  ContextMeter context = 3;
  optional string model = 4;
  // The running model as a person reads it: the catalogue entry it was set
  // from, else the entry whose value is its id, else its id tidied.
  // Absent while the model is.
  optional string model_name = 5;
  optional string permission = 6;
  // Absent until the session's start names it.
  optional string provider_session = 7;
  ClaudeUsage usage = 8;
  repeated ToolServer servers = 9;
  SignIn sign_in = 10;
  BackgroundJobs background_jobs = 11;
  // Terminal Claude's calls PreToolUse hooks announced that no result has
  // ended yet, oldest first. A call's transcript row can lag its hook by
  // seconds while a background task runs, so the activity line reads the
  // call from here until then.
  repeated RunningCall running_calls = 12;
  // The reasoning effort Claude runs with; absent until it says. A
  // provider string, validated against the catalogue's model levels.
  optional string effort = 13;
  // Terminal Claude's own view resumed another conversation, so it shows
  // one that is not this agent's; prompts are refused until it is back.
  // The phase is left as it is.
  optional bool switched_away = 14;
  // The subagents and tasks headless Claude reports running.
  repeated Task active_tasks = 15;
  // What it offers is in the catalogue the Snapshot names.
}

message RunningCall {
  string tool_use_id = 1;
  string tool_name = 2;
  int64 since_ms = 3;
}

// ---------------------------------------------------------------------------
// Claude in a terminal
// ---------------------------------------------------------------------------

message CyclePermissionMode {}

message SwitchBack {}

// ---------------------------------------------------------------------------
// Usage (for both Claude kinds)
// ---------------------------------------------------------------------------

// Claude's usage limits. `state` says whether the agent can work at all,
// which is not the same as any one window when Claude allows overage.
message ClaudeUsage {
  UsageState state = 1;
  repeated ClaudeUsageWindow windows = 2;
}

message ClaudeUsageWindow {
  Limit limit = 1;
  // Set for a limit that belongs to one model.
  optional string model = 2;
  // Claude's own name for the window, shown when `limit` is unspecified.
  string provider_name = 3;
  UsageMeter meter = 4;
}

// ---------------------------------------------------------------------------
// Answers (for both Claude kinds)
// ---------------------------------------------------------------------------

message PermissionAnswer {
  oneof of {
    PermissionAllow allow = 1;
    PermissionDeny deny = 2;
  }
}

message PermissionAllow {
  // The position of a scope in the ask's scopes; absent allows once.
  optional uint32 scope = 1;
}

message PermissionDeny {
  string note = 1;
  bool stop = 2;
}
