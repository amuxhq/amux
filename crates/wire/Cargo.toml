[package]
name = "wire"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Committed protobuf types for the amux protocol"
publish = false

[features]
default = ["grpc"]
# The generated gRPC clients and servers, and tonic with them. The messages
# build without it, so a crate that only speaks them carries no tokio.
grpc = ["dep:tonic", "dep:tonic-prost"]

[dependencies]
prost = { workspace = true }
# Any, which an error status packs its details in.
prost-types = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
tonic = { workspace = true, optional = true }
tonic-prost = { workspace = true, optional = true }

