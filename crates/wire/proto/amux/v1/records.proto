syntax = "proto3";

package amux.v1;

// Session records: what an agent's interpreter writes to its journal, what
// the daemon commits to the store, and what every Subscribe stream carries.
//
// The daemon and the store read only the envelope (Step, Item, Append,
// Snapshot). An item or snapshot body is the per-kind message named by
// `kind`, encoded, and is decoded only by the interpreter that wrote it and
// by the client's per-kind layer. Bodies therefore pass through a daemon of
// any version intact.
//
// Every timestamp in the protocol is a field named `..._ms`: milliseconds
// since the Unix epoch, as an int64. A duration names its own unit
// (`grace_ms`, `ttl_seconds`, `window_minutes`) and is not a timestamp.

// ---------------------------------------------------------------------------
// Common
// ---------------------------------------------------------------------------

message Empty {}

// An agent anywhere in the fleet: the host it lives on and its id. A
// message's recipient and an agent's parent are both one.
message AgentRef {
  bytes host_id = 1;
  bytes agent_id = 2;
}

// An agent message. `from` is set by the daemon from the caller's identity;
// the recipient's daemon dedupes by id against the recipient's items.
message Envelope {
  bytes id = 1;
  optional bytes context = 2;
  Sender from = 3;
  AgentRef to = 4;
  EnvelopeKind kind = 5;
  string text = 6;
  // The recipient's incarnation the message is for, when only that one
  // may have it: a child's finished or failed message to its parent. The
  // recipient's daemon drops it for any other incarnation.
  optional uint32 incarnation = 7;
}

message Sender {
  oneof value {
    AgentSender agent = 1;
    Human human = 2;
  }
}

message AgentSender {
  bytes agent_id = 1;
  bytes host_id = 2;
  string name = 3;
}

message Human {}

enum EnvelopeKind {
  ENVELOPE_KIND_UNSPECIFIED = 0;
  ENVELOPE_KIND_MESSAGE = 1;
  // A child's turn ended; the text is its last message.
  ENVELOPE_KIND_FINISHED = 2;
  // A child's incarnation ended without a turn end; the text is the cause.
  ENVELOPE_KIND_FAILED = 3;
}

// ---------------------------------------------------------------------------
// Envelope
// ---------------------------------------------------------------------------

// One interpreter step: what the journal frames.
message Step {
  // The durable payload; one provider fact can yield several.
  repeated Item items = 1;
  repeated Append appends = 2;
  // Rides along when the step changed it; re-derived on restart, never
  // relied on.
  optional Snapshot snapshot = 3;
  // Set when this step ended a turn.
  optional TurnEnd turn_end = 4;
}

// Full state per revision. Keys and at_ms come from the interpreter; order
// and revision are zero in the journal and assigned by the owning daemon at
// commit: order once per key, revision on every upsert.
message Item {
  bytes agent_id = 1;
  string key = 2;
  uint64 order = 3;
  uint64 revision = 4;
  // The agent binary that wrote it.
  string producer_version = 5;
  // Set on a prompt's reflection, and on an agent message's item (the
  // envelope id).
  bytes input_id = 6;
  // The one appendable field; U+FFFC marks each attachment's position.
  string text = 7;
  repeated Attachment attachments = 8;
  // Which per-kind item message `body` holds.
  Kind kind = 9;
  bytes body = 10;
  // When the item happened: the provider's own timestamp where it has one,
  // else the interpreter's clock. Durations are differences of two of these.
  int64 at_ms = 11;
}

// The one delta: extends `text` on an open item. Sent only live, after
// CaughtUp; a base mismatch makes the client Get the item.
message Append {
  bytes agent_id = 1;
  string key = 2;
  uint64 base_revision = 3;
  uint64 revision = 4;
  string text = 5;
}

// Everything a client needs to draw the agent without items. Every field of
// the per-kind body is present in every snapshot, at an explicit unknown
// until the interpreter learns it.
message Snapshot {
  bytes agent_id = 1;
  uint64 revision = 2;
  repeated QueuedInput queue = 3;
  // Which per-kind snapshot `body` holds. Before the interpreter's first
  // snapshot is ingested, Subscribe answers with the kind and an empty body.
  Kind kind = 4;
  bytes body = 5;
  // STARTING until the provider accepts input; NEEDS_YOU whenever an ask is
  // open. The daemon copies phase and working_on onto the inventory row.
  Phase phase = 6;
  // From the status tool call or the spawn prompt; never cleared
  // automatically.
  optional string working_on = 7;
  // The interpreter's clock when the step that produced this snapshot ran.
  int64 at_ms = 8;
  // The interpreter's clock when `phase` last changed; streamed output and
  // other changes within one phase leave it alone. The daemon copies it onto
  // the inventory row.
  int64 phase_since_ms = 9;
  // The branch and change totals of the agent's folder, read by the agent
  // process at start and at each turn end. Absent outside a repository. The
  // daemon copies it onto the inventory row.
  optional Git git = 10;
  // The SHA-256 of the Catalogue blob the agent offers now, in its
  // directory; absent until its provider says what it offers. Not copied
  // onto the row.
  optional bytes catalogue = 11;
}

// What a row says about the git repository an agent works in.
message Git {
  // Absent on a detached head.
  optional string branch = 1;
  // The branch a worktree amux made was made from, else the repository's
  // default branch; absent when neither is known.
  optional string base_branch = 2;
  // Working tree against HEAD.
  optional ChangeTotals uncommitted = 3;
  // From where the branch left its base to the working tree, so uncommitted
  // work counts.
  optional ChangeTotals on_branch = 4;
}

message ChangeTotals {
  uint32 files = 1;
  uint32 added = 2;
  uint32 removed = 3;
}

enum Phase {
  PHASE_STARTING = 0;
  PHASE_IDLE = 1;
  PHASE_WORKING = 2;
  PHASE_NEEDS_YOU = 3;
}

// What the daemon needs to notify a parent without decoding a body. An ask
// is mid-turn and is not a turn end.
message TurnEnd {
  // The interpreter's per-agent turn counter; identifies the notification.
  uint64 turn_id = 1;
  // The turn's newest complete text item, or empty if the turn ended with
  // no assistant text.
  string last_message_key = 2;
}

// A person's queued prompt, or an agent's message where its provider has no
// injection channel. Labelled by sender so nothing is parsed from text.
message QueuedInput {
  bytes input_id = 1;
  string text = 2;
  repeated Attachment attachments = 3;
  bool steer = 4;
  Sender sender = 5;
}

// ---------------------------------------------------------------------------
// Attachments, blobs, diffs
// ---------------------------------------------------------------------------

message Attachment {
  oneof of {
    BlobRef image = 1;
    BlobRef file = 2;
    InlineText text = 3;
    Review review = 4;
  }
}

// Content-addressed bytes in the owning agent's directory. The name belongs
// to the reference, not the bytes.
message BlobRef {
  // SHA-256 of the bytes.
  bytes hash = 1;
  string name = 2;
  string mime = 3;
  uint64 size = 4;
}

message InlineText {
  string name = 1;
  string text = 2;
}

// A comparison of an agent's working tree, made on the agent's host. It
// runs to the working tree, untracked files included, from HEAD or from
// where the branch left the named base. The patch is a text/x-diff blob of
// the agent, built only when asked for; its index lines carry each file's
// full object ids.
message Diff {
  BlobRef patch = 1;
  DiffBase base = 2;
  // Empty before the first commit.
  string head = 3;
  optional string merge_base = 4;
  repeated DiffFile files = 5;
}

message DiffFile {
  string path = 1;
  // Lines; none for a binary file.
  uint32 added = 2;
  uint32 removed = 3;
  DiffFileChange change = 4;
  bool binary = 5;
}

enum DiffFileChange {
  DIFF_FILE_CHANGE_CHANGED = 0;
  DIFF_FILE_CHANGE_CREATED = 1;
  DIFF_FILE_CHANGE_DELETED = 2;
}

message DiffBase {
  oneof base {
    // From the folder's HEAD commit.
    Empty head = 1;
    string branch = 2;
  }
}

// A diff exactly as the Diff call returned it, frozen when the review page
// opened, plus a person's comments.
message Review {
  Diff diff = 1;
  repeated ReviewComment comments = 2;
}

message ReviewComment {
  string path = 1;
  // New-side line; zero comments on the file as a whole.
  uint32 line = 2;
  // Old-side line for a comment on a removed line.
  uint32 old_line = 3;
  string text = 4;
}

// ---------------------------------------------------------------------------
// Item bodies shared by more than one kind
// ---------------------------------------------------------------------------

// A person's prompt as the provider reflected it. Text and attachments are
// in the envelope.
message Prompt {}

// A prompt delivered into the running turn; the text is the envelope's.
message Steer {}

// A plan the agent put to the person. The plan is the envelope text.
message Plan {
  PlanVerdict verdict = 1;
  // What the person said when sending it back.
  optional string note = 2;
  // The whole plan is in: Claude declares it whole; Codex streams it.
  bool complete = 3;
}

enum PlanVerdict {
  PLAN_VERDICT_UNDECIDED = 0;
  PLAN_VERDICT_APPROVED = 1;
  PLAN_VERDICT_APPROVED_ACCEPTING_EDITS = 2;
  PLAN_VERDICT_SENT_BACK = 3;
  // Closed without a decision: a new prompt, an interruption, the turn or
  // the provider ending.
  PLAN_VERDICT_DISMISSED = 4;
}

message Text {
  bool complete = 1;
}

// "Thought for 8s" is the difference of two item timestamps; the thinking
// text, when the provider records it, is the envelope text.
message Thinking {
  bool complete = 1;
}

message ToolCall {
  string name = 1;
  bytes input_json = 2;
  ToolState state = 3;
  string outcome_text = 4;
  bytes outcome_json = 5;
  repeated Attachment attachments = 6;
  ToolClass class = 7;
  // A permission decision is meta on the tool call's own row.
  ToolDecision decision = 8;
  // Started in the background: a shell or task that outlives the call.
  bool background = 9;
  // The key of the subagent call this step belongs to, for nested steps.
  string parent_key = 10;
  // Live progress of a subagent call.
  SubagentProgress subagent = 11;
  // The tool server, for a tool-server call.
  string server = 12;
  optional int32 exit_code = 13;
  // When the call finished, the provider's timestamp where it has one.
  optional int64 ended_at_ms = 14;
  // A file write that finished: whether it made the file (else it
  // replaced one). Claude says which only once the write is done.
  optional bool created = 15;
  // A file edit that finished: the line its first change landed on.
  optional uint32 line = 16;
}

enum ToolState {
  TOOL_STATE_UNSPECIFIED = 0;
  TOOL_STATE_PENDING = 1;
  TOOL_STATE_RUNNING = 2;
  TOOL_STATE_SUCCEEDED = 3;
  TOOL_STATE_FAILED = 4;
  TOOL_STATE_DENIED = 5;
  TOOL_STATE_CANCELLED = 6;
}

// What a call does to the world, set by the interpreter from native tool
// kinds, never from text. Every class but CONSEQUENTIAL only looks: the views
// fold runs of those together and name each by its verb. LOOK is a look with
// no verb of its own, drawn its own way: a read-only tool-server call, an
// image viewed.
enum ToolClass {
  TOOL_CLASS_UNSPECIFIED = 0;
  TOOL_CLASS_CONSEQUENTIAL = 1;
  TOOL_CLASS_READ = 2;
  TOOL_CLASS_SEARCH = 3;
  TOOL_CLASS_LIST = 4;
  TOOL_CLASS_FETCH = 5;
  TOOL_CLASS_WEB_SEARCH = 6;
  TOOL_CLASS_LOOK = 7;
}

message ToolDecision {
  DecisionOutcome outcome = 1;
  string note = 2;
  // Answered in the provider's own interface rather than through amux.
  bool elsewhere = 3;
  // What an allowance granted beyond this one call. Absent when it allowed
  // the call alone, and when the provider did not say which choice was
  // made: Claude's own terminal does not report it.
  oneof granted {
    ClaudeGrant claude = 4;
    CodexGrant codex = 5;
  }
}

// Where Claude saves a standing permission.
enum ScopeDestination {
  SCOPE_DESTINATION_UNSPECIFIED = 0;
  SCOPE_DESTINATION_SESSION = 1;
  SCOPE_DESTINATION_LOCAL_SETTINGS = 2;
  SCOPE_DESTINATION_PROJECT_SETTINGS = 3;
  SCOPE_DESTINATION_USER_SETTINGS = 4;
}

// A standing permission Claude offers or added when a call was allowed.
message ClaudeGrant {
  // The rules, as Claude writes them: "Bash(npm test:*)".
  repeated string rules = 1;
  // Folders added to those Claude may work in.
  repeated string directories = 2;
  // A permission mode Claude switched to.
  optional string mode = 3;
  ScopeDestination destination = 4;
  // Claude's own word for the destination, always carried: what a client
  // shows for a destination it does not know.
  string destination_word = 5;
}

// What Codex allows from now on.
message CodexGrant {
  oneof of {
    // Approvals like this one, for the rest of the session.
    Empty session = 1;
    // Commands starting with these words.
    CommandPrefix command_prefix = 2;
    // Network access to these hosts.
    NetworkHosts network_hosts = 3;
  }
}

message CommandPrefix {
  repeated string words = 1;
}

message NetworkHosts {
  repeated string hosts = 1;
}

enum DecisionOutcome {
  DECISION_OUTCOME_NONE = 0;
  DECISION_OUTCOME_ALLOWED = 1;
  DECISION_OUTCOME_DENIED = 2;
  DECISION_OUTCOME_AUTO_APPROVED = 3;
  // Closed by a later fact that did not carry the outcome; drawn dismissed.
  DECISION_OUTCOME_UNKNOWN = 4;
}

message SubagentProgress {
  uint32 tool_count = 1;
  string last_tool = 2;
  bool finished = 3;
}

message Boundary {
  BoundaryKind kind = 1;
  string provider_session = 2;
  string provider_version = 3;
  // For EXITED: why, and the cause's own words.
  ExitCause cause = 4;
  optional string cause_detail = 5;
  // The keymap the agent process resolved for the observed provider version.
  string keymap = 6;
}

// Why an agent's incarnation ended. UNSPECIFIED while it runs, and for a
// cause this build does not know: unknown is not failure.
enum ExitCause {
  EXIT_CAUSE_UNSPECIFIED = 0;
  // A child's turn ended with nothing queued: the one-shot rule.
  EXIT_CAUSE_FINISHED = 1;
  EXIT_CAUSE_STOPPED = 2;
  EXIT_CAUSE_ABORTED = 3;
  EXIT_CAUSE_KILLED = 4;
  // The provider process ended on its own; the detail is its exit code
  // or signal.
  EXIT_CAUSE_PROVIDER_EXITED = 5;
  // The agent drained after its daemon was gone past the grace period.
  EXIT_CAUSE_DAEMON_LOST = 6;
  // An ask was open with nobody to answer it when the daemon was lost.
  EXIT_CAUSE_ORPHANED = 7;
  // The agent process or its provider could not start; the detail says
  // which and why.
  EXIT_CAUSE_COULD_NOT_START = 8;
  // Its directory is gone, or a write to it failed; the detail says which.
  EXIT_CAUSE_DIRECTORY_FAILED = 9;
  // The process was found dead when a daemon returned, with no record of
  // why.
  EXIT_CAUSE_ENDED_WHILE_AWAY = 10;
  // The provider loop ended without any of the above.
  EXIT_CAUSE_ENDED_UNEXPECTEDLY = 11;
}

enum BoundaryKind {
  BOUNDARY_KIND_UNSPECIFIED = 0;
  BOUNDARY_KIND_STARTED = 1;
  BOUNDARY_KIND_CLEARED = 2;
  BOUNDARY_KIND_COMPACTED = 3;
  BOUNDARY_KIND_RESUMED = 4;
  BOUNDARY_KIND_FORKED = 5;
  BOUNDARY_KIND_RESTARTED = 6;
  BOUNDARY_KIND_EXITED = 7;
  BOUNDARY_KIND_DAEMON_LOST = 8;
}

// A message between agents; the text is in the envelope.
message AgentMessage {
  bytes envelope_id = 1;
  EnvelopeKind kind = 2;
  Sender from = 3;
  bytes context = 4;
  // Set on a message this agent sent with amux's send tool: the recipient as
  // the model named it. Empty on a message this agent received.
  string to = 5;
  // How a sent message's send went; unspecified on a received message.
  SendState send_state = 6;
  // For SEND_STATE_REJECTED: why, as the send reported it.
  string rejection = 7;
}

enum SendState {
  SEND_STATE_UNSPECIFIED = 0;
  // The send is in flight; envelope_id is still empty.
  SEND_STATE_SENDING = 1;
  // The recipient's provider has it.
  SEND_STATE_SENT = 2;
  SEND_STATE_REJECTED = 3;
}

message Turn {
  uint64 turn_id = 1;
  TurnOutcome outcome = 2;
  // When the turn started; "Worked 1m 42s" is at_ms minus this.
  int64 started_at_ms = 3;
  optional double cost_usd = 4;
}

enum TurnOutcome {
  TURN_OUTCOME_UNSPECIFIED = 0;
  TURN_OUTCOME_COMPLETED = 1;
  TURN_OUTCOME_INTERRUPTED = 2;
  TURN_OUTCOME_FAILED = 3;
}

message Compaction {
  optional uint64 tokens_before = 1;
  optional uint64 tokens_after = 2;
  bool automatic = 3;
}

message ApiError {
  // The provider's typed error kind, where it has one.
  string error_kind = 1;
  string message = 2;
  bool will_retry = 3;
  uint32 attempt = 4;
  uint32 max_attempts = 5;
  optional int64 retry_at_ms = 6;
}

message ModelSwitch {
  string from = 1;
  string to = 2;
  string reason = 3;
}

// Output of a slash command; the output is the envelope text.
message SlashOutput {
  string command = 1;
  string args = 2;
}

// A provider fact the interpreter could not place, made visible. Never raw
// bytes: the fact itself is in the facts ring.
message Unrecognized {
  string fact_type = 1;
  string summary = 2;
}

// ---------------------------------------------------------------------------
// Snapshot pieces shared by more than one kind
// ---------------------------------------------------------------------------

// What an agent offers to pick from, not what is picked: that stays in the
// snapshot. An agent writes it as a blob of its directory and names the
// blob's hash in its snapshot; identical catalogues share one. Fetched by
// GetBlob, so a catalogue passes through a daemon of any version intact.
message Catalogue {
  repeated OfferedModel models = 1;
  repeated OfferedCommand commands = 2;
  // How much the agent may do without asking.
  repeated OfferedPermission permissions = 3;
  // How it works; empty for Claude.
  repeated OfferedMode modes = 4;
}

message OfferedPermission {
  // What SetPermission names and the snapshot reports.
  string value = 1;
  // Written by the interpreter; no provider supplies one.
  string display_name = 2;
  // The provider's ordinary one; a client may leave it unsaid.
  bool normal = 3;
  // Acts without asking; clients warn.
  bool never_asks = 4;
  // False: only reachable in the provider's own interface.
  bool settable = 5;
  // Empty: every model. Otherwise only these.
  repeated string models = 6;
}

message OfferedMode {
  string value = 1;
  string display_name = 2;
  bool normal = 3;
  bool settable = 4;
}

// A model the provider offers this session, as the provider lists it.
message OfferedModel {
  // What a model input names.
  string value = 1;
  string display_name = 2;
  string description = 3;
  // The effort levels the model takes, in the provider's order; empty when
  // it takes none.
  repeated string efforts = 4;
  // The effort the model runs at when none is chosen, when the provider
  // says.
  optional string default_effort = 5;
  // The model id an alias stands for, as the agent reports its model;
  // empty when the provider does not say.
  string resolved_model = 6;
}

// A command or skill the provider offers this session, typed as a prompt
// that starts with a slash.
message OfferedCommand {
  string name = 1;
  string description = 2;
  // What the command takes after its name, in the provider's words.
  string argument_hint = 3;
  // Where it comes from: a plugin's namespace, or the provider's scope word
  // (user, repo, system). Empty when the provider does not say.
  string source = 4;
}

// An open ask. Opened and closed only by provider facts.
message Ask {
  // What an answer names.
  string key = 1;
  // The item this ask points at: the tool call it would let run, or, for
  // an ask that is the work, its own AskItem.
  string item_key = 2;
  oneof body {
    PermissionAsk permission = 3;
    QuestionAsk question = 4;
    PlanAsk plan = 5;
    FormAsk form = 6;
    LinkAsk link = 7;
    UnanswerableAsk unanswerable = 8;
  }
  int64 opened_at_ms = 9;
}

message PermissionAsk {
  string tool_name = 1;
  bytes input_json = 2;
  // Every scope the provider offered, in order.
  repeated ScopeChoice scopes = 3;
  string reason = 4;
  string description = 5;
  // Denying always ends the turn (terminal Claude).
  bool deny_stops = 6;
  // Deny can be sent with or without stopping the turn.
  bool deny_can_stop = 7;
  string server = 8;
}

// One scope the provider offered; answers name its index.
message ScopeChoice {
  uint32 index = 1;
  ClaudeGrant grant = 2;
}

message QuestionAsk {
  repeated Question questions = 1;
  // The provider's own dialog rather than a question the agent asked in a
  // turn (Claude's folder trust): there is no turn to reply into instead.
  bool provider_dialog = 2;
}

message Question {
  string header = 1;
  string question = 2;
  bool multi_select = 3;
  repeated QuestionOption options = 4;
  // An "Other" answer is accepted.
  bool allow_other = 5;
  // The answer is secret and is never shown back.
  bool secret = 6;
}

message QuestionOption {
  string label = 1;
  string description = 2;
  string preview = 3;
  bool recommended = 4;
}

// A decision on a plan; the plan is the text of the item the ask points at.
message PlanAsk {
  // What the provider takes, in its order.
  repeated PlanChoice choices = 1;
}

enum PlanChoice {
  PLAN_CHOICE_UNSPECIFIED = 0;
  // Start building (Claude) or implement the plan (Codex).
  PLAN_CHOICE_START = 1;
  // Start, accepting edits without asking (Claude).
  PLAN_CHOICE_START_ACCEPTING_EDITS = 2;
  // Keep planning; the note, if any, goes to the agent.
  PLAN_CHOICE_KEEP_PLANNING = 3;
}

message PlanAnswer {
  PlanChoice choice = 1;
  // With keep planning: what to change.
  optional string note = 2;
}

message FormAsk {
  string server = 1;
  string message = 2;
  bytes schema_json = 3;
}

message LinkAsk {
  string server = 1;
  string message = 2;
  string url = 3;
}

// A request for file or network access beyond the sandbox.
message AccessGrant {
  string reason = 1;
  repeated string read = 2;
  repeated string write = 3;
  bool network = 4;
  repeated string network_hosts = 5;
}

// An ask that is the work: a question, a tool server's form or link, an
// access grant, or something the provider shows that this build cannot read.
// It is its own item, written when the ask opens (the ask's
// item_key names it) and revised once with how it closed, so its decision
// row stays in the chat after the ask leaves the snapshot.
message AskItem {
  oneof ask {
    QuestionAsk question = 1;
    FormAsk form = 2;
    LinkAsk link = 3;
    AccessGrant access = 4;
    UnanswerableAsk unanswerable = 5;
  }
  // Absent while the ask is open.
  AskClosed closed = 6;
}

message AskClosed {
  AskOutcome outcome = 1;
  // A question's answers, one per question in the ask's order; with reply
  // instead, the answers given before it.
  repeated AnsweredQuestion answers = 2;
  // The person's own words, when they replied instead of answering.
  string reply = 3;
  // The names of the form fields sent; the values went to the server only.
  repeated string fields = 4;
  // What an access grant granted.
  GrantAnswer grant = 5;
}

enum AskOutcome {
  ASK_OUTCOME_UNSPECIFIED = 0;
  // Answered, sent, opened or granted.
  ASK_OUTCOME_ANSWERED = 1;
  // Declined, or an access grant that granted nothing.
  ASK_OUTCOME_DECLINED = 2;
  ASK_OUTCOME_CANCELLED = 3;
  // Closed by a later fact that did not say how.
  ASK_OUTCOME_DISMISSED = 4;
  // The person replied in their own words instead of answering.
  ASK_OUTCOME_REPLIED = 5;
}

message AnsweredQuestion {
  // The chosen options' labels.
  repeated string picked = 1;
  // A typed answer.
  optional string other = 2;
  // A secret answer: what was typed is never recorded.
  bool hidden = 3;
  // The person's note on this question. Nothing picked, typed or hidden
  // means the question was skipped.
  optional string note = 4;
}

// The provider is asking something this build cannot read; the only way out
// here is to stop the agent or attach a terminal.
message UnanswerableAsk {
  string reason = 1;
}

message TaskList {
  bool known = 1;
  repeated TaskListEntry entries = 2;
}

message TaskListEntry {
  string id = 1;
  string subject = 2;
  TaskListStatus status = 3;
  string active_form = 4;
}

enum TaskListStatus {
  TASK_LIST_STATUS_UNSPECIFIED = 0;
  TASK_LIST_STATUS_PENDING = 1;
  TASK_LIST_STATUS_IN_PROGRESS = 2;
  TASK_LIST_STATUS_COMPLETED = 3;
}

message ContextMeter {
  bool known = 1;
  uint64 used_tokens = 2;
  optional uint64 window_tokens = 3;
  repeated ContextShare breakdown = 4;
}

message ContextShare {
  string category = 1;
  uint64 tokens = 2;
}

enum UsageState {
  USAGE_STATE_UNKNOWN = 0;
  USAGE_STATE_OK = 1;
  USAGE_STATE_NEAR_LIMIT = 2;
  USAGE_STATE_BLOCKED = 3;
}

// How full one usage window is; the same for every provider.
message UsageMeter {
  // 0..100.
  double used_percent = 1;
  optional int64 resets_at_ms = 2;
  // This window's own state: a person can reach the weekly limit before
  // the five-hour one.
  UsageState state = 3;
}

// Claude's usage limits. `state` says whether the agent can work at all,
// which is not the same as any one window when Claude allows overage.
message ClaudeUsage {
  UsageState state = 1;
  repeated ClaudeUsageWindow windows = 2;
}

message ClaudeUsageWindow {
  Limit limit = 1;
  // Set for a limit that belongs to one model.
  optional string model = 2;
  // Claude's own name for the window, shown when `limit` is unspecified.
  string provider_name = 3;
  UsageMeter meter = 4;
}

// A usage window's length, the same for every provider.
enum Limit {
  LIMIT_UNSPECIFIED = 0;
  LIMIT_FIVE_HOUR = 1;
  LIMIT_WEEKLY = 2;
}

// Codex's usage limits.
message CodexUsage {
  UsageState state = 1;
  repeated CodexUsageWindow windows = 2;
  optional string credits = 3;
}

message CodexUsageWindow {
  // Named from the window's length.
  Limit limit = 1;
  // The only description Codex gives of a window.
  uint32 window_minutes = 2;
  UsageMeter meter = 3;
}

// Session strip: tool-server health, shown only when one fails.
message ToolServerHealth {
  HealthState state = 1;
  repeated ToolServer servers = 2;
}

enum HealthState {
  HEALTH_STATE_UNKNOWN = 0;
  HEALTH_STATE_HEALTHY = 1;
  HEALTH_STATE_DEGRADED = 2;
}

message ToolServer {
  string name = 1;
  ToolServerStatus status = 2;
  string error = 3;
}

enum ToolServerStatus {
  TOOL_SERVER_STATUS_UNSPECIFIED = 0;
  TOOL_SERVER_STATUS_STARTING = 1;
  TOOL_SERVER_STATUS_READY = 2;
  TOOL_SERVER_STATUS_FAILED = 3;
  TOOL_SERVER_STATUS_NEEDS_AUTH = 4;
}

// Session strip: sign-in state; a problem replaces the composer with a foot
// card.
message SignIn {
  SignInState state = 1;
  string account = 2;
  string message = 3;
}

enum SignInState {
  SIGN_IN_STATE_UNKNOWN = 0;
  SIGN_IN_STATE_SIGNED_IN = 1;
  SIGN_IN_STATE_SIGNED_OUT = 2;
  SIGN_IN_STATE_EXPIRED = 3;
  SIGN_IN_STATE_FAILED = 4;
}

// What the provider runs in the background: commands and tasks that
// outlive the call that started them. `known` false is the explicit
// unknown; the list empties when the provider exits, and a new incarnation
// starts with none.
message BackgroundJobs {
  bool known = 1;
  repeated BackgroundJob jobs = 2;
}

message BackgroundJob {
  // The key of the item whose call started the job; empty when the
  // provider has not said which call it was.
  string item_key = 1;
  // The command, or what the provider calls the task.
  string command = 2;
  int64 started_at_ms = 3;
}

// ---------------------------------------------------------------------------
// Input pieces shared by more than one kind
// ---------------------------------------------------------------------------

// The kind is the interpreter.
enum Kind {
  KIND_UNSPECIFIED = 0;
  KIND_CLAUDE_PTY = 1;
  KIND_CLAUDE_SDK = 2;
  KIND_CODEX = 3;
}

// U+FFFC per attachment.
message PromptInput {
  string text = 1;
  repeated Attachment attachments = 2;
  // Prompts always queue; steering is SendQueuedNow on a queued entry.
}

// Rejected REFUSAL_NOT_QUEUED if the target is not queued.
message WithdrawQueued {
  bytes queued_input_id = 1;
}

// Delivers one queued prompt into the running turn through the provider's
// own steering path; the entry reads steered until its reflection lands.
// Rejected REFUSAL_NOT_QUEUED if the target is not waiting in the queue,
// and REFUSAL_UNSUPPORTED if no turn is running.
message SendQueuedNow {
  bytes queued_input_id = 1;
}

message Interrupt {}

message Clear {}

// How much the agent may do without asking, by a value its catalogue
// offers; the interpreter turns it into the provider's own settings.
message SetPermission {
  string value = 1;
}

// How the agent works (Codex: default or plan), by a value its catalogue
// offers.
message SetMode {
  string value = 1;
}

message SetModel {
  // Absent restores the launch model.
  optional string model = 1;
}

message SetEffort {
  // Absent clears the session override.
  optional string effort = 1;
}

// Answer pieces shared by the per-kind answers.

message QuestionAnswer {
  // One per question, in the ask's order.
  repeated QuestionResponse answers = 1;
}

// Nothing selected and no text: the question is skipped.
message QuestionResponse {
  repeated uint32 selected = 1;
  optional string other = 2;
  optional string note = 3;
}

// The person's own words instead of answering a question.
message ReplyInstead {
  string text = 1;
  // One per question, in the ask's order: what was answered before
  // replying; nothing selected and no text where nothing was.
  repeated QuestionResponse answers_so_far = 2;
}

message FormAnswer {
  FormAction action = 1;
  bytes content_json = 2;
}

enum FormAction {
  FORM_ACTION_UNSPECIFIED = 0;
  FORM_ACTION_ACCEPT = 1;
  FORM_ACTION_DECLINE = 2;
  FORM_ACTION_CANCEL = 3;
}

message LinkAnswer {
  FormAction action = 1;
}

// A subset of what was asked; nothing granted is a deny.
message GrantAnswer {
  repeated string read = 1;
  repeated string write = 2;
  bool network = 3;
  bool for_session = 4;
}

// The interpreter's verdict.
message SendInputResponse {
  oneof of {
    Accepted accepted = 1;
    Rejected rejected = 2;
  }
}

message Accepted {
  bool queued = 1;
}

message Rejected {
  Refusal refusal = 1;
  // The provider's or interpreter's own words, when it has any: terminal
  // Claude's sentence about a send-now it cannot do.
  optional string detail = 2;
}

enum Refusal {
  REFUSAL_UNSPECIFIED = 0;
  // The answer's ask is not open.
  REFUSAL_CLOSED_ASK = 1;
  // The withdraw or send-now target is not waiting in the queue.
  REFUSAL_NOT_QUEUED = 2;
  // This agent version, kind or state cannot take the input.
  REFUSAL_UNSUPPORTED = 3;
  REFUSAL_DRAINING = 4;
  REFUSAL_EXITING = 5;
  REFUSAL_EXITED = 6;
  REFUSAL_HOST_UNREACHABLE = 7;
}
