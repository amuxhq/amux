syntax = "proto3";

package amux.v1;

import "amux/v1/dump.proto";
import "amux/v1/installation_service.proto";
import "amux/v1/inventory.proto";
import "amux/v1/pairing_service.proto";
import "amux/v1/records.proto";

// One profile's administration: its account connection, its pairing
// windows, pairings it begins, the hosts it trusts, and its diagnostic dump.

// Served on a profile's socket beside AgentService and SessionService, and
// never on an agent's tools socket or a link. The socket names the profile.
// Not retried, as the front door.
service ProfileAdminService {
  rpc SignOut(SignOutRequest) returns (SignOutResponse);
  rpc StartPairing(StartPairingRequest) returns (StartPairingResponse);
  // The pairing status now, then again on every change.
  rpc SubscribePairing(SubscribePairingRequest) returns (stream SubscribePairingResponse);
  rpc CancelPairing(CancelPairingRequest) returns (CancelPairingResponse);
  rpc BeginPair(BeginPairRequest) returns (BeginPairResponse);
  rpc ConfirmPair(ConfirmPairRequest) returns (ConfirmPairResponse);
  rpc AbandonPair(AbandonPairRequest) returns (AbandonPairResponse);
  rpc GetDeviceIdentity(GetDeviceIdentityRequest) returns (GetDeviceIdentityResponse);
  rpc TrustSshPeer(TrustSshPeerRequest) returns (TrustSshPeerResponse);
  rpc ListPeers(ListPeersRequest) returns (ListPeersResponse);
  rpc Unpair(UnpairRequest) returns (UnpairResponse);
  // The one bundle format: this host's own state, scoped to what the
  // request is for.
  rpc Dump(DumpRequest) returns (DumpResponse);
  // Writes a person's report around a dump and sends it to the profile's
  // account service when the profile is signed in to one.
  rpc SubmitReport(SubmitReportRequest) returns (SubmitReportResponse);
  // The person offers a paired peer this profile's account: the peer is
  // asked whether to sign in to it too.
  rpc OfferSignIn(OfferSignInRequest) returns (OfferSignInResponse);
  // The offers paired peers made this profile, now and on every change.
  rpc SubscribeSignInOffers(SubscribeSignInOffersRequest) returns (stream SubscribeSignInOffersResponse);
  // Accepting signs this profile in to the offering peer's account;
  // declining ends the offer.
  rpc AnswerSignInOffer(AnswerSignInOfferRequest) returns (AnswerSignInOfferResponse);
}

message SignOutRequest {}

message SignOutResponse {
  Profile profile = 1;
}

message OfferSignInRequest {
  bytes host_id = 1;
}

message OfferSignInResponse {}

message SubscribeSignInOffersRequest {}

message SubscribeSignInOffersResponse {
  repeated SignInOffer offers = 1;
}

message SignInOffer {
  bytes host_id = 1;
  string host_name = 2;
  string email = 3;
  string account_name = 4;
}

message AnswerSignInOfferRequest {
  bytes host_id = 1;
  bool accept = 2;
}

message AnswerSignInOfferResponse {
  Profile profile = 1;
}

message StartPairingRequest {
  oneof method {
    // A one-shot PIN the daemon generates.
    Empty pin = 1;
    // A one-shot secret for a QR code.
    Empty qr = 2;
    // An operator-chosen reusable PIN for unattended demos: the window is
    // neither consumed by success nor locked out by failures.
    string demo_pin = 3;
    // One window that accepts either a PIN or a QR secret.
    Empty pin_or_qr = 5;
  }
  // How long the window stays open; absent is the daemon's default for
  // the method.
  optional uint64 ttl_seconds = 4;
}

message StartPairingResponse {
  PairingWindow window = 1;
}

message PairingWindow {
  PairingIdentity identity = 1;
  uint64 ttl_seconds = 2;
  repeated string addrs = 3;
  // The PIN a person types. Absent for a window opened with `qr`.
  optional string pin = 4;
  // The link the QR shows, composed by the daemon:
  // https://<amux.sh>/p#<payload>. Empty for a window without a QR secret.
  string qr_link = 5;
}

message SubscribePairingRequest {}

message SubscribePairingResponse {
  PairingStatus status = 1;
}

message CancelPairingRequest {}

message CancelPairingResponse {}

message PairingStatus {
  bool active = 1;
  // Too many wrong secrets closed the last window; a new one is needed.
  bool locked_out = 2;
  // A joiner proved the window's secret and is confirming.
  bool joining = 3;
  // The peer the last pairing of this window trusted.
  optional Peer paired = 4;
}

message BeginPairRequest {
  bytes host_id = 1;
  oneof secret {
    string pin = 2;
    bytes qr_secret = 3;
  }
  repeated string addrs = 4;
}

message BeginPairResponse {
  PendingPair pending = 1;
}

message PendingPair {
  bytes token = 1;
  PairingIdentity peer = 2;
  RouteKind via = 3;
}

message ConfirmPairRequest {
  // PendingPair.token.
  bytes token = 1;
}

message ConfirmPairResponse {
  Peer peer = 1;
}

message AbandonPairRequest {
  // PendingPair.token.
  bytes token = 1;
}

message AbandonPairResponse {}

// SSH has already authenticated its peer outside the secret-based pairing
// protocol, so its identity commit is a separate, SSH-only operation.
message TrustSshPeerRequest {
  PairingIdentity peer = 1;
  SshTarget ssh_target = 2;
}

message TrustSshPeerResponse {}

message UnpairRequest {
  HostRef peer = 1;
}

message UnpairResponse {
  Peer peer = 1;
}

// An SSH destination; `amux internal ssh-link` there joins the profile whose
// id is the peer's host id.
message SshTarget {
  string target = 1;
}

message Peer {
  bytes host_id = 1;
  string name = 2;
  bytes pubkey = 3;
  // Where the host is reached over SSH, when it paired that way.
  optional SshTarget ssh_target = 4;
}

message GetDeviceIdentityRequest {}

message GetDeviceIdentityResponse {
  DeviceIdentity identity = 1;
}

message DeviceIdentity {
  bytes host_id = 1;
  string name = 2;
  bytes pubkey = 3;
}

message ListPeersRequest {}

message ListPeersResponse {
  repeated Peer peers = 1;
}
