// amux protocol.
//
// This directory is the canonical protobuf source. Generated Rust is
// committed under crates/wire/src/generated/; regenerate with
// `just protobuf` after editing any proto here (CI fails on stale output).
//
// The amux runtime uses gRPC services for application calls. Host-to-host
// links exchange length-prefixed Message values on their control stream and
// carry application channels on separate native streams.
//
// amux.v1 is the released protocol. From amux 0.9.0 on, builds of different
// versions meet: paired hosts, agent processes that outlive a daemon upgrade,
// and the stores and journals an earlier build left on disk. So every change
// keeps what a released build wrote decoding as it meant: fields, oneof arms
// and enum values are only added; a number is never renumbered, retyped or
// reused, and one that goes is left `reserved`. Names are not on the binary
// wire and may change, but for two: a service's and a method's, which are the
// gRPC path, and an error detail message's, which is its Any type URL. A
// field or method may take another message that reads the same numbers.
// `just proto-compat` checks all of this against the latest release. PROTOCOL_VERSION (Hello.supported_protocol_versions) moves only
// for a break both ends of a link must take.
//
// What a client writes into a dump is amux.dump (amux/dump/session.proto),
// read only by the build that wrote it and outside these promises.

syntax = "proto3";

package amux.v1;

import "amux/v1/chat.proto";
import "amux/v1/claude.proto";
import "amux/v1/codex.proto";
import "amux/v1/link.proto";
import "amux/v1/records.proto";

// ClientService and PeerService: the inventory they stream, their requests,
// and the public input envelope with the verdict on it.

// ---------------------------------------------------------------------------
// Inventory
// ---------------------------------------------------------------------------

// Hosts and agent rows: the current set, CaughtUp, then deltas. A listing is
// this stream read to CaughtUp.
message InventoryEvent {
  oneof of {
    HostEntry host = 1;
    HostRemoved host_removed = 2;
    Agent agent = 3;
    AgentRemoved agent_removed = 4;
    CaughtUp caught_up = 5;
    // The stream fell behind and closes after this; the client resubscribes
    // at once and reconciles against the fresh listing.
    Lagged lagged = 6;
  }
}

// One host set: every trusted host is in every snapshot whatever its
// presence; candidates come and go with discovery. HostRemoved only on
// untrust, or when a candidate disappears.
message HostEntry {
  // The host as it announced itself in its handshake; a paired host's name
  // is the one this machine's trust entry keeps for it.
  Host host = 1;
  // Bumped only after an unclean reboot of that host.
  uint64 generation = 2;
  // What each provider offers on the host, once the host has asked it.
  repeated ProviderOnHost providers = 3;
  oneof standing {
    // Paired with this machine, or this machine itself.
    Trusted trusted = 4;
    // Found by discovery, never paired.
    Candidate candidate = 5;
  }
}

message Trusted {
  // How the host reads from the daemon that lists it, from the outcome of
  // opening a channel to it. A host whose route comes up keeps the reach it
  // had until the first channel attempt on that route concludes.
  oneof reach {
    // A channel to the host opened on a route still listed, of this kind;
    // unspecified for this machine itself.
    RouteKind online = 1;
    // The relay refused the channel because the account's plan carries no
    // connection between hosts: upgrading reaches this host.
    Empty away = 2;
    // Anything else: no route, or a channel that failed for any reason but
    // the plan (no route at the relay, rate limited, shutting down, revoked,
    // TLS or identity failure, timeout, link gone).
    Offline offline = 3;
  }
  // Whether this machine's copy of the host's inventory has caught up on a
  // live stream from it: its agents are as the host lists them now, not as
  // they were remembered. Cleared when the host is lost; a client that
  // reads every trusted host current has reconciled with its fleet.
  bool current = 4;
}

message Offline {
  // The outcome of the daemon's last failed dial attempt at this host,
  // cleared when a route comes up.
  optional string last_dial_error = 1;
  // The host closed its link saying it no longer trusts this machine;
  // cleared when it links to this machine again.
  bool revoked = 2;
}

message Candidate {
  // Where discovery found it; what pairing dials.
  repeated string addrs = 1;
}

message ProviderOnHost {
  Provider provider = 1;
  // The hash GetCatalogue answers with for this provider.
  optional bytes catalogue = 2;
  bool signed_in = 3;
}

// A spawn named a host that more than one trusted host answers to.
message AmbiguousHostName {
  string name = 1;
  repeated HostEntry candidates = 2;
}

// How this machine reaches a host, or how a pairing peer was reached. No
// value for "no route": the host reads offline.
enum RouteKind {
  ROUTE_KIND_UNSPECIFIED = 0;
  ROUTE_KIND_DIRECT = 1;
  ROUTE_KIND_RELAY = 2;
  ROUTE_KIND_SSH = 3;
}

message HostRemoved {
  bytes host_id = 1;
}

// The inventory row: lifecycle from the daemon; phase, working_on,
// phase_since_ms, git and background_jobs copied from the snapshot
// envelope, never a snapshot.
message Agent {
  bytes agent_id = 1;
  bytes host_id = 2;
  Kind kind = 3;
  // Every agent has one: the one it was given, else one the daemon chose.
  string name = 4;
  string cwd = 5;
  optional AgentRef parent = 6;
  int64 created_at_ms = 7;
  Lifecycle lifecycle = 8;
  ExitCause exit_cause = 9;
  // The cause's own words, when it has any.
  optional string exit_detail = 10;
  Phase phase = 11;
  optional string working_on = 12;
  // The snapshot's phase_since_ms: when the agent entered its phase, on the
  // clock of the host where it runs.
  int64 phase_since_ms = 13;
  uint32 incarnation = 14;
  // The snapshot's git facts; absent outside a repository.
  optional Git git = 15;
  // Live agents below this one, on every host the agent's host knows of:
  // what a stop or delete would cut. Best effort; a host out of reach may
  // be undercounted.
  uint32 descendants = 16;
  // The snapshot's count of jobs the provider runs in the background.
  uint32 background_jobs = 17;
}

// ResolveAgent found more than one agent by that name.
message AmbiguousAgentName {
  string name = 1;
  repeated Agent candidates = 2;
}

enum Lifecycle {
  LIFECYCLE_UNSPECIFIED = 0;
  LIFECYCLE_LIVE = 1;
  LIFECYCLE_EXITED = 2;
}

// Why the row left this daemon's view, which is not always deletion at
// the origin: a host that stops listing an agent, or that this machine
// stops trusting, takes its rows with it.
enum RemovalReason {
  REMOVAL_REASON_UNSPECIFIED = 0;
  REMOVAL_REASON_DELETED = 1;
  REMOVAL_REASON_RETENTION = 2;
  REMOVAL_REASON_NO_LONGER_LISTED = 3;
  REMOVAL_REASON_HOST_UNTRUSTED = 4;
}

message AgentRemoved {
  bytes host_id = 1;
  bytes agent_id = 2;
  RemovalReason reason = 3;
}

// ---------------------------------------------------------------------------
// Client and peer services
// ---------------------------------------------------------------------------

// The whole client-facing surface.
service ClientService {
  rpc SubscribeInventory(SubscribeInventoryRequest) returns (stream InventoryEvent);
  // Fleet-wide name to row: NOT_FOUND, or AmbiguousAgentName with the
  // candidates. Every other call takes an agent id.
  rpc ResolveAgent(ResolveAgentRequest) returns (Agent);
  rpc SubscribeSession(SubscribeSessionRequest) returns (stream SessionEvent);
  rpc ListItems(ListItemsRequest) returns (ListItemsResponse);
  rpc GetItem(GetItemRequest) returns (Item);
  rpc SendInput(SendInputRequest) returns (SendInputResponse);
  rpc CreateAgent(CreateAgentRequest) returns (Agent);
  rpc RenameAgent(RenameAgentRequest) returns (Agent);
  rpc StopAgent(StopAgentRequest) returns (StopAgentResponse);
  // Spawn the directory again.
  rpc ResumeAgent(ResumeAgentRequest) returns (Agent);
  // Removes the agent for good, stopping it first when it is live. Its
  // children, on any host, follow on their own hosts by the family rule.
  rpc DeleteAgent(DeleteAgentRequest) returns (Empty);
  // Also called by the tool server with the agent's identity. The daemon
  // stamps the sender from the caller and never from the request.
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  // The only put: written into that agent's directory.
  rpc PutBlob(PutBlobRequest) returns (BlobRef);
  rpc GetBlob(GetBlobRequest) returns (GetBlobResponse);
  // The changed files; with_patch also puts the patch blob on the host.
  rpc GetDiff(GetDiffRequest) returns (Diff);
  // What a provider on a host offers with no agent running, read from the
  // host's own copy; an agent's catalogue is a blob named by its snapshot.
  rpc GetCatalogue(GetCatalogueRequest) returns (GetCatalogueResponse);
  rpc ListRepositories(ListRepositoriesRequest) returns (ListRepositoriesResponse);
  // The one bundle format.
  rpc Dump(DumpRequest) returns (DumpResponse);
  // The unsent draft of an agent's composer, kept by this machine's daemon
  // for its clients so it outlives a client closing. Never synced to other
  // machines; an empty draft forgets it.
  rpc UpdateDraft(UpdateDraftRequest) returns (Draft);
  rpc GetDraft(GetDraftRequest) returns (Draft);
}

// Daemon to daemon, over the link's application streams. Replication is a
// daemon being a client of its peer. The peer service answers only for
// this host's own agents and never passes a call on, so no two hosts can
// bounce a call between them: its inventory stream carries this host's
// entry and this host's agents; every call that names an agent
// (SubscribeSession, FetchHistory, GetItem, SendInput, the rename, stop,
// resume and delete calls, PutBlob, GetBlob and GetDiff) refuses an agent
// owned elsewhere with NOT_FOUND.
service PeerService {
  rpc SubscribeInventory(SubscribeInventoryRequest) returns (stream InventoryEvent);
  // A peer source sends `after` toward its origin once it holds a cursor,
  // else `tail`.
  rpc SubscribeSession(PeerSubscribeSessionRequest) returns (stream SessionEvent);
  rpc ListItems(ListItemsRequest) returns (ListItemsResponse);
  rpc GetItem(GetItemRequest) returns (Item);
  rpc SendInput(SendInputRequest) returns (SendInputResponse);
  rpc CreateAgent(CreateAgentRequest) returns (Agent);
  rpc RenameAgent(RenameAgentRequest) returns (Agent);
  rpc StopAgent(StopAgentRequest) returns (StopAgentResponse);
  rpc ResumeAgent(ResumeAgentRequest) returns (Agent);
  rpc DeleteAgent(DeleteAgentRequest) returns (Empty);
  rpc SendMessage(PeerSendMessageRequest) returns (SendMessageResponse);
  rpc PutBlob(PutBlobRequest) returns (BlobRef);
  rpc GetBlob(GetBlobRequest) returns (GetBlobResponse);
  rpc GetDiff(GetDiffRequest) returns (Diff);
  rpc GetCatalogue(GetCatalogueRequest) returns (GetCatalogueResponse);
  rpc ListRepositories(ListRepositoriesRequest) returns (ListRepositoriesResponse);
  // The host-side parts of the caller's dump for agents this host runs,
  // packed in the response.
  rpc Dump(DumpRequest) returns (DumpPart);
}

message SubscribeInventoryRequest {}

message ResolveAgentRequest {
  string name = 1;
}

// Clients tail; the daemon never accepts a cursor from a client.
message SubscribeSessionRequest {
  bytes agent_id = 1;
  uint32 tail = 2;
}

message PeerSubscribeSessionRequest {
  bytes agent_id = 1;
  oneof from {
    uint32 tail = 2;
    After after = 3;
  }
}

// The delta if it is at most cap rows and the origin still runs the
// generation the cursor was taken under; else Reset and a tail of cap. A
// revision belongs to a generation: after an unclean reboot the origin
// mints the same numbers again for different content.
message After {
  uint64 revision = 1;
  uint32 cap = 2;
  uint64 generation = 3;
}

message SessionEvent {
  oneof of {
    Snapshot snapshot = 1;
    Item item = 2;
    Append append = 3;
    CaughtUp caught_up = 4;
    Lagged lagged = 5;
    Reset reset = 6;
    Detached detached = 7;
    Opening opening = 8;
  }
}

// The first event of every stream: the origin generation its rows and
// revisions belong to. A peer source stores it on the block it takes and
// names it with its cursor when it resumes; a client that reopens a stream
// under another generation than its last Opening or Reset named rebuilds as
// at a Reset, which the gap may have carried.
message Opening {
  uint64 generation = 1;
}

// "You hold what the origin holds as of now", on every stream. On a session
// stream, the origin's revision replay is complete through: a source stores
// it as its cursor and clients ignore it.
message CaughtUp {
  uint64 revision = 1;
}

// The stream closes after this; the client re-tails.
message Lagged {}

// Forget the transcript; a fresh tail of the block under `generation`, the
// origin generation its rows and revisions belong to, follows, then
// CaughtUp. A replica sends one live when it takes a new block (its first,
// or one replacing what it held); a client holds `generation` from here as
// it would from an Opening.
message Reset {
  uint64 generation = 1;
}

// The origin is not being followed; rows may be stale.
message Detached {}

message ListItemsRequest {
  bytes agent_id = 1;
  optional uint64 before_order = 2;
  uint32 page_size = 3;
}

// By order, newest first; exhausted means no older history exists.
message ListItemsResponse {
  repeated Item items = 1;
  bool exhausted = 2;
}

message GetItemRequest {
  bytes agent_id = 1;
  string key = 2;
}

message SendInputRequest {
  bytes agent_id = 1;
  Input input = 2;
}

message CreateAgentRequest {
  bytes agent_id = 1;
  // The host that runs it; absent means this host.
  optional HostRef host = 2;
  // Lowercase letters, digits and hyphens, starting with a letter or digit
  // (wire::agent_name_problem); the host picks a free one when absent.
  optional string name = 3;
  optional AgentRef parent = 4;
  string cwd = 5;
  // Which interpreter, with that kind's settings.
  oneof agent {
    ClaudeCreateConfig claude_pty = 6;
    ClaudeCreateConfig claude_sdk = 7;
    CodexCreateConfig codex = 8;
  }
  // The first prompt, with attachments, queued before the agent starts.
  optional PromptSubmission initial_prompt = 9;
  // Start the agent in a new git worktree of cwd's repository, on a new
  // branch named after the agent, made from whatever cwd has checked out.
  // The agent's host chooses where the worktree lives; the agent's cwd is
  // the worktree. Fails the call, making no agent, when cwd is not in a
  // repository or the branch exists. The name is valid as a branch, so it
  // is the branch as given.
  bool new_worktree = 10;
}

// A host by id, or as a person names it, resolved against this host and
// the trusted ones: exact first, then ignoring case. AmbiguousHostName
// when more than one answers.
message HostRef {
  oneof of {
    bytes host_id = 1;
    string name = 2;
  }
}

message RenameAgentRequest {
  bytes agent_id = 1;
  // As CreateAgentRequest's name. The agent's branch keeps the name it
  // was made with.
  string name = 2;
}

// Ends the agent now: the running turn is cancelled the provider's own way
// and the agent exits, resumable. Named apart from the Interrupt input, which
// ends only the turn.
message StopAgentRequest {
  bytes agent_id = 1;
}

message StopAgentResponse {}

// The composer of an exited chat sends its draft through initial_prompt.
message ResumeAgentRequest {
  bytes agent_id = 1;
  optional PromptSubmission initial_prompt = 2;
}

message DeleteAgentRequest {
  bytes agent_id = 1;
}

// A message to an agent. `id` is the caller's, so the recipient's daemon
// can dedupe a resend against the recipient's items; the tool server mints
// one per send. Who it is from is the caller: a person on a client socket,
// or the agent whose tools socket made the call. A child's reports to its
// parent are the daemon's own and cannot be submitted.
message SendMessageRequest {
  bytes id = 1;
  AgentRef to = 2;
  optional bytes context = 3;
  MessageBody body = 4;
}

// A message a paired host sends for one of its agents or people, its sender
// stamped by that host.
message PeerSendMessageRequest {
  Envelope envelope = 1;
}

message SendMessageResponse {
  bytes envelope_id = 1;
}

message PutBlobRequest {
  bytes agent_id = 1;
  string name = 2;
  string mime = 3;
  bytes bytes = 4;
}

message GetBlobRequest {
  bytes agent_id = 1;
  bytes hash = 2;
}

// GetBlob answers bytes alone; the caller named the hash.
message GetBlobResponse {
  bytes bytes = 1;
}

message GetDiffRequest {
  bytes agent_id = 1;
  DiffBase base = 2;
  // Also build the patch and store it as the agent's blob.
  bool with_patch = 3;
}

message GetCatalogueRequest {
  bytes host_id = 1;
  Provider provider = 2;
}

// Which provider's program a host runs: the vocabulary amux uses to ask a
// host what it offers with no agent running. Distinct from Kind, which is
// the interpreter.
enum Provider {
  PROVIDER_UNSPECIFIED = 0;
  PROVIDER_CLAUDE = 1;
  PROVIDER_CODEX = 2;
}

// The encoded Catalogue and the SHA-256 of exactly these bytes, which is
// what HostEntry.providers names.
message GetCatalogueResponse {
  bytes hash = 1;
  bytes bytes = 2;
}

// An agent's unsent draft: its words and the attachments already stored.
message Draft {
  string text = 1;
  repeated Attachment attachments = 2;
}

message UpdateDraftRequest {
  bytes agent_id = 1;
  Draft draft = 2;
}

message GetDraftRequest {
  bytes agent_id = 1;
}

// Host-owned discovery; the client chooses a host, never a search root.
message ListRepositoriesRequest {
  optional string query = 1;
  uint32 limit = 2;
  // Absent means the answering host.
  optional bytes host_id = 3;
}

message ListRepositoriesResponse {
  repeated ProjectEntry recent = 1;
  repeated ProjectEntry repositories = 2;
  repeated string roots = 3;
}
message ProjectEntry {
  string path = 1;
  string name = 2;
  optional int64 last_used_ms = 3;
}

// Assembles the host-side parts of a dump bundle into the reports
// directory: the agents' journal tails, store slices and agent parts, all
// redacted.
message DumpRequest {
  // Empty means every agent of the profile.
  repeated bytes agent_ids = 1;
  string reason = 2;
  // Produced on an invariant violation or panic rather than on request.
  bool automatic = 3;
  // The asking client's open sessions, each an encoded
  // amux.dump.ClientSessionHistory: the session as its trace began and every
  // message since, the client stage of a replay. Opaque here because only the
  // build that wrote it reads it; a daemon that cannot decode one leaves it
  // out of the bundle and says so. Unredacted as the client holds it; the
  // daemon redacts each through its agent's kind before it writes it into the
  // bundle, and passes none on to another host.
  repeated bytes sessions = 4;
}

// Where the bundle was written, for a caller on the same machine.
message DumpResponse {
  string report_path = 1;
}

// The agent process's part of a dump: its facts ring and checkpoint,
// already redacted.
message DumpPart {
  bytes dump_id = 1;
  repeated DumpFile files = 2;
}

message DumpFile {
  string name = 1;
  bytes contents = 2;
}

// ---------------------------------------------------------------------------
// Input and the verdict on it
// ---------------------------------------------------------------------------

// A client-generated input id, the agent's kind, and that kind's input
// message encoded. Daemons forward the bytes untouched; only the agent of
// that kind decodes them, so an arm or field this daemon does not know
// reaches a newer agent intact. The reply is the interpreter's verdict,
// never a handover receipt. The daemon decodes a copy for its analytics and
// tolerates a copy it cannot decode.
message Input {
  bytes input_id = 1;
  Kind kind = 2;
  // ClaudePtyInput, ClaudeSdkInput or CodexInput, as `kind` names.
  bytes body = 3;
}

// A prompt with its client-generated input id, where a whole Input would
// admit arms that are not a prompt.
message PromptSubmission {
  bytes input_id = 1;
  PromptInput prompt = 2;
}

// The interpreter's verdict.
message SendInputResponse {
  oneof of {
    Accepted accepted = 1;
    Rejected rejected = 2;
  }
}

message Accepted {
  bool queued = 1;
}

message Rejected {
  Refusal refusal = 1;
  // The provider's or interpreter's own words, when it has any: terminal
  // Claude's sentence about a send-now it cannot do.
  optional string detail = 2;
}

enum Refusal {
  REFUSAL_UNSPECIFIED = 0;
  // The answer's ask is not open.
  REFUSAL_CLOSED_ASK = 1;
  // The withdraw or send-now target is not waiting in the queue.
  REFUSAL_NOT_QUEUED = 2;
  // This agent version, kind or state cannot take the input.
  REFUSAL_UNSUPPORTED = 3;
  REFUSAL_DRAINING = 4;
  REFUSAL_EXITING = 5;
  REFUSAL_EXITED = 6;
  REFUSAL_HOST_UNREACHABLE = 7;
  // Terminal Claude's own view switched to another conversation; this
  // agent's conversation is not the one on its screen.
  REFUSAL_CONVERSATION_ELSEWHERE = 8;
  // The prompt is longer than the agent takes; the detail names the limit.
  REFUSAL_TOO_LONG = 9;
}
