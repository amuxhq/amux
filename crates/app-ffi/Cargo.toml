[package]
name = "app-ffi"
version = "0.2.0"
edition.workspace = true
license.workspace = true
description = "The C ABI the phone calls: the embedded runtime, its chats and fleet, with view values as JSON"
publish = false

# A static library and nothing else. With an rlib alongside, rustc keeps each
# crate's own object in the archive and never runs the LTO the release profile
# asks for, so the phone would ship without whole-program optimisation.
[lib]
crate-type = ["staticlib"]

[features]
default = []
# Affordances a driving build carries and a shipping build must not.
debug-tools = []

[dependencies]
analytics = { workspace = true }
app-embedded = { workspace = true }
app-runtime = { workspace = true }
client = { workspace = true }
futures-util = { workspace = true }
ui-state = { workspace = true }
node = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
ui-view = { workspace = true }
wire = { workspace = true }

# Installing amux is a desktop app's first call; the phone hosts its own
# runtime and has nothing to install.
[target.'cfg(not(target_os = "ios"))'.dependencies]
installer = { workspace = true }

[dev-dependencies]
libc = { workspace = true }
provider-fakes = { workspace = true }
tempfile = { workspace = true }
testnet = { workspace = true }

[build-dependencies]
cbindgen = { version = "0.29", default-features = false }
