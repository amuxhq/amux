[package]
name = "provider-fakes"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Scripted stand-ins for the Claude and Codex binaries, for tests"
publish = false
autotests = false

[dependencies]
chrono = { workspace = true }
claude-protocol.workspace = true
codex-protocol.workspace = true
futures-util = { workspace = true }
libc = { workspace = true }
pty-host = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
uuid = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }

[[bin]]
name = "fake-claude-sdk"
path = "src/bin/fake_claude_sdk.rs"

[[bin]]
name = "fake-claude-pty"
path = "src/bin/fake_claude_pty.rs"

[[bin]]
name = "fake-codex"
path = "src/bin/fake_codex.rs"

[dev-dependencies]
patience = { workspace = true }

[[test]]
name = "integration"
path = "tests/integration.rs"
