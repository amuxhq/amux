source = "invariant"
section = "Fleet"
claim = "The fleet keeps one session per live agent, shared by home and the chat, so one agent never has two subscriptions; an exited agent has a session only while a chat shows it; home wakes for what is outside the rows; the phone closes and reopens every session with the foreground."
