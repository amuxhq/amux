[package]
name = "app-embedded"
version = "0.2.0"
edition.workspace = true
license.workspace = true
description = "The daemon's profile runtime hosted in the phone's process: its store, replica rows, pairing and relay link"
publish = false
autotests = false

[dependencies]
log-file = { workspace = true }
analytics = { workspace = true }
app-runtime = { workspace = true }
client = { workspace = true }
node = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
wire = { workspace = true, features = ["grpc"] }

[dev-dependencies]
model = { workspace = true }
patience = { workspace = true }
provider-fakes = { workspace = true }
tempfile = { workspace = true }
testnet = { workspace = true }
tracing = { workspace = true }
ui-view = { workspace = true }

[[test]]
name = "integration"
path = "tests/integration.rs"

# A binary of its own, so it is a process of its own under every runner:
# the runtime's log is the process's one global trace subscriber, which a
# test net another suite started first would own instead.
[[test]]
name = "runtime_log"
path = "tests/runtime_log.rs"
