syntax = "proto3";

package amux.v1;

import "amux/v1/agent_service.proto";
import "amux/v1/records.proto";

// The installation's front door: the installation itself and its profiles.
// Each profile's own account connection, pairing and peers are
// ProfileAdminService, on that profile's socket.

// Local Unix socket and in-process only. Calls are not retried by any
// client; a mutation that loses its reply is re-run by the person.
service InstallationService {
  rpc GetInstallation(Empty) returns (Installation);
  rpc Shutdown(Empty) returns (Empty);
  rpc ListProfiles(Empty) returns (ListProfilesResponse);
  rpc CreateProfile(CreateProfileRequest) returns (Profile);
  // Names a profile, or lets the installation pick or create one.
  rpc BindProfile(BindProfileRequest) returns (Profile);
  rpc RenameProfile(RenameProfileRequest) returns (Profile);
  rpc DeleteProfile(DeleteProfileRequest) returns (Empty);
  // Every profile now, then again whenever any of them changes: a new or
  // removed profile, a sign-in or sign-out, its relay link, its account's
  // name, picture or access. Each message is the whole list.
  rpc SubscribeProfiles(Empty) returns (stream ListProfilesResponse);
  // Signs a profile in with the device flow, run by the daemon: the first
  // event is the code to show the person and the page to open, the last is
  // the signed-in profile. A profile that already holds agents or paired
  // hosts asks first, with an adopt event, unless the request already
  // adopts; AnswerSignIn answers it. The stream's closing abandons the
  // sign-in.
  rpc SignIn(SignInRequest) returns (stream SignInEvent);
  rpc AnswerSignIn(AnswerSignInRequest) returns (Empty);
  // Reads the profile's account again now (its name, picture and access),
  // as after a purchase; the daemon also reads it whenever it refreshes the
  // account's token.
  rpc RefreshProfile(RefreshProfileRequest) returns (Profile);
  // The installation's everyday settings, as the config file resolves them.
  rpc GetSettings(Empty) returns (Settings);
  // Changes the named settings in the config file and applies each at once.
  rpc UpdateSettings(UpdateSettingsRequest) returns (Settings);
  // One profile's onboarding steps, now and on every change.
  rpc SubscribeOnboarding(OnboardingRequest) returns (stream Onboarding);
  rpc AnswerOnboarding(AnswerOnboardingRequest) returns (Onboarding);
  // Folders worth offering as projects: where Claude Code and Codex ran
  // lately, Git repositories that still exist.
  rpc SuggestProjects(Empty) returns (SuggestProjectsResponse);
  // A one-time link that signs the browser in to the profile's account and
  // opens `path` on amux.sh.
  rpc WebSignInLink(WebSignInLinkRequest) returns (WebSignInLinkResponse);
}

message Settings {
  // What paired hosts and phones call this machine; never empty.
  string host_name = 1;
  // Whether amux starts when the person logs in; absent when this install
  // runs no supervisor, so there is nothing to start.
  optional bool start_at_login = 2;
  // On power the machine stays awake while amux runs; on battery only while
  // an agent works.
  bool keep_awake = 3;
  // The project list new-agent pickers offer, as canonical paths.
  repeated string projects = 4;
  ChatIn chat_in = 5;
  // Which Claude a new agent runs; KIND_UNSPECIFIED follows chat_in.
  Kind claude_kind = 6;
  bool telemetry = 7;
  bool auto_reports = 8;
}

// Where the terminal client chats with agents.
enum ChatIn {
  CHAT_IN_UNSPECIFIED = 0;
  // amux's own chat.
  CHAT_IN_AMUX = 1;
  // Each agent's own interface.
  CHAT_IN_NATIVE = 2;
}

// Absent fields are left as they are.
message UpdateSettingsRequest {
  // An empty name returns to the machine's default name.
  optional string host_name = 1;
  optional bool start_at_login = 2;
  optional bool keep_awake = 3;
  // The whole new list.
  optional ProjectList projects = 4;
  optional ChatIn chat_in = 5;
  optional Kind claude_kind = 6;
  optional bool telemetry = 7;
  optional bool auto_reports = 8;
}

message ProjectList {
  repeated string paths = 1;
}

message OnboardingRequest {
  // Empty: the profile a bare `amux` opens.
  bytes profile_id = 1;
}

message Onboarding {
  bytes profile_id = 1;
  // In the order they are shown.
  repeated OnboardingStep steps = 2;
  reserved 3;
  // The person dismissed "Finish setting up": every step skipped now was
  // skipped when they did, so a client stops offering to finish them. A
  // step skipped later offers it again.
  bool dismissed = 4;
}

message OnboardingStep {
  OnboardingStepId id = 1;
  StepState state = 2;
}

enum OnboardingStepId {
  ONBOARDING_STEP_ID_UNSPECIFIED = 0;
  ONBOARDING_STEP_ID_PAIR_PHONE = 1;
  ONBOARDING_STEP_ID_KEEP_REACHABLE = 2;
  ONBOARDING_STEP_ID_SIGN_IN = 3;
  ONBOARDING_STEP_ID_PROJECTS = 4;
  ONBOARDING_STEP_ID_IMPROVE = 5;
  ONBOARDING_STEP_ID_FIRST_AGENT = 6;
}

enum StepState {
  STEP_STATE_UNSPECIFIED = 0;
  STEP_STATE_NEEDED = 1;
  STEP_STATE_DONE = 2;
  STEP_STATE_SKIPPED = 3;
  STEP_STATE_NOT_NEEDED = 4;
}

message AnswerOnboardingRequest {
  reserved 4;
  bytes profile_id = 1;
  oneof answer {
    // A confirmation step the person confirmed.
    OnboardingStepId done = 2;
    OnboardingStepId skip = 3;
    // "Finish setting up" dismissed: every needed step is skipped.
    Empty dismiss = 5;
    // The client showed the step: counted for usage, nothing kept.
    OnboardingStepId shown = 7;
    // The client put a one-tap sign-in in front of the person, on the side
    // named: counted for usage, nothing kept.
    OfferRole sign_in_offer_shown = 8;
  }
  // The client answering, for the usage event.
  Surface surface = 6;
}

// Which side of a one-tap sign-in a client is on.
enum OfferRole {
  OFFER_ROLE_UNSPECIFIED = 0;
  // Signed in, offering a paired device its account.
  OFFER_ROLE_OFFERER = 1;
  // Signed out, offered a paired device's account.
  OFFER_ROLE_RECEIVER = 2;
}

enum Surface {
  SURFACE_UNSPECIFIED = 0;
  SURFACE_TERMINAL = 1;
  SURFACE_PHONE = 2;
  SURFACE_MAC = 3;
}

message SuggestProjectsResponse {
  repeated ProjectEntry suggestions = 1;
}

message WebSignInLinkRequest {
  bytes profile_id = 1;
  // A path on amux.sh, such as "/offer".
  string path = 2;
}

message WebSignInLinkResponse {
  string url = 1;
}

message Installation { string version = 1; }

message Profile {
  bytes id = 1;
  string label = 2;
  string email = 3;
  string account_name = 4;
  string socket_path = 5;
  CloudStanding cloud = 6;
  // The account's picture, an https URL; empty when it has none.
  string picture_url = 7;
  // What the account may do, as amux.sh last said; absent until the
  // daemon has read it, and for a profile never signed in.
  Access access = 8;
  // The account's identifier at its service, kept after a sign-out: what
  // makes two profiles' accounts the same. Empty for a profile never signed
  // in.
  string account_subject = 9;
}

// What an account may do. `pro` is the whole gate; the rest explains it.
message Access {
  bool pro = 1;
  // When access ends, or ended, in milliseconds since the epoch; absent
  // when nothing ends.
  optional int64 until_ms = 2;
  // Why the account has it; absent when nothing was ever bought or given.
  oneof grant {
    // Given without a purchase: complimentary, a trial, a beta.
    Empty granted = 3;
    Purchase purchased = 4;
  }
}

message Purchase {
  PurchaseStore store = 1;
  // Whether it charges again; a cancelled subscription runs to its end.
  bool will_renew = 2;
  // When it charges again, in milliseconds since the epoch.
  optional int64 renews_at_ms = 3;
}

enum PurchaseStore {
  PURCHASE_STORE_UNSPECIFIED = 0;
  PURCHASE_STORE_APP_STORE = 1;
  PURCHASE_STORE_WEB = 2;
}

// A profile's standing with its cloud account: what the person asked for
// and, while signed in, what its relay link is doing.
message CloudStanding {
  oneof standing {
    // Never signed in.
    Empty unbound = 1;
    // Signed out, still tied to its account.
    Empty signed_out = 2;
    RelayLink signed_in = 3;
  }
}

// What a signed-in profile's relay link is doing.
message RelayLink {
  oneof state {
    Empty connecting = 1;
    RelayConnected connected = 2;
    Empty retrying = 3;
    // The account service refused the profile's credentials.
    Empty sign_in_again = 4;
    // The cloud refused this build as too old for its protocol.
    Empty version_mismatch = 5;
  }
}

message RelayConnected {
  Tier tier = 1;
  RelayCarrier carrier = 2;
}

enum Tier {
  TIER_UNSPECIFIED = 0;
  TIER_FREE = 1;
  TIER_PRO = 2;
}

enum RelayCarrier {
  RELAY_CARRIER_UNSPECIFIED = 0;
  RELAY_CARRIER_QUIC = 1;
  RELAY_CARRIER_TCP = 2;
}

message ListProfilesResponse { repeated Profile profiles = 1; }

message CreateProfileRequest { optional string label = 1; }

message BindProfileRequest {
  optional bytes profile_id = 1;
  string cloud_url = 2;
  string staged_refresh_token = 3;
  bool adopt_non_pristine = 4;
  // The OAuth client the refresh token was issued to; empty is the CLI's.
  // A token refreshes only under the client that obtained it.
  string client_id = 5;
}

message RenameProfileRequest {
  bytes profile_id = 1;
  string name = 2;
}

message DeleteProfileRequest {
  bytes profile_id = 1;
}

message SignInRequest {
  // The profile to sign in; absent lets the installation pick: the profile
  // already bound to this account, else the one that holds nothing yet,
  // else a new one.
  optional bytes profile_id = 1;
  // The account service; empty is https://amux.sh.
  string cloud_url = 2;
  // Sign in a profile that already holds agents or paired hosts without
  // asking.
  bool adopt_non_pristine = 3;
}

message SignInEvent {
  oneof of {
    SignInCode code = 1;
    // The chosen profile holds agents or paired hosts: answer with
    // AnswerSignIn, naming this sign-in.
    SignInAdopt adopt = 2;
    // Signed in; the stream ends.
    Profile signed_in = 3;
  }
}

// What the person does to sign in: open `verification_uri_complete`, or
// open `verification_uri` and type `user_code`.
message SignInCode {
  string verification_uri = 1;
  string verification_uri_complete = 2;
  string user_code = 3;
  // When the code stops working, in milliseconds since the epoch.
  int64 expires_at_ms = 4;
}

message SignInAdopt {
  bytes sign_in_id = 1;
  // The profile that would be signed in.
  Profile profile = 2;
}

message AnswerSignInRequest {
  bytes sign_in_id = 1;
  // Sign the profile in anyway; false abandons the sign-in.
  bool adopt = 2;
}

message RefreshProfileRequest { bytes profile_id = 1; }
