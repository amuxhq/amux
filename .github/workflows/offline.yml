name: Weekly offline tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 0"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  offline-test:
    name: Offline workspace tests
    # Linux, for a network namespace with nothing but loopback in it.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
      # The Linux test job's cache: a weekly cache of its own is evicted
      # after seven days unused, so every run compiled from nothing.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
          save-if: false
      - uses: ./.github/actions/setup-just
      - uses: ./.github/actions/setup-nextest
      # The claim is that the tests need no network, not that fetching
      # their dependencies needs none: a fresh runner has an empty registry.
      - name: Fetch dependencies while the network is still available
        run: cargo fetch --locked
      - name: Run without external network access
        run: just offline-test
