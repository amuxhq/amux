[package]
name = "node"
version = "0.8.3"
edition.workspace = true
license.workspace = true
description = "The amux daemon: installation, profile runtimes, the agent registry and startup"
publish = false

[dependencies]
log-file = { workspace = true }
agent-dir = { workspace = true }
analytics = { workspace = true }
git-facts = { workspace = true }
async-trait = { workspace = true }
base64 = "0.22"
bytes = { workspace = true }
chrono = { workspace = true }
core-ring = { workspace = true }
daemon-core = { workspace = true }
relay-core = { workspace = true }
path-core = { workspace = true }
futures-util = { workspace = true }
hyper-util = { workspace = true }
quinn = { workspace = true }
rcgen = { workspace = true }
release = { workspace = true }
supervisor-core = { workspace = true }
ring = { workspace = true }
rustls = { workspace = true }
socket2 = { workspace = true }
tokio-rustls = { workspace = true }
tokio-util = { workspace = true }
tower = { workspace = true }
webpki-roots = { workspace = true }
# The dump path's redactor: the one place the daemon decodes a body.
interpret = { workspace = true }
journal = { workspace = true }
prost = { workspace = true }
reqwest = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
settings = { workspace = true }
sha2 = { workspace = true }
store = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
version-stamp = { workspace = true }
wire = { workspace = true, features = ["grpc"] }
zstd = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(not(target_os = "ios"))'.dependencies]
if-addrs = { workspace = true }
mdns-sd = "0.21"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dev-dependencies]
release = { workspace = true, features = ["test-key"] }
journal = { workspace = true, features = ["synthetic"] }
patience = { workspace = true }
provider-fakes = { workspace = true }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
