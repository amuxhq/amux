  "swift:AmuxCoreTests/ChatModelTests/testAnExitedAgentResumesWithTheDraft",
]

[[contract]]
id = "daemon-update-mid-turn-with-open-ask"
source = "worked failure"
section = "Supervisor and updates"
claim = "The daemon restarts under an agent mid-turn with an open ask: the agent keeps the ask through the grace, the new daemon reads it back and clients see the same ask and answer it; only when no daemon returns within the drain deadline does the agent exit orphaned while waiting for you."
