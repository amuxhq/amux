# Every journal fixture: the frames file `<name>.frames`, the interpreter
# that made it, the script it was cut from, what the journal reaches, and
# what its end leaves on purpose. tests/journal_fixtures.rs holds each file to
# this list and to the interpreter's invariants.

# Cut from provider recordings through each kind's interpreter.

[[journal]]
name = "claude_pty-prompt"
kind = "claude_pty"
source = "../../../interpret/fixtures/claude_pty/recorded_prompt.json"
reaches = ["turn_end"]

