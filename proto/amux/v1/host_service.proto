syntax = "proto3";

package amux.v1;

// What a host offers before any agent exists: each provider's catalogue,
// and the folders its person pinned for a new agent to start in.
//
// A host service: answered by the host the call is addressed to, about
// itself. Its node answers a call addressed to itself and passes any
// other on, unread, to the host it names, so a request never names a
// host. Any caller may read a catalogue; only a person pins.
//
// The folders themselves are not asked of the host: they replicate on its
// own entry (HostEntry.folders), so a client reads them from its node.

service HostService {
  // What a provider offers on this host with no agent running, read from
  // the host's own copy; an agent's catalogue is a file named by its
  // snapshot instead.
  rpc GetCatalogue(GetCatalogueRequest) returns (GetCatalogueResponse);
  // Pins a folder among this host's repositories, at the end of the list,
  // or unpins it: the only way a client changes the list, which is the
  // `repositories` key of the host's config. A person's act, refused to an
  // agent. The host's own entry says the
  // change, as every client sees through its inventory.
  rpc PinFolder(PinFolderRequest) returns (PinFolderResponse);
}

message GetCatalogueRequest {
  // The provider's id, as ProviderOnHost.provider names it: "claude",
  // "codex", or an ACP agent's. A host refuses an id it does not offer.
  string provider = 1;
}

// The encoded Catalogue and the SHA-256 of exactly these bytes, which is
// what HostEntry.providers names.
message GetCatalogueResponse {
  bytes hash = 1;
  bytes bytes = 2;
}

message PinFolderRequest {
  // An absolute path on the answering host, or one from its home
  // ("~/src/app").
  string path = 1;
  // Pinned at the end of the list, or unpinned.
  bool pinned = 2;
}

message PinFolderResponse {}
