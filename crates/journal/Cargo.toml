[package]
name = "journal"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Append-only journal segments between an agent process and its daemon"
publish = false
autotests = false

[features]
# The synthetic writer daemon and client tests drive journals with.
synthetic = []

[dependencies]
prost = { workspace = true }
wire = { workspace = true }

[dev-dependencies]
journal = { path = ".", features = ["synthetic"] }
tempfile = { workspace = true }

[[test]]
name = "integration"
path = "tests/integration.rs"
