<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" role="img">
  <title>Sequence: the client mints an input id and sends. The daemon forwards over ctl.sock; the interpreter decides at once and replies accepted with a queued flag or rejected with a refusal, and the daemon relays that reply. A prompt's reflection arrives later as an item carrying the input id through the journal, store and subscription. If the reply is lost, the client waits for CaughtUp and checks its own state; a prompt it cannot find is shown as not confirmed and left to the person.</title>
  <style>
    svg { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .box { fill: #6e7681; fill-opacity: 0.06; stroke: #6e7681; stroke-width: 1.2; }
    .box2 { fill: #6e7681; fill-opacity: 0.14; stroke: #6e7681; stroke-width: 1.2; }
    .pin { fill: #d97706; fill-opacity: 0.12; stroke: #d97706; stroke-width: 1.2; }
    .file { fill: #3b82f6; fill-opacity: 0.10; stroke: #3b82f6; stroke-width: 1.2; }
    .ghost { fill: none; stroke: #6e7681; stroke-width: 1; stroke-dasharray: 4 4; opacity: 0.7; }
    .lane { fill: none; stroke: #6e7681; stroke-width: 1; stroke-dasharray: 3 5; opacity: 0.5; }
    .arrow { fill: none; stroke: #6e7681; stroke-width: 1.3; }
    .arrow-file { fill: none; stroke: #3b82f6; stroke-width: 1.5; }
    .arrow-dashed { fill: none; stroke: #6e7681; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .note { fill: #059669; fill-opacity: 0.10; stroke: #059669; stroke-width: 1; }
    .bar { fill: #6e7681; fill-opacity: 0.14; stroke: #6e7681; stroke-width: 1.2; }
    .bar-a { fill: #3b82f6; fill-opacity: 0.14; stroke: #3b82f6; stroke-width: 1.2; }
    text { font-size: 12px; fill: #6e7681; }
    text.t { font-size: 13px; font-weight: 600; }
    text.s { font-size: 11px; fill: #7d8590; }
    text.a { fill: #3b82f6; }
    text.p { fill: #d97706; }
    text.sans { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e7681"/></marker>
    <marker id="ahf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker>
  </defs>


<rect class="box" x="40" y="16" width="140" height="36" rx="4"/><text class="t" x="110" y="39" text-anchor="middle">client (Session)</text><rect class="box" x="400" y="16" width="140" height="36" rx="4"/><text class="t" x="470" y="39" text-anchor="middle">local daemon</text><rect class="box" x="760" y="16" width="160" height="36" rx="4"/><text class="t" x="840" y="39" text-anchor="middle">agent process</text><line class="lane" x1="110" y1="52" x2="110" y2="340"/><line class="lane" x1="470" y1="52" x2="470" y2="340"/><line class="lane" x1="840" y1="52" x2="840" y2="340"/><rect class="note" x="20" y="66" width="230" height="30" rx="3"/><text class="s sans" x="135" y="84" text-anchor="middle">optimistic row keyed by input_id</text><path class="arrow" d="M110,120 L470,120" marker-end="url(#ah)"/><text class="s" x="290" y="114" text-anchor="middle">SendInput(agent, Input{input_id, …})</text><path class="arrow" d="M470,120 L840,120" marker-end="url(#ah)"/><text class="s" x="655" y="114" text-anchor="middle">Input over ctl.sock</text><rect class="note" x="670" y="134" width="320" height="62" rx="3"/><text class="s sans" x="830" y="152" text-anchor="middle">the interpreter decides now:</text><text class="s sans" x="830" y="168" text-anchor="middle">prompt → submit or queue · answer → ask open?</text><text class="s sans" x="830" y="184" text-anchor="middle">withdraw → queued? · setting → applied?</text><path class="arrow" d="M840,208 L470,208" marker-end="url(#ah)"/><text class="s" x="655" y="202" text-anchor="middle">Verdict{id, verdict}</text><path class="arrow" d="M470,208 L110,208" marker-end="url(#ah)"/><text class="s" x="290" y="202" text-anchor="middle">accepted{queued} | rejected{refusal}</text><rect class="note" x="20" y="222" width="220" height="46" rx="3"/><text class="s sans" x="130" y="240" text-anchor="middle">the sender’s receipt:</text><text class="s sans" x="130" y="256" text-anchor="middle">queued · settled · rejected</text><path class="arrow-file" d="M840,286 L110,286" marker-end="url(#ahf)"/><text class="s a" x="475" y="280" text-anchor="middle">Item{input_id}: a prompt’s reflection, via journal → store → subscription</text><text class="s" x="20" y="326">reply lost? the row is uncertain until the next CaughtUp; found in the queue or items → settled;</text><text class="s" x="20" y="340">not found → "not confirmed" and the person decides. Nothing is resent automatically.</text>
</svg>
