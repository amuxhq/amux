# wt owns the tree, its environment, its daemon and the simulator pools;
# `just --list` is the task list.

# Start a new tree with the main checkout's build output: third-party crates
# stay fresh, so the first build only compiles this workspace.
copy = ["target"]

# `amux` inside a tree is the tree's own build, never the installed one.
[bin]
amux = "target/debug/amux"

[env]
AMUX_CONFIG = "{{root}}/.wt/amux/config.toml"
AMUX_LOG = "{{root}}/.wt/amux/amux.log"

[files.".wt/amux/config.toml"]
content = """
host_name = "{{name_short}}"
root = "{{root}}/.wt/amux"
supervisor = false
keep_awake = false

[discovery]
scope = "{{name}}"
"""

[lifecycle]
create = "just build"
start = "amux server start"
stop = "amux server stop"

# The pinned iPhones this Mac owns. A recipe leases one and gets it clean;
# a tree prefers the one it used last, so a series of recipes reuses a booted
# device. One nobody has leased for half an hour is deleted, and the next use
# pays the fifty-second create again. The recipes name a kind, golden or
# small, and apps/apple/Tools/ios_simulators.py maps the kind to the leased
# device; its `acquire` creates the device when it is missing. Size, wait and
# idle are machine facts: override under [pool.iphone] in ~/.wt/config.toml.
# The commands go through scripts/py because a hook inherits whatever PATH it
# was started with, and on a Mac a bare python3 is often the system's 3.9.
[pool.iphone]
size = 2
name = "amux-iphone-{{n}}"
acquire = 'scripts/py apps/apple/Tools/ios_simulators.py acquire "$WT_LEASE" golden'
idle = "30m"
retire = 'xcrun simctl delete "$WT_LEASE" || true'
wait = "45m"

[pool.iphone-small]
size = 1
name = "amux-small-{{n}}"
acquire = 'scripts/py apps/apple/Tools/ios_simulators.py acquire "$WT_LEASE" small'
idle = "30m"
retire = 'xcrun simctl delete "$WT_LEASE" || true'
wait = "45m"
