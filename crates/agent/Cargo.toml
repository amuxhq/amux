[package]
name = "agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The agent process: hosts one provider, runs its interpreter and writes its journal"
publish = false

[dependencies]
agent-dir = { workspace = true }
attachments = { workspace = true }
claude = { workspace = true, features = ["pty"] }
claude-protocol = { workspace = true }
codex = { workspace = true }
codex-protocol = { workspace = true }
git-facts = { workspace = true }
hyper-util = { workspace = true }
interpret = { workspace = true }
journal = { workspace = true }
prost = { workspace = true }
serde = { workspace = true }
pty-host = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
tower = { workspace = true }
uuid = { workspace = true }
wire = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
futures-util = { workspace = true }
patience = { workspace = true }
provider-fakes = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
tokio-tungstenite = { workspace = true }
