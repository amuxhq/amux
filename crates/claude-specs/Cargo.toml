[package]
name = "claude-specs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
autotests = false

[dependencies]
replay-support = { path = "../replay-support" }
pty-host = { workspace = true }
redaction = { workspace = true }
semver = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[[bin]]
name = "claude-probe"
path = "src/bin/claude_probe/main.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"
