# The chat vocabulary's catalogue, one entry per row, with each kind's
# availability mark as the catalogue gives it:
#
#   full     the provider reports everything the row shows
#   partial  the provider reports part of it
#   none     the provider cannot report it
#   na       the row does not apply to the kind
#
# A kind whose mark is full or partial names where the row lives in its
# bodies — `item:<arm>` (or `item:<arm>.<field>` inside that arm) in the
# kind's item body, `snapshot:<field>` in its snapshot body, `ask:<arm>` in
# its ask — and a golden line that shows it: every string in `golden` must
# appear on one line of a golden under fixtures/<kind>/, and none prefixed
# with `!` may. The vocabulary_coverage test in coverage.rs holds every row
# to this.

# ---------------------------------------------------------------- Conversation

[[row]]
id = "C1"
item = "Your message"
claude_pty = { mark = "full", carriers = ["item:prompt"], golden = [" prompt final "] }
claude_sdk = { mark = "full", carriers = ["item:prompt"], golden = [" prompt final "] }
codex = { mark = "full", carriers = ["item:prompt"], golden = [" prompt final "] }

[[row]]
id = "C2"
item = "Agent reply"
# Terminal Claude streams a reply a line at a time, not a word at a time.
claude_pty = { mark = "partial", carriers = ["item:message"], golden = [" message open "] }
claude_sdk = { mark = "full", carriers = ["item:message"], golden = [" message open "] }
codex = { mark = "full", carriers = ["item:message", "item:working_note"], golden = [" working_note "] }

[[row]]
id = "C3"
item = "Thinking"
claude_pty = { mark = "partial", carriers = ["item:thinking"], golden = [" thinking final "] }
claude_sdk = { mark = "full", carriers = ["item:thinking"], golden = [" thinking ", "text=\"The user"] }
codex = { mark = "full", carriers = ["item:reasoning"], golden = [" reasoning ", " summary"] }

[[row]]
id = "C4"
item = "Message between agents"
claude_pty = { mark = "full", carriers = ["item:agent_message"], golden = [" agent_message "] }
claude_sdk = { mark = "full", carriers = ["item:agent_message"], golden = [" agent_message "] }
codex = { mark = "full", carriers = ["item:agent_message"], golden = [" agent_message "] }

