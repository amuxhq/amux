syntax = "proto3";

package amux.v1;

import "amux/v1/records.proto";

// Claude's per-kind bodies: the item and snapshot messages encoded into
// Item.body and Snapshot.body for kinds claude_pty and claude_sdk, the
// inputs each accepts, and the answers inside them.

message ClaudeCreateConfig {
  // Extra provider arguments exactly as the person gave them.
  repeated string args = 1;
  optional string model = 2;
  optional string effort = 3;
  // A permission Claude offers ("default", "acceptEdits", "plan", "auto",
  // "bypassPermissions").
  optional string permission = 4;
}

// ---------------------------------------------------------------------------
// Claude in a terminal
// ---------------------------------------------------------------------------

message ClaudePtyItem {
  oneof kind {
    Prompt prompt = 1;
    Text message = 2;
    Thinking thinking = 3;
    ToolCall tool = 4;
    Turn turn = 5;
    Compaction compaction = 6;
    CompactSummary compact_summary = 7;
    TaskNotification task = 8;
    Interruption interruption = 9;
    AgentMessage agent_message = 10;
    ApiError api_error = 11;
    Boundary boundary = 12;
    SlashOutput slash = 13;
    Unrecognized unrecognized = 14;
    // A prompt delivered into the running turn; the text is the envelope's.
    Steer steer = 15;
    // A dialog Claude shows in its own terminal that no hook can answer: an
    // unanswerable ask that is its own row.
    AskItem ask = 16;
    // The plan Claude declared, keyed by the call that declared it.
    Plan plan = 17;
  }
}

// The summary a compaction wrote into the transcript; the summary is the
// envelope text.
message CompactSummary {}

// A background task's completion notice injected into the conversation.
message TaskNotification {
  string task_id = 1;
  string status = 2;
  string summary = 3;
}

// "You stopped it."
message Interruption {}

// Phase lives in the Snapshot envelope, once.
message ClaudePtySnapshot {
  repeated Ask asks = 1;
  TaskList tasks = 2;
  ContextMeter context = 3;
  optional string model = 4;
  // The running model as a person reads it; absent while the model is.
  optional string model_name = 5;
  optional string permission = 6;
  // Absent until SessionStart or the first system event names it.
  optional string provider_session = 7;
  ClaudeUsage usage = 8;
  ToolServerHealth servers = 9;
  SignIn sign_in = 10;
  BackgroundJobs background_jobs = 11;
  // The calls PreToolUse hooks announced that no result has ended yet,
  // oldest first. A call's transcript row can lag its hook by seconds while
  // a background task runs, so the activity line reads the call from here
  // until then.
  repeated RunningCall running_calls = 12;
}

message RunningCall {
  string tool_use_id = 1;
  string tool_name = 2;
  int64 since_ms = 3;
}

message ClaudePtyInput {
  oneof of {
    PromptInput prompt = 1;
    ClaudeAnswer answer = 2;
    // Terminal Claude's permission-mode cycle, the one keystroke a remote
    // client sends; the agent process emits the bytes for the Claude it
    // runs. Raw terminal bytes never cross the wire; anything else is
    // typed at the machine.
    CyclePermissionMode cycle_permission_mode = 3;
    Clear clear = 4;
    Interrupt interrupt = 5;
    WithdrawQueued withdraw = 6;
    SendQueuedNow send_now = 7;
  }
}

message CyclePermissionMode {}

// ---------------------------------------------------------------------------
// Claude through the SDK
// ---------------------------------------------------------------------------

message ClaudeSdkItem {
  oneof kind {
    Prompt prompt = 1;
    Text message = 2;
    Thinking thinking = 3;
    ToolCall tool = 4;
    Task task = 5;
    Turn turn = 6;
    Status status = 7;
    Boundary boundary = 8;
    AgentMessage agent_message = 9;
    ApiError api_error = 10;
    SlashOutput slash = 11;
    Unrecognized unrecognized = 12;
    ModelSwitch model_switch = 13;
    Compaction compaction = 14;
    // A prompt delivered into the running turn; the text is the envelope's.
    Steer steer = 15;
    // A tool-server form or link: an ask that is the work.
    AskItem ask = 16;
    // The plan Claude declared, keyed by the call that declared it.
    Plan plan = 17;
  }
}

// A task the SDK reports whose starting call it never showed; a task of a
// known call is progress on that call instead.
message Task {
  string task_id = 1;
  string description = 2;
  TaskState state = 3;
  uint32 tool_count = 4;
  string last_tool = 5;
  uint64 tokens = 6;
}

enum TaskState {
  TASK_STATE_UNSPECIFIED = 0;
  TASK_STATE_RUNNING = 1;
  TASK_STATE_COMPLETED = 2;
  TASK_STATE_FAILED = 3;
  TASK_STATE_STOPPED = 4;
}

// A status the SDK reports as an event worth a row; the text is the envelope
// text.
message Status {
  string status = 1;
}

message ClaudeSdkSnapshot {
  repeated Ask asks = 1;
  TaskList tasks = 2;
  ContextMeter context = 3;
  optional string model = 4;
  // The running model as a person reads it: the catalogue entry it was set
  // from, else the entry whose value is its id, else its id tidied.
  // Absent while the model is.
  optional string model_name = 5;
  optional string effort = 6;
  optional string permission = 7;
  repeated Task active_tasks = 8;
  ClaudeUsage usage = 9;
  ToolServerHealth servers = 10;
  SignIn sign_in = 11;
  BackgroundJobs background_jobs = 12;
  // Absent until the init event names it.
  optional string provider_session = 13;
  // What it offers is in the catalogue the Snapshot names.
}

message ClaudeSdkInput {
  oneof of {
    PromptInput prompt = 1;
    ClaudeAnswer answer = 2;
    Interrupt interrupt = 3;
    SetPermission permission = 4;
    SetModel model = 5;
    Clear clear = 6;
    WithdrawQueued withdraw = 7;
    SetEffort effort = 8;
    SendQueuedNow send_now = 9;
  }
}

// ---------------------------------------------------------------------------
// Answers (for both Claude kinds)
// ---------------------------------------------------------------------------

// Rejected closed_ask if ask_key is not open.
message ClaudeAnswer {
  string ask_key = 1;
  oneof of {
    PermissionAnswer permission = 2;
    QuestionAnswer question = 3;
    PlanAnswer plan = 4;
    FormAnswer form = 5;
    LinkAnswer link = 6;
    ReplyInstead reply = 7;
  }
}

message PermissionAnswer {
  oneof of {
    PermissionAllow allow = 1;
    PermissionDeny deny = 2;
  }
}

message PermissionAllow {
  // A ScopeChoice.index from the ask; absent allows once.
  optional uint32 scope = 1;
}

message PermissionDeny {
  string note = 1;
  bool stop = 2;
}
