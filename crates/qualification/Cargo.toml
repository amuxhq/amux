[package]
name = "qualification"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
autotests = false

# `store` is a dependency only so `bundled` can name its feature.
[package.metadata.cargo-shear]
ignored = ["store"]

[features]
default = []
bundled = ["store/bundled"]
# The release perf binary. The workloads themselves build without it, so
# their smoke runs in the ordinary test lane.
perf = []
# The live provider compatibility lane: real providers under the operator's
# login, run only on request through `just live`.
live = []

[lib]

[[bin]]
name = "perf"
path = "src/bin/perf.rs"
required-features = ["perf"]

# The relay's scaling curve, built in release by `just relay-curve`.
[[bin]]
name = "relay-curve"
path = "src/bin/relay_curve.rs"
required-features = ["perf"]

# The phone's performance topology, written for `testnet serve` by
# `just ios perf`; needs no feature, so the ordinary tools build carries it.
[[bin]]
name = "phone-topology"
path = "src/bin/phone_topology.rs"

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
node = { workspace = true }
provider-fakes = { workspace = true }
quinn = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
store = { workspace = true }
testnet = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tonic = { workspace = true }
uuid = { workspace = true }
wire = { workspace = true, features = ["grpc"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
agent-dir = { workspace = true }
bytes = { workspace = true }
hyper-util = { workspace = true }
interpret = { workspace = true }
prost = { workspace = true }
pty-host = { workspace = true }
tempfile = { workspace = true }
tower = { workspace = true }
ui-state = { workspace = true }
vt100 = { workspace = true }

[[test]]
name = "claude_pty_live"
path = "tests/claude_pty_live.rs"
harness = false
required-features = ["live"]

[[test]]
name = "claude_sdk_live"
path = "tests/claude_sdk_live.rs"
harness = false
required-features = ["live"]

[[test]]
name = "codex_live"
path = "tests/codex_live.rs"
harness = false
required-features = ["live"]

[[test]]
name = "integration"
path = "tests/integration.rs"
