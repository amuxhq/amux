name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  # The public halves of the release signing key and its offline backup,
  # comma-separated. The signing seed lives only in the release Mac's
  # release keychain and the backup's off it (docs/RELEASE.md, "The release
  # key"); the binaries built here trust manifests signed with either.
  AMUX_RELEASE_PUBLIC_KEYS: 8d172ee8b9d0eed49f0ac9ffa831a83a1554f262646826ef59fea67836d7d288,c37f64b363171e3b6335b475477e1fcf110f870d8bd1b6be87e92a15183455a0

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: amux-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: amux-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: amux-windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - uses: ./.github/actions/setup-just

      - name: Build release
        run: just release-check -- --target ${{ matrix.target }}

      # The shipped binary without symbols, and its symbols beside it under
      # the asset's name, so a crash in a release can be symbolicated.
      - name: Split symbols
        shell: bash
        run: scripts/release-symbols.sh ${{ matrix.target }} ${{ matrix.artifact }}${{ runner.os == 'Windows' && '.exe' || '' }} out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect files
        run: mv artifacts/*/* .

      - name: Generate checksums
        run: sha256sum amux-linux-x86_64 amux-macos-arm64 amux-windows-x86_64.exe > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            amux-linux-x86_64
            amux-macos-arm64
            amux-windows-x86_64.exe
            amux-linux-x86_64.debug
            amux-macos-arm64.dSYM.zip
            amux-windows-x86_64.pdb
            checksums.txt
          generate_release_notes: true
