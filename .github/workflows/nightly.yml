# What no push or landing waits for, every night on main: the protocol
# models, Miri, the sanitizers, the release build, the offline tests and the
# simulated stories under thousands of seeds. They look for faults rarer than
# a change should wait on, and the models alone run for hours. Each job runs
# one kind of scripts/nightly.py, which says what each runs; the same command
# reproduces a job anywhere. A failed scheduled run is mailed to whoever
# GitHub notifies for this workflow.
name: Nightly

on:
  schedule:
    # 01:00 UTC: done, models included, before a European morning.
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A run started by hand during the night's waits for it rather than
# running beside it.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

# No job keeps a Rust cache. GitHub's cache holds 10 GB for the whole
# repository, and the per-push jobs need it to start warm (the macOS jobs'
# stores alone are most of it); each of these saved 270-610 MB a night to
# save a compile that is minutes of a job that runs for hours.
jobs:
  # The models' integration tests, one module per model, so a model added
  # there is checked here without anyone listing it.
  models-list:
    name: List the models
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      models: ${{ steps.list.outputs.models }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: list
        run: |
          models=$(sed -n 's/^mod \([a-z_]*\);$/\1/p' crates/models/tests/integration.rs | jq -Rnc '[inputs]')
          echo "models=$models" | tee -a "$GITHUB_OUTPUT"

  # One job per model: all of them one after another take longer than a
  # hosted job's six hours on its four cores. The checker explores depth
  # first, which holds a path rather than a frontier, so a model fits the
  # runner's 16 GB (crates/models/README.md).
  models:
    name: Model (${{ matrix.model }})
    needs: models-list
    runs-on: ubuntu-latest
    # Six hours is a hosted job's limit; the recipe's own bound ends the
    # checks a quarter of an hour before it.
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(needs.models-list.outputs.models) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
      - name: Fetch the pinned tools
        run: nix develop --command true
      - name: Check the model
        run: nix develop --command scripts/py scripts/nightly.py models ${{ matrix.model }}

  cargo:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Pointer checks over the C ABI
            kind: pointers
            timeout: 60
          - name: Address sanitizer
            kind: address
            timeout: 90
          - name: Thread sanitizer
            kind: thread
            timeout: 90
          - name: Offline tests
            kind: offline
            timeout: 120
          - name: Simulated stories, 2000 seeds
            kind: seeds
            timeout: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The whole workspace's test build and the Nix toolchain together
      # outgrow the runner's free disk; the preinstalled toolchains nothing
      # here uses make room for them.
      - name: Make room on the disk
        if: matrix.kind == 'offline' || matrix.kind == 'seeds'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
      - name: Fetch the pinned tools
        run: nix develop --command true
      - name: Run ${{ matrix.kind }}
        run: nix develop --command scripts/py scripts/nightly.py ${{ matrix.kind }}

  # The shipping binary as a release builds it: with rustup's pinned Rust
  # and the system's C compiler rather than Nix's, and no cache, as the
  # Release workflow's Linux build does (scripts/release-build.py).
  release:
    name: Release build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      # Python 3.14 unpacks the pinned Buck2 (scripts/buck-tools.py).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Build the release and check its dependency policy
        run: scripts/py scripts/nightly.py release
