# gitleaks reads this from the repository root: its default rules, less two
# kinds of string the generic-key rule mistakes for keys.

[extend]
useDefault = true

# Recorded agent sessions are full of identifiers: Codex names each command
# `exec-<uuid>` and Claude each retry by a bare UUID. Only in recordings, so a
# UUID-shaped key pasted into source is still caught.
[[allowlists]]
description = "Session identifiers in recorded fixtures and goldens"
condition = "AND"
paths = ['''(^|/)(fixtures|goldens?)/''']
regexes = ['''^(exec-)?[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$''']

# Tests that prove redaction plant fake credentials and mark them so.
[[allowlists]]
description = "Planted test credentials"
regexes = ['''PLANTED''']

# An agent record stands in for each id, item key and tool server name with
# an alias (`interpret::record`): its kind and twelve hex digits. Only in
# fixtures, so a key of that shape pasted into source is still caught.
[[allowlists]]
description = "Agent record aliases in fixtures"
condition = "AND"
paths = ['''(^|/)fixtures/''']
regexes = ['''^(id|key|name)-[0-9a-f]{12}$''']

# CryptoKit's name for a key's type, beside the word `key` wherever one is
# declared. The exact type name only, so a real value is still caught.
[[allowlists]]
description = "CryptoKit's private key type"
regexes = ['''^Curve25519\.KeyAgreement\.PrivateKey$''']
