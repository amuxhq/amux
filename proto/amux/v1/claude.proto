syntax = "proto3";

package amux.v1;

import "amux/v1/chat.proto";
import "amux/v1/records.proto";

// Claude's bodies: the item and snapshot messages encoded into Item.body
// and Snapshot.body for both kinds claude_pty and claude_sdk, the inputs
// each kind accepts, and the answers inside them.

// ---------------------------------------------------------------------------
// Items and snapshots (for both Claude kinds)
// ---------------------------------------------------------------------------

message ClaudeItem {
  oneof kind {
    Prompt prompt = 1;
    Text message = 2;
    Thinking thinking = 3;
    ClaudeToolCall tool = 4;
    Turn turn = 5;
    Compaction compaction = 6;
    AgentMessage agent_message = 7;
    ApiError api_error = 8;
    Boundary boundary = 9;
    SlashOutput slash = 10;
    Unrecognized unrecognized = 11;
    // A prompt delivered into the running turn; the text is the envelope's.
    Steer steer = 12;
    // An ask that is its own row: a tool server's form or link, or a
    // dialog terminal Claude shows that no hook can answer.
    AskItem ask = 13;
    // The plan Claude declared, keyed by the call that declared it.
    Plan plan = 14;
    ClaudeTask task = 15;
    ClaudeStatus status = 16;
    ModelSwitch model_switch = 17;
  }
}

// A task headless Claude reports whose starting call it never showed; a
// task of a known call is progress on that call instead.
message ClaudeTask {
  string task_id = 1;
  string description = 2;
  TaskState state = 3;
  uint32 tool_count = 4;
  string last_tool = 5;
  uint64 tokens = 6;
}

enum TaskState {
  TASK_STATE_UNSPECIFIED = 0;
  TASK_STATE_RUNNING = 1;
  TASK_STATE_COMPLETED = 2;
  TASK_STATE_FAILED = 3;
  TASK_STATE_STOPPED = 4;
}

// A status headless Claude reports as an event worth a row; drawn hidden,
// read by the activity line until the compaction row lands.
message ClaudeStatus {
  SdkStatus status = 1;
  // Claude's own word, always carried.
  string word = 2;
}

enum SdkStatus {
  SDK_STATUS_UNSPECIFIED = 0;
  SDK_STATUS_COMPACTING = 1;
}

// What only Claude says about its session. Its phase, settings, sign-in,
// conversation and background jobs are in the Snapshot envelope; what it
// offers is in the catalogue the Snapshot names.
message ClaudeSnapshot {
  repeated ClaudeAsk asks = 1;
  TaskList tasks = 2;
  ContextMeter context = 3;
  ClaudeUsage usage = 4;
  repeated ToolServer servers = 5;
  // Terminal Claude's calls PreToolUse hooks announced that no result has
  // ended yet, oldest first. A call's transcript row can lag its hook by
  // seconds while a background task runs, so the activity line reads the
  // call from here until then.
  repeated RunningCall running_calls = 6;
  // Terminal Claude's own view resumed another conversation, so it shows
  // one that is not this agent's; prompts are refused until it is back.
  // The phase is left as it is.
  optional bool switched_away = 7;
  // The subagents and tasks headless Claude reports running.
  repeated ClaudeTask active_tasks = 8;
}

message RunningCall {
  string tool_use_id = 1;
  string tool_name = 2;
  int64 since_ms = 3;
}

// ---------------------------------------------------------------------------
// Claude in a terminal
// ---------------------------------------------------------------------------

message ClaudePtyInput {
  oneof of {
    PromptInput prompt = 1;
    ClaudeAnswer answer = 2;
    // Terminal Claude's permission-mode cycle, the one keystroke a remote
    // client sends; the agent process emits the bytes for the Claude it
    // runs. Raw terminal bytes never cross the wire; anything else is
    // typed at the machine.
    CyclePermissionMode cycle_permission_mode = 3;
    Clear clear = 4;
    Interrupt interrupt = 5;
    WithdrawQueued withdraw = 6;
    SendQueuedNow send_now = 7;
    // Back to this agent's conversation after Claude's own view switched
    // away: types `/resume <this agent's session>`.
    SwitchBack switch_back = 8;
  }
}

message CyclePermissionMode {}

message SwitchBack {}

// ---------------------------------------------------------------------------
// Claude through the SDK
// ---------------------------------------------------------------------------

message ClaudeSdkInput {
  oneof of {
    PromptInput prompt = 1;
    ClaudeAnswer answer = 2;
    Interrupt interrupt = 3;
    SetPermission permission = 4;
    SetModel model = 5;
    Clear clear = 6;
    WithdrawQueued withdraw = 7;
    SetEffort effort = 8;
    SendQueuedNow send_now = 9;
    StopJob stop_job = 10;
  }
}

// ---------------------------------------------------------------------------
// Usage (for both Claude kinds)
// ---------------------------------------------------------------------------

// Claude's usage limits. `state` says whether the agent can work at all,
// which is not the same as any one window when Claude allows overage.
message ClaudeUsage {
  UsageState state = 1;
  repeated ClaudeUsageWindow windows = 2;
}

message ClaudeUsageWindow {
  Limit limit = 1;
  // Set for a limit that belongs to one model.
  optional string model = 2;
  // Claude's own name for the window, shown when `limit` is unspecified.
  string provider_name = 3;
  UsageMeter meter = 4;
}

// ---------------------------------------------------------------------------
// Answers (for both Claude kinds)
// ---------------------------------------------------------------------------

// Rejected REFUSAL_CLOSED_ASK if ask_key is not open.
message ClaudeAnswer {
  string ask_key = 1;
  oneof of {
    PermissionAnswer permission = 2;
    QuestionAnswer question = 3;
    PlanAnswer plan = 4;
    FormAnswer form = 5;
    LinkAnswer link = 6;
    ReplyInstead reply = 7;
  }
}

message PermissionAnswer {
  oneof of {
    PermissionAllow allow = 1;
    PermissionDeny deny = 2;
  }
}

message PermissionAllow {
  // The position of a scope in the ask's scopes; absent allows once.
  optional uint32 scope = 1;
}

message PermissionDeny {
  string note = 1;
  bool stop = 2;
}
