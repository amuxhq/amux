[package]
name = "settings"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Persisted amux installation, profile, and UI settings"
publish = false

[dependencies]
# The CLI takes `ui.chat_in`'s values as a command-line choice too.
clap = { workspace = true, optional = true }
gethostname = { workspace = true }
serde = { workspace = true }
serde_ignored = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
