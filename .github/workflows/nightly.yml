# What a push does not wait for: the shipping binary, which takes eight
# minutes on Linux and longer on macOS and Windows, and the sanitizers, which
# CI runs only when a crate whose tests they run changed. Both run here every
# night on main.
name: Nightly builds and sanitizers

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - name: Build product release
        run: just release-check

  sanitizers:
    name: Sanitizers (${{ matrix.kind }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        kind: [address, thread]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The CI job's cache: this job builds the same tests.
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
          components: rust-src
          key: sanitize-${{ matrix.kind }}
          save-if: "false"
      - name: Run the unsafe code's tests under the sanitizer
        run: just sanitize ${{ matrix.kind }}
