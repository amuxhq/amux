name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a branch stops the run of the one before it, which would
# otherwise hold the runners the newer one waits for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Which jobs this change can affect (scripts/ci-affected.py): a change to
  # documentation alone runs only the policy job, the phone app alone leaves
  # the product's jobs to the iOS gate, and the models, the sanitizers and the
  # bridge's checks run when a crate they are built from changed.
  changes:
    name: What this change affects
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      tests: ${{ steps.affected.outputs.tests }}
      product: ${{ steps.affected.outputs.product }}
      models: ${{ steps.affected.outputs.models }}
      sanitizers: ${{ steps.affected.outputs.sanitizers }}
      bridge: ${{ steps.affected.outputs.bridge }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Read what changed
        id: affected
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PULL_BASE: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        # A push is compared with the last push whose run finished, passing
        # or failing, and not with the push before it: that one's run may
        # have been stopped by this one, its changes never judged. With no
        # such run, or for a run started by hand, every job runs.
        run: |
          case "$EVENT" in
            push)
              base=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=$GITHUB_REF_NAME&event=push&status=completed&per_page=50" \
                --jq '[.workflow_runs[] | select(.conclusion == "success" or .conclusion == "failure")][0].head_sha // ""' || true)
              ;;
            pull_request) base=$PULL_BASE ;;
            *) base= ;;
          esac
          echo "compared with ${base:-nothing}"
          python3 scripts/ci-affected.py --base "$base" --head "$GITHUB_SHA" | tee -a "$GITHUB_OUTPUT"

  check-and-clippy:
    name: Check and Clippy
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: ./.github/actions/setup-just
      - name: Run Clippy
        run: just lint

  fmt:
    name: Format
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: nightly-2026-08-30
          components: rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: ./.github/actions/setup-just
      - name: Check formatting
        run: just fmt-check

  miri:
    name: Pointer checks over the C ABI
    needs: changes
    if: needs.changes.outputs.bridge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: nightly-2026-08-30
          components: miri, rust-src
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: ./.github/actions/setup-just
      - name: Run the C ABI tests under the checking interpreter
        run: just miri

  sanitizers:
    name: Sanitizers (${{ matrix.kind }})
    needs: changes
    if: needs.changes.outputs.sanitizers == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        kind: [address, thread]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: nightly-2026-08-30
          components: rust-src
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: sanitize-${{ matrix.kind }}
      - uses: ./.github/actions/setup-just
      - name: Run the unsafe code's tests under the sanitizer
        run: just sanitize ${{ matrix.kind }}

  codegen-and-policy:
    name: Codegen and dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The protocol and store checks read the latest release tag's schemas.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: ./.github/actions/setup-just
      - uses: ./.github/actions/setup-buf
      - name: Check committed protobuf code
        run: just codegen-check
      - name: Lint the protocol and check it still reads what the latest release wrote
        run: just proto-compat
      - name: Check the store only grew since the latest release
        run: just store-check
      - name: Enforce dependency boundaries
        run: just dependency-policy
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny@0.20.2,cargo-shear@1.14.0
      - name: Check dependency advisories, licences and sources
        run: just deny
      - name: Check every dependency is used
        run: just shear
      - name: Check the state-machine cores carry no runtime, lock or await
        run: just cores-check
      - name: Check provider messages go through the protocol crates
        run: just typed-provider-check
      - name: Check the test suite catalogue
        run: just tests-check
      - name: Run the scripts' own unit tests
        run: just script-tests
      - name: Check the documentation's links, figures and map
        run: just docs-check

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.part }} of 2)
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Most of this job is running the tests, on a few cores: each
        # platform runs them as two halves side by side, nextest dealing
        # every second test to each.
        part: [1, 2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Refuse fixture update flags
        shell: bash
        run: scripts/no-update-flags.sh
      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
      # Named, because the weekly offline tests restore the Linux one.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
      - uses: ./.github/actions/setup-just
      - uses: ./.github/actions/setup-nextest
      # The restored cache holds the dependencies; amux's own crates are
      # compiled on every run, because cargo judges them by file times a
      # fresh checkout renews. sccache keeps what rustc made of each by its
      # inputs, so a crate nothing beneath changed is fetched, not compiled.
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Compile through sccache
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
      # testnet's ctl test drives the terminal client in tmux; Linux runners
      # have it already.
      - name: Install tmux on macOS
        if: runner.os == 'macOS'
        run: brew install tmux
      - name: Run workspace tests
        # The ci profile reports every failing test, not only the first: a
        # platform that stops early hides the failures behind it until the
        # next run.
        # This is the fast lane and, on Linux and macOS, the system lane too:
        # the built amux binary's process, attach, overlap and supervise_cli
        # suites, node's supervisor suite and the survive-daemon system
        # journey are ordinary test suites, compiled out on Windows. The
        # protocol models run in the models job instead, on Linux only.
        run: just test -- --profile ci --exclude models --partition count:${{ matrix.part }}/2
      - name: Say what sccache fetched and compiled
        if: always()
        shell: bash
        run: sccache --show-stats
      - name: Keep the test report
        # Every test's result and time, and a failing test's output, in
        # JUnit form: target/nextest/ci/junit.xml.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-report-${{ matrix.os }}-${{ matrix.part }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

  platform-free:
    name: Simulated stories and doctests
    needs: changes
    if: needs.changes.outputs.product == 'true'
    # What reads the same on every platform runs once, on Linux, rather than
    # in each test job, as the models do.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
      - uses: ./.github/actions/setup-just
      - uses: ./.github/actions/setup-nextest
      - name: Walk the simulated stories by seed
        # The same stories under TESTNET_MODE=simulated, a few seeds each;
        # a failure prints the seed and the `just sim --seed` that reruns
        # it. It builds what the workspace test run builds.
        run: just sim
      - name: Run doctests
        run: just doctest

  models:
    name: Models (${{ matrix.model }})
    needs: changes
    if: needs.changes.outputs.models == 'true'
    # The protocol models explore every state of the real code at their CI
    # bounds, minutes of every core each; one job per model keeps
    # each model's run beside the others rather than after them, and none
    # of them on the platform test jobs.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Every protocol model, a module of the models' integration test
        # binary: `just tests-check` fails when one is missing here.
        model: [client, composed, family, lifecycle, path, presence, relay, replication, single_daemon, socket, supervisor, switch]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
      # Named, because the nightly bounds restore it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: models
      - uses: ./.github/actions/setup-just
      - uses: ./.github/actions/setup-nextest
      - name: Check the model at its CI bounds
        run: just test-crate models -- -E 'binary_id(models::integration) & test(/^${{ matrix.model }}::/)'

  build:
    name: Build (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.product == 'true'
    # The shipping binary on Linux only. On macOS and Windows it took 14 and
    # 19 minutes of every push and set how long CI takes; nightly.yml builds
    # those, and release.yml builds all three for a release.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: ./.github/actions/setup-just
      - name: Build product release
        run: just release-check

  terminal-journeys:
    name: Terminal journeys (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.product == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: ./.github/actions/setup-just
      - name: Install tmux on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Install tmux on macOS
        if: runner.os == 'macOS'
        run: brew install tmux
      - name: Run terminal journeys
        # Every terminal story in the manifest, one after another; a failure
        # does not stop the rest, and the job fails if any story did.
        run: just journey terminal all
      - name: Upload the terminal journeys' results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: terminal-journeys-${{ matrix.os }}
          path: target/journeys
          if-no-files-found: warn
          retention-days: 7

  ios:
    name: iOS target check
    needs: changes
    if: needs.changes.outputs.bridge == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: ./.github/actions/setup-just
      - name: Check iOS device and simulator graphs
        run: just mobile-check
