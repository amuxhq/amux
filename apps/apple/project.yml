name: Amux

options:
  bundleIdPrefix: sh.amux
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
  minimumXcodeGenVersion: "2.46.0"
  generateEmptyDirectories: true

# Three configurations, not two. `Measured` is how the performance suite's
# app is built: optimised the way a shipped build is, because an unoptimised
# Swift build measures the compiler rather than the app, but with the driving
# door still compiled in, because the suite drives the app through it and
# reads its marks and measurements back. Nobody installs a `Measured` build;
# `Release` is still what ships.
configs:
  Debug: debug
  Measured: release
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGNING_ALLOWED: NO
    "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": YES
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    # The Rust bridge is assembled for arm64 alone (apps/apple/Tools/ios-rust.py), the
    # phone is arm64 and every simulator this is measured on runs on Apple
    # silicon. An Intel slice would be a second configuration nobody builds
    # and nobody would notice going stale.
    ARCHS: arm64

packages:
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    exactVersion: 1.19.0
  AmuxCore:
    path: Packages/AmuxCore
  AmuxDesign:
    path: Packages/AmuxDesign
  AmuxFeatures:
    path: Packages/AmuxFeatures
  AmuxShell:
    path: Packages/AmuxShell
  AmuxTestSupport:
    path: Packages/AmuxTestSupport

targets:
  Amux:
    type: application
    platform: iOS
    sources:
      - path: Amux/Sources
      # The driving door and everything that opens a screen without a host.
      # Release compiles none of it (see EXCLUDED_SOURCE_FILE_NAMES below).
      - path: Amux/Debug
      # Fixtures, the scripted cloud and the door's wire types are compiled
      # into the debug build rather than linked as a package. Xcode
      # force-loads a Swift package's static library whether or not anything
      # references it, so depending on AmuxTestSupport here would put every
      # fixture in the shipped binary; compiling its sources lets the release
      # configuration leave them out entirely.
      - path: Packages/AmuxTestSupport/Sources/AmuxTestSupport
        excludes:
          - "Resources/**"
      # The picture a report fixture is frozen on, bundled rather than
      # compiled: a report screen is a photograph of another screen, so a
      # declared report state has to carry one. Release leaves it out with the
      # rest of the fixtures.
      - path: Packages/AmuxTestSupport/Sources/AmuxTestSupport/Resources
        buildPhase: resources
      - path: Amux/Resources
        buildPhase: resources
      # The app icon. One 1024x1024 image; the catalog compiler derives every
      # size iOS and the App Store ask for, and writes CFBundleIconName into
      # the built Info.plist. Without it the App Store rejects the upload.
      # The artwork is the one already published on the App Store, copied
      # into this repository byte for byte: nothing here designs, scales or
      # regenerates it.
      - path: Amux/Assets.xcassets
        buildPhase: resources
      # The two subscriptions, as the App Store would describe them, so a
      # purchase can be driven on the simulator without a sandbox account.
      # Named by the scheme rather than compiled in: it is a debugger setting,
      # and a build a person installs never sees it.
      - path: Amux/Amux.storekit
        buildPhase: none
    info:
      path: Amux/Info.plist
      properties:
        CFBundleDisplayName: Amux
        # Named here rather than left to the asset catalog compiler, which
        # writes it inside CFBundleIcons instead of at the top level where the
        # App Store looks: an upload without a top-level CFBundleIconName is
        # rejected with code 90713. The value is the icon set's name in
        # Amux/Assets.xcassets.
        CFBundleIconName: AppIcon
        # Both numbers come from the build settings below, so a release can
        # archive with the version it is about to cut without editing a file
        # first. docs/RELEASE.md owns how each is derived.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Answers Apple's export-compliance question in the build rather than
        # leaving every upload to sit at "Missing Compliance" until somebody
        # answers it by hand, which blocks testers from installing it at all.
        # This app carries its own TLS 1.3 — rustls and ring, through quinn —
        # beside the encryption it gets from iOS, but all of it is published
        # standard algorithms and none of it is proprietary, which is what
        # this key claims. A build that ever needed France's declaration would
        # carry ITSEncryptionExportComplianceCode beside this.
        ITSAppUsesNonExemptEncryption: false
        # The one service this app looks for, and the sentence iOS shows when
        # it asks. Without the declaration the system answers the browser with
        # nothing at all, and a phone on the same network as a machine would
        # report finding none.
        NSBonjourServices: [_amux._udp]
        NSLocalNetworkUsageDescription: amux finds hosts on your network so this phone can pair and connect to them directly.
        NSSpeechRecognitionUsageDescription: Dictate messages with speech recognition on this iPhone.
        NSMicrophoneUsageDescription: Use the microphone to dictate into your message.
        UILaunchScreen: {}
        # A "needs you" notification wakes the app in the background to bring
        # the one chat it names current before the person taps it.
        UIBackgroundModes: [remote-notification]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Pairing links printed by the CLI (`amux://pair?payload=...`) and the
        # callback the web sign-in returns to. Arriving here pairs with nobody
        # and signs nobody in; the app asks first.
        CFBundleURLTypes:
          - CFBundleURLName: sh.amux.app
            CFBundleURLSchemes: [amux]
        # The transcript is measured against the display's full cadence; the
        # 120 Hz cap iOS applies by default would hide hitches behind it.
        CADisableMinimumFrameDurationOnPhone: true
    postBuildScripts:
      - name: Stamp build revision
        basedOnDependencyAnalysis: false
        inputFiles:
          - "$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)"
        script: |
          set -eu
          revision=$(git -C "$SRCROOT/.." rev-parse --verify HEAD)
          /usr/bin/plutil -replace AmuxGitSHA -string "$revision" "$TARGET_BUILD_DIR/$INFOPLIST_PATH"
    settings:
      base:
        # Git worktree metadata can live outside SRCROOT. The revision phase
        # reads it each build and updates only the built app's Info.plist.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: sh.amux.app
        # What the App Store shows, and the number that identifies one binary
        # forever. `just ios release` writes both here; nothing else should.
        # The version matches the listing already on the App Store, so the
        # next release is the next version of it.
        MARKETING_VERSION: "1.0.32"
        CURRENT_PROJECT_VERSION: "36"
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # XcodeGen gives an iOS target iPhone and iPad by default; this app is
        # designed for the phone only.
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        # The slice of the driving bridge a Debug or Measured build
        # force-loads, by the SDK it builds for. A phone's slice exists only
        # once `apps/apple/Tools/ios-rust.py --device` has built it.
        AMUX_DRIVING_SLICE: ios-arm64-simulator
        "AMUX_DRIVING_SLICE[sdk=iphoneos*]": ios-arm64
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG AMUX_DEBUG_TOOLS
          # The debug build links the bridge built with its driving tools,
          # such as the plaintext loopback relay a test runner speaks.
          # Force-loading it first means every bridge symbol is already
          # defined by the time the shipping archive the package carries is
          # reached, so nothing is taken from that one. `just ios scope-audit`
          # checks that the release binary does not carry the build marker.
          OTHER_LDFLAGS: -Wl,-force_load,$(SRCROOT)/../../target/ios/AmuxAppDebugTools.xcframework/$(AMUX_DRIVING_SLICE)/libamux_app.a
        Measured:
          # The same tools as Debug, and for the same reason: the suite
          # drives the app through the door. What it does not carry is
          # DEBUG, so the app and the packages behind it are compiled the
          # way a shipped build is.
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: AMUX_DEBUG_TOOLS
          OTHER_LDFLAGS: -Wl,-force_load,$(SRCROOT)/../../target/ios/AmuxAppDebugTools.xcframework/$(AMUX_DRIVING_SLICE)/libamux_app.a
        Release:
          # Belt as well as the AMUX_DEBUG_TOOLS braces: the debug sources
          # are not compiled at all, so a door symbol or a fixture cannot
          # reach a shipped binary by way of a stray reference outside a
          # conditional. `just ios scope-audit` checks the built binary.
          EXCLUDED_SOURCE_FILE_NAMES: "$(SRCROOT)/Amux/Debug/* $(SRCROOT)/Packages/AmuxTestSupport/Sources/AmuxTestSupport/* $(SRCROOT)/Packages/AmuxTestSupport/Sources/AmuxTestSupport/Resources/*"
          # The bridge's static library marks thousands of Rust symbols
          # global, and the linker treats every exported symbol as live, so
          # it could neither drop their export table nor dead-strip the code
          # behind them: measured at 3.8 MB of a 14.8 MB binary. An app
          # exports nothing anyone calls. Release only, because the
          # app-hosted unit tests link against the Debug app's symbols.
          OTHER_LDFLAGS: -Wl,-no_exported_symbols
    dependencies:
      - package: AmuxCore
        product: AmuxCore
      - package: AmuxDesign
        product: AmuxDesign
      - package: AmuxFeatures
        product: AmuxFeatures
      - package: AmuxShell
        product: AmuxShell

  # Tests that need the app's own window and UIKit run hosted by the app
  # rather than by a package test runner.
  AmuxAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AmuxAppTests
    dependencies:
      - target: Amux
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: sh.amux.AmuxAppTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Amux.app/Amux"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO

  # Small SwiftUI surfaces render in-process against fixed canvases. Keep this
  # separate from the ordinary unit suite so an app test does not pay for the
  # image dependency or launch dozens of renderers. SnapshotTesting is the one
  # package product this bundle links; the app's local package products still
  # come from the host, which avoids putting a second Rust bridge in the test
  # process.
  AmuxComponentSnapshotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AmuxComponentSnapshotTests
      # The golden manifest describes every component this bundle renders;
      # the suite checks the two name the same pictures.
      - path: Goldens/manifest.json
        buildPhase: resources
    dependencies:
      - target: Amux
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: sh.amux.AmuxComponentSnapshotTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Amux.app/Amux"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO

  AmuxUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - AmuxUITests
    dependencies:
      - target: Amux
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: sh.amux.AmuxUITests
        TEST_TARGET_NAME: Amux
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO

schemes:
  Amux:
    build:
      targets:
        Amux: all
        AmuxUITests: [test]
        AmuxAppTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Amux/Amux.storekit
    test:
      config: Debug
      # The package unit suites run from their own package schemes (see
      # apps/apple/Tools/ios-unit.py); this action carries the accessibility audit's
      # UI test and the app-hosted tests.
      targets:
        - AmuxUITests
        - AmuxAppTests

  # Every suite `just ios unit` and `just ios component-snapshots` run: the
  # app-hosted tests, the component pictures and each package's tests. One
  # scheme so one build-for-testing serves them all; each recipe picks its
  # suites with `-only-testing`. Run separately, every package scheme built
  # the packages beneath it again, and the app was built once per recipe.
  # The component pictures still run in their own test process, apart from
  # the ordinary unit suites, and do not join `Amux`, whose default test
  # action remains the ordinary unit and UI suites.
  AmuxTests:
    build:
      targets:
        Amux: all
        AmuxAppTests: [test]
        AmuxComponentSnapshotTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - AmuxAppTests
        - AmuxComponentSnapshotTests
        - package: AmuxCore/AmuxCoreTests
        - package: AmuxDesign/AmuxDesignTests
        - package: AmuxFeatures/AmuxFeaturesTests
        - package: AmuxShell/AmuxShellTests
        - package: AmuxTestSupport/AmuxTestSupportTests
