[package]
name = "ui-state"
version = "0.5.0"
edition.workspace = true
license.workspace = true
description = "The pure session and fleet model both amux clients reduce their streams into"
publish = false
autotests = false

[features]
default = []
# JSON Schema derives for generating the Swift mirrors (`ios-tools`).
schema = ["dep:schemars", "wire/schema"]

[dependencies]
prost = { workspace = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true }
wire = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true
