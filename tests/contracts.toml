# Every promise the design makes that a test must hold, with the tests that
# hold it. `just contracts-check` fails when a contract names no test or a
# named test does not exist; `just contracts-check --table PATH` also writes
# this file as a Markdown table.
#
# source:
#   worked failure  a failure sequence written out step by step, because it
#                   is where designs like this one go wrong
#   invariant       one clause of the invariants table, by its owner
#   testing page    a contract the testing strategy names: a boundary's
#                   contract, a harness rule, a journey story or a contract
#                   carried over from the CI repair
#
# tests, one of:
#   <package>/<target>::<test path>   a Cargo test; <target> is the test
#                                     target, `lib` or `bin:<name>`
#   swift:<Target>/<Class>/<method>   an XCTest method
#   journey:<client>/<story>          a story in journeys/manifest.json

version = 1

# --- Worked failures ---------------------------------------------------------

[[contract]]
id = "stale-replica-open"
source = "worked failure"
section = "Replication and the client model"
claim = "Opening a chat against a replica an hour stale: the source asks after its cursor with a cap, a gap beyond the cap answers Reset with a fresh tail and CaughtUp, a gap within it answers the delta; a chat opened before the source answers paints the stale rows unmarked and swaps the new block in at CaughtUp; with the origin asleep it paints the held rows and Detached, send disabled and the draft kept."
tests = [
  "testnet/spec_replication::a_replica_takes_a_tail_live_records_a_delta_and_a_reset_with_markers_in_sequence",
  "store/conformance::a_reset_replaces_the_block_and_keeps_older_rows_for_get",
  "ui-state/spec::open::reset_swaps_at_caught_up",
  "ui-state/spec::open::a_retail_past_a_gap_builds_apart_and_swaps_at_caught_up",
  "ui-state/spec::open::a_subscribe_to_an_away_host_paints_held_rows_then_detached",
  "ui-runtime/session::an_away_host_paints_its_held_rows_then_detached_with_send_disabled",
  "swift:AmuxCoreTests/ChatModelTests/testAResetSwapsTheWholeSequenceInAtOnceAndFollowsTheNewestRow",
  "swift:AmuxCoreTests/ChatModelTests/testTheDraftIsKeptWhileCatchingUpAndSendsOnlyWhenCaughtUpAndLive",
  "tui/lib::tests::detached_keeps_the_rows_and_disables_send",
]

[[contract]]
id = "crash-between-delivery-and-outbox-delete"
source = "worked failure"
section = "Agent messaging"
claim = "The daemon dies after handing a child's result to the parent's daemon and before deleting the outbox row: on restart the drain re-sends it, the parent's daemon finds the envelope id already in the parent's items and drops it, so the parent reads the result once, on one host or across a link whose acknowledgement was lost; a row for an incarnation the parent has left is dropped, and a row for an away host waits for its presence."
tests = [
  "node/messaging::a_crash_between_hand_off_and_delete_yields_one_item",
  "node/messaging::a_resumed_parent_receives_nothing",
  "node/messaging::a_delivery_waiting_on_its_parents_lane_is_dropped_when_the_parent_resumes",
  "testnet/spec_families::an_away_parents_rows_wait_and_a_stale_incarnation_is_dropped",
  "testnet/spec_families::cross_host_family_journey",
]

[[contract]]
id = "follow-up-at-one-shot-turn-end"
source = "worked failure"
section = "Agent messaging"
claim = "A parent's follow-up lands as a one-shot child's turn ends: the provider accepts it, the pending set holds its envelope id so the child does not exit, the next turn starts (Claude from its own queue, Codex kicked by the interpreter), and the child exits after that turn; a message arriving after the exit decision is answered exiting and resumes the child with it as the prompt."
tests = [
  "agent/lifecycle::a_one_shot_child_runs_its_queued_follow_up_then_exits_and_refuses_late_input",
  "interpret/lib::shared::tests::a_one_shot_agent_is_quiet_only_with_nothing_queued_running_or_pending",
  "interpret/lib::testkind::agent_messages_stay_pending_until_consumed",
  "interpret/claude_pty::agent_messages_leave_the_pending_set_when_claude_shows_them_to_the_model",
  "interpret/codex::an_idle_inject_is_kicked_under_either_arm",
  "interpret/codex::the_parked_arm_kicks_an_empty_turn_and_consumes_at_its_acknowledgement",
  "node/messaging::a_child_answering_exiting_to_its_parents_message_is_resumed_with_it",
]

[[contract]]
id = "connection-drops-mid-catch-up"
source = "worked failure"
section = "Replication"
claim = "A link dies halfway through a catch-up delta or right after the Snapshot: the cursor has not moved, the source replays after the old cursor, absorbs what it already holds by key and stores the cursor only at CaughtUp, while a page landing a newer revision of an old row moves no cursor; a client whose own stream lags re-tails and dedupes the overlap by key."
tests = [
  "testnet/spec_replication::a_stream_dying_after_its_snapshot_replays_after_the_cursor_while_a_page_lands_newer",
  "store/conformance::a_delta_joins_above_and_only_live_records_move_the_cursor",
  "ui-runtime/session::lagged_reopens_with_a_tail_at_once_and_dedupes_the_overlap",
  "ui-state/spec::properties::catch_up_plus_live_equals_uninterrupted_delivery_at_every_cut",
]

