# Component snapshots also run on pull requests. This workflow runs them again
# nightly with every example waiting to stop changing, and the real
# interaction journeys and accessibility sweep when dispatched by hand.
name: iOS captures

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  captures:
    name: iOS captures
    runs-on: macos-26
    # The capture suites drive the app on the golden device through served
    # networks. Leave room for the uploads.
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version | grep -Fx 'Xcode 26.6'
      - name: Assert simulator runtime and device type
        run: |
          xcrun simctl list runtimes --json | jq -e '.runtimes[] | select(.identifier == "com.apple.CoreSimulator.SimRuntime.iOS-26-5" and .isAvailable == true)'
          xcrun simctl list devicetypes --json | jq -e '.devicetypes[] | select(.identifier == "com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro")'
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      # The gate's cache: this job builds the same bridge and tools, and a
      # cache of its own was evicted between the green runs that saved it.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ios-gate
          save-if: false
      - uses: ./.github/actions/setup-just
      - name: Install build tools
        run: brew install xcodegen
      # Every suite here drives the golden device; the small one is not used.
      - name: Boot the golden simulator
        run: just ios simulator golden
      - name: Compare native component snapshots
        # Every example waits to stop changing here, which is what proves the
        # ones the gate photographs at once never change after they are ready.
        run: just ios component-snapshots --settle-all
      - name: Run the capture suites
        if: github.event_name != 'schedule'
        run: just ios captures
      - name: Upload journeys, the audit and component snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-captures
          path: |
            target/journeys/phone
            target/ios/accessibility
            target/ios/component-snapshots
          if-no-files-found: warn
          retention-days: 7
