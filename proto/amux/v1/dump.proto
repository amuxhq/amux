syntax = "proto3";

package amux.v1;

// The diagnostic dump: what a client asks for and gets back, the agent
// process's part, and a person's report built around one.

// Assembles a dump bundle of this host's records into the reports
// directory: the daemon core's, each own agent's and the asking client's
// chats', with our own logs. Every dump carries the same parts.
message DumpRequest {
  string reason = 1;
  // Produced on an invariant violation or panic rather than on request.
  bool automatic = 2;
  // The records of the chats the asking client shows, each an encoded
  // amux.dump.ClientSessionHistory with `structure_only` set: the session as
  // its trace began and every message since, with nothing anybody wrote. The
  // client stage of a replay. Opaque here because only the build that wrote
  // it reads it; the daemon leaves out one that does not decode or is not a
  // record, and says so, and passes none on to another host.
  repeated bytes sessions = 3;
  // The id of the check that broke, for an automatic dump a check asked for.
  string check = 4;
}

// Where the bundle was written, for a caller on the same machine.
message DumpResponse {
  string report_path = 1;
}

// The agent process's part of a dump: its record, built when asked.
message DumpPart {
  bytes dump_id = 1;
  repeated DumpFile files = 2;
}

message DumpFile {
  string name = 1;
  bytes contents = 2;
}

// A person's report: the client's files, written beside the dump taken when
// the screen froze and sent to the profile's account service.
message SubmitReportRequest {
  // The dump's directory, as `Dump` answered it.
  string dump_path = 1;
  // `report.json` and the frozen frame's files.
  repeated DumpFile files = 2;
}

message SubmitReportResponse {
  // Where the report was written.
  string report_path = 1;
  // The account service's id for it, when it was sent.
  string id = 2;
  int64 received_at_ms = 3;
  // Why it was not sent, when it was not.
  string not_sent = 4;
}
