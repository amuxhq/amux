<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img">
  <title>Crate graph in layers: apps (tui, the Apple app) over the bridge (app-ffi, app-runtime, app-embedded) over the UI lib (ui-view, ui-state, ui-runtime, client) over shared crates (wire, attachments) beside the daemon side (node, store) and the agent side (the agent binary with its Claude and Codex hosts, interpret, claude-protocol, codex-protocol, pty-host). Nothing in the UI lib depends on node, store, interpret or a provider crate.</title>
  <style>
    svg { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .box { fill: #6e7681; fill-opacity: 0.06; stroke: #6e7681; stroke-width: 1.2; }
    .box2 { fill: #6e7681; fill-opacity: 0.14; stroke: #6e7681; stroke-width: 1.2; }
    .pin { fill: #d97706; fill-opacity: 0.12; stroke: #d97706; stroke-width: 1.2; }
    .file { fill: #3b82f6; fill-opacity: 0.10; stroke: #3b82f6; stroke-width: 1.2; }
    .ghost { fill: none; stroke: #6e7681; stroke-width: 1; stroke-dasharray: 4 4; opacity: 0.7; }
    .lane { fill: none; stroke: #6e7681; stroke-width: 1; stroke-dasharray: 3 5; opacity: 0.5; }
    .arrow { fill: none; stroke: #6e7681; stroke-width: 1.3; }
    .arrow-file { fill: none; stroke: #3b82f6; stroke-width: 1.5; }
    .arrow-dashed { fill: none; stroke: #6e7681; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .note { fill: #059669; fill-opacity: 0.10; stroke: #059669; stroke-width: 1; }
    .bar { fill: #6e7681; fill-opacity: 0.14; stroke: #6e7681; stroke-width: 1.2; }
    .bar-a { fill: #3b82f6; fill-opacity: 0.14; stroke: #3b82f6; stroke-width: 1.2; }
    text { font-size: 12px; fill: #6e7681; }
    text.t { font-size: 13px; font-weight: 600; }
    text.s { font-size: 11px; fill: #7d8590; }
    text.a { fill: #3b82f6; }
    text.p { fill: #d97706; }
    text.sans { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e7681"/></marker>
    <marker id="ahf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker>
  </defs>


<text class="t" x="20" y="34">apps</text><rect class="box" x="120" y="16" width="150" height="36" rx="4"/><text class="t" x="195" y="39" text-anchor="middle">tui</text><rect class="box" x="290" y="16" width="200" height="36" rx="4"/><text class="t" x="390" y="39" text-anchor="middle">apps/apple (Swift)</text><text class="t" x="20" y="90">bridge</text><rect class="box" x="290" y="72" width="300" height="36" rx="4"/><text class="t" x="440" y="95" text-anchor="middle">app-ffi · app-runtime · app-embedded</text><text class="t" x="20" y="146">UI lib</text><rect class="box2" x="120" y="128" width="130" height="40" rx="4"/><text class="t" x="185" y="150" text-anchor="middle">ui-view</text><text class="s" x="185" y="166" text-anchor="middle">views · rows</text><rect class="box2" x="265" y="128" width="165" height="40" rx="4"/><text class="t" x="347" y="150" text-anchor="middle">ui-state</text><text class="s" x="347" y="166" text-anchor="middle">SessionState · values</text><rect class="box2" x="445" y="128" width="130" height="40" rx="4"/><text class="t" x="510" y="150" text-anchor="middle">ui-runtime</text><text class="s" x="510" y="166" text-anchor="middle">Session driver</text><rect class="box2" x="590" y="128" width="135" height="40" rx="4"/><text class="t" x="657" y="150" text-anchor="middle">client</text><text class="s" x="657" y="166" text-anchor="middle">gRPC · in-process</text><text class="t" x="20" y="212">shared</text><rect class="box" x="120" y="194" width="240" height="40" rx="4"/><text class="t" x="240" y="216" text-anchor="middle">wire</text><text class="s" x="240" y="232" text-anchor="middle">items · inputs · snapshots · spec</text><rect class="box" x="375" y="194" width="150" height="40" rx="4"/><text class="t" x="450" y="216" text-anchor="middle">attachments</text><text class="s" x="450" y="232" text-anchor="middle">element syntax</text><text class="t" x="20" y="288">daemon</text><rect class="box2" x="120" y="270" width="245" height="40" rx="4"/><text class="t" x="242" y="292" text-anchor="middle">node</text><text class="s" x="242" y="308" text-anchor="middle">registry · ingest · fan-out · edges</text><rect class="box2" x="380" y="270" width="215" height="40" rx="4"/><text class="t" x="487" y="292" text-anchor="middle">store</text><text class="s" x="487" y="308" text-anchor="middle">schema · migrations · retention</text><text class="t" x="20" y="354">agent</text><rect class="box2" x="120" y="336" width="180" height="40" rx="4"/><text class="t" x="210" y="358" text-anchor="middle">agent (binary)</text><text class="s" x="210" y="374" text-anchor="middle">lock · journal · hosts</text><rect class="box2" x="315" y="336" width="230" height="40" rx="4"/><text class="t" x="430" y="358" text-anchor="middle">interpret</text><text class="s" x="430" y="374" text-anchor="middle">claude_pty · claude_sdk · codex</text><rect class="box" x="560" y="336" width="140" height="40" rx="4"/><text class="t" x="630" y="358" text-anchor="middle">claude-protocol</text><text class="s" x="630" y="374" text-anchor="middle">message types</text><rect class="box" x="715" y="336" width="140" height="40" rx="4"/><text class="t" x="785" y="358" text-anchor="middle">codex-protocol</text><text class="s" x="785" y="374" text-anchor="middle">message types</text><rect class="box" x="870" y="336" width="95" height="40" rx="4"/><text class="t" x="917" y="361" text-anchor="middle">pty-host</text><path class="arrow" d="M195,52 L195,126" marker-end="url(#ah)"/><path class="arrow" d="M390,52 L390,70" marker-end="url(#ah)"/><path class="arrow" d="M440,108 L440,126" marker-end="url(#ah)"/><path class="arrow" d="M185,168 L185,192" marker-end="url(#ah)"/><path class="arrow" d="M347,168 L347,192" marker-end="url(#ah)"/><path class="arrow" d="M510,168 L510,192" marker-end="url(#ah)"/><path class="arrow" d="M242,310 L242,236" marker-end="url(#ah)"/><path class="arrow" d="M487,310 L487,236" marker-end="url(#ah)"/><path class="arrow" d="M210,336 L210,312" marker-end="url(#ah)"/><path class="arrow" d="M430,336 L430,236" marker-end="url(#ah)"/><text class="s" x="745" y="150">ui-view → ui-state → wire.</text><text class="s" x="745" y="166">nothing in the UI lib depends on</text><text class="s" x="745" y="182">node, store, interpret or a provider.</text><text class="s" x="745" y="214">blobs are files; no crate owns them.</text>
</svg>
