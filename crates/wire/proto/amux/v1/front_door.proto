syntax = "proto3";

package amux.v1;

import "amux/v1/pairing.proto";
import "amux/v1/records.proto";
import "amux/v1/service.proto";

// The installation's front door: its profiles and the installation
// itself. Each profile's own account connection, pairing and peers are
// `ProfileAdminService`, on that profile's socket.

// The installation's front door: local Unix socket and in-process only.
// Calls are not retried by any client; a mutation that loses its reply is
// re-run by the person.
service ProfileService {
  rpc ListProfiles(Empty) returns (ListProfilesResponse);
  // Snapshot, CaughtUp, then ordered events; ABORTED requires a fresh watch.
  rpc WatchProfiles(Empty) returns (stream ProfileEvent);
  rpc CreateProfile(CreateProfileRequest) returns (ProfileInfo);
  // Names a profile, or lets the installation pick or create one.
  rpc BindProfile(BindProfileRequest) returns (ProfileInfo);
  rpc RenameProfile(RenameProfileRequest) returns (ProfileInfo);
  rpc DeleteProfile(DeleteProfileRequest) returns (Empty);
}

// One profile's administration, served on its client socket beside
// `ClientService` and never on an agent's tools socket or a link: its
// account connection, its pairing windows, pairings it begins, and the
// hosts it trusts. The socket names the profile. Not retried, as the front
// door.
service ProfileAdminService {
  rpc SignOut(Empty) returns (ProfileInfo);
  rpc Pause(Empty) returns (ProfileInfo);
  rpc Resume(Empty) returns (ProfileInfo);
  rpc StartPairing(StartPairingRequest) returns (PairingWindow);
  rpc GetPairingStatus(Empty) returns (PairingStatus);
  rpc CancelPairing(Empty) returns (Empty);
  rpc BeginPair(BeginPairRequest) returns (PendingPair);
  rpc ConfirmPair(PendingPairRequest) returns (PeerEntry);
  rpc AbandonPair(PendingPairRequest) returns (Empty);
  rpc GetDeviceIdentity(Empty) returns (DeviceIdentity);
  rpc TrustSshPeer(TrustSshPeerRequest) returns (Empty);
  rpc ListPeers(Empty) returns (ListPeersResponse);
  rpc GetPeer(HostRef) returns (PeerEntry);
  rpc Unpair(UnpairRequest) returns (PeerEntry);
}

service InstallationService {
  rpc GetInfo(Empty) returns (InstallationInfo);
  rpc Shutdown(Empty) returns (Empty);
}

// A profile's standing with its cloud account: what the person asked for
// and, while signed in, what its relay link is doing.
message CloudStanding {
  oneof standing {
    // Never signed in.
    Empty unbound = 1;
    // Signed out, still tied to its account.
    Empty signed_out = 2;
    // Signed in, with the relay link held down.
    Empty paused = 3;
    RelayLink signed_in = 4;
  }
}

// What a signed-in profile's relay link is doing.
message RelayLink {
  oneof state {
    Empty connecting = 1;
    RelayConnected connected = 2;
    Empty retrying = 3;
    // The account service refused the profile's credentials.
    Empty sign_in_again = 4;
    // The cloud refused this build as too old for its protocol.
    Empty version_mismatch = 5;
  }
}

message RelayConnected {
  Tier tier = 1;
  RelayCarrier carrier = 2;
}

enum Tier {
  TIER_UNSPECIFIED = 0;
  TIER_FREE = 1;
  TIER_PRO = 2;
}

enum RelayCarrier {
  RELAY_CARRIER_UNSPECIFIED = 0;
  RELAY_CARRIER_QUIC = 1;
  RELAY_CARRIER_TCP = 2;
}

message ProfileInfo {
  bytes id = 1;
  string label = 2;
  string email = 3;
  string account_name = 4;
  string socket_path = 5;
  CloudStanding cloud = 6;
  // The bound account's subject at its service, which stays after a
  // sign-out; empty when unbound. What tells two profiles' accounts apart.
  string account_subject = 7;
  // Where the bound account's profile picture is, as its service said at
  // sign-in; empty when it has none or the profile is unbound.
  string account_picture = 8;
}

message ListProfilesResponse { repeated ProfileInfo profiles = 1; }

message ProfileEvent {
  oneof of {
    ProfileInfo upserted = 1;
    bytes removed_id = 2;
    CaughtUp caught_up = 3;
  }
}

message CreateProfileRequest { optional string label = 1; }

message BindProfileRequest {
  optional bytes profile_id = 1;
  string cloud_url = 2;
  string staged_refresh_token = 3;
  bool adopt_non_pristine = 4;
  // The OAuth client the refresh token was issued to; empty is the CLI's.
  // A token refreshes only under the client that obtained it.
  string client_id = 5;
}

message RenameProfileRequest {
  bytes profile_id = 1;
  optional string override_name = 2;
}

message DeleteProfileRequest {
  bytes profile_id = 1;
}

message StartPairingRequest {
  oneof method {
    // A one-shot PIN the daemon generates.
    Empty pin = 1;
    // A one-shot secret for a QR code.
    Empty qr = 2;
    // An operator-chosen reusable PIN for unattended demos: the window is
    // neither consumed by success nor locked out by failures.
    string demo_pin = 3;
  }
  // How long the window stays open; absent is the daemon's default for
  // the method.
  optional uint64 ttl_seconds = 4;
}

message PairingWindow {
  PairingIdentity identity = 1;
  uint64 ttl_seconds = 2;
  repeated string addrs = 3;
  optional string cloud_url = 4;
  oneof secret {
    string pin = 5;
    bytes qr_secret = 6;
  }
}

message PairingStatus {
  bool active = 1;
  // Too many wrong secrets closed the last window; a new one is needed.
  bool locked_out = 2;
}

message BeginPairRequest {
  bytes host_id = 1;
  oneof secret {
    string pin = 2;
    bytes qr_secret = 3;
  }
  repeated string addrs = 4;
}

message PendingPair {
  bytes token = 1;
  PairingIdentity peer = 2;
  RouteKind via = 3;
}

message PendingPairRequest {
  bytes token = 1;
}

// SSH has already authenticated its peer outside the secret-based pairing
// protocol, so its identity commit is a separate, SSH-only operation.
message TrustSshPeerRequest {
  PairingIdentity peer = 1;
  SshTarget ssh_target = 2;
}

message UnpairRequest {
  HostRef peer = 1;
  string reason = 2;
}

message InstallationInfo { string version = 1; }

// An SSH destination; `amux relay` there joins the profile whose id is the
// peer's host id.
message SshTarget {
  string target = 1;
}

message PeerReachability {
  oneof kind {
    Empty cloud = 1;
    SshTarget ssh_target = 2;
    DirectReachability direct = 3;
  }
}

message DirectReachability {
  repeated string addrs = 1;
}

message PeerEntry {
  bytes host_id = 1;
  string name = 2;
  bytes pubkey = 3;
  int64 paired_at_ms = 4;
  repeated PeerReachability reachabilities = 5;
}

message DeviceIdentity {
  bytes host_id = 1;
  string name = 2;
  bytes pubkey = 3;
}

message ListPeersResponse {
  repeated PeerEntry peers = 1;
}
