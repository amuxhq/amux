# wt owns the tree, its environment, its daemon and the phone lease;
# `just --list` is the task list.

bin = ["target/debug"]
commands = ["amux"]

[env]
AMUX_CONFIG = "{{root()}}/.wt/amux/installation.yaml"
AMUX_LOG = "{{root()}}/.wt/amux/amux.log"

[files.".wt/amux/installation.yaml"]
marker = "#"
content = """
host_name: {{name_short()}}
root: {{root()}}/.wt/amux
front_door_socket: {{root()}}/.wt/amux/amux.sock
keep_awake: off
discovery:
  scope: {{name()}}
"""

[hooks]
after_new = "just build"
warm = "just warm"

# This checkout's daemon. A resource: `wt remove` stops it.
[resource.daemon]
tied_to = "tree"
name = "{{name_short()}}"
exists = 'test -S "{{root()}}/.wt/amux/amux.sock" && amux profiles >/dev/null 2>&1'
create = "amux server start"
destroy = "amux server stop"

# The pinned iPhones this Mac owns, created on demand. A recipe leases one
# and gets it clean; the tree keeps it for two minutes so the next recipe in
# a series takes it without queueing; one nobody has leased for half an hour
# is deleted, and the next use pays the fifty-second create again. The
# recipes name a kind, golden or small, and apps/apple/Tools/ios_simulators.py maps
# the kind to the leased device. Count, keep, idle and wait are machine
# facts: override under [resources.iphone] in ~/.wt/config.toml. The hooks go
# through scripts/python for the same reason the recipes do: a hook inherits
# whatever PATH it was started with, and on a Mac a bare python3 is often the
# 3.9 the system ships, which cannot read these scripts at all.
[resource.iphone]
tied_to = "machine"
count = 2
name = "amux-iphone-{{index()}}"
exists = 'scripts/py apps/apple/Tools/ios_simulators.py exists "$WT_SELF"'
create = 'scripts/py apps/apple/Tools/ios_simulators.py create "$WT_SELF" golden'
destroy = 'xcrun simctl delete "$WT_SELF"'
acquire = 'scripts/py apps/apple/Tools/ios_simulators.py acquire "$WT_SELF"'
keep = "2m"
idle = "30m"
wait = "45m"

[resource.iphone-small]
tied_to = "machine"
count = 1
name = "amux-small-{{index()}}"
exists = 'scripts/py apps/apple/Tools/ios_simulators.py exists "$WT_SELF"'
create = 'scripts/py apps/apple/Tools/ios_simulators.py create "$WT_SELF" small'
destroy = 'xcrun simctl delete "$WT_SELF"'
acquire = 'scripts/py apps/apple/Tools/ios_simulators.py acquire "$WT_SELF"'
keep = "2m"
idle = "30m"
wait = "45m"
