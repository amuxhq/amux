<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img">
  <title>One streamed message over time: a full item with empty text, three appends, then a full final. A live client sees all five; the store holds the merged latest; a client subscribing late receives one full item.</title>
  <style>
    svg { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .box { fill: #6e7681; fill-opacity: 0.06; stroke: #6e7681; stroke-width: 1.2; }
    .box2 { fill: #6e7681; fill-opacity: 0.14; stroke: #6e7681; stroke-width: 1.2; }
    .pin { fill: #d97706; fill-opacity: 0.12; stroke: #d97706; stroke-width: 1.2; }
    .file { fill: #3b82f6; fill-opacity: 0.10; stroke: #3b82f6; stroke-width: 1.2; }
    .ghost { fill: none; stroke: #6e7681; stroke-width: 1; stroke-dasharray: 4 4; opacity: 0.7; }
    .lane { fill: none; stroke: #6e7681; stroke-width: 1; stroke-dasharray: 3 5; opacity: 0.5; }
    .arrow { fill: none; stroke: #6e7681; stroke-width: 1.3; }
    .arrow-file { fill: none; stroke: #3b82f6; stroke-width: 1.5; }
    .arrow-dashed { fill: none; stroke: #6e7681; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .note { fill: #059669; fill-opacity: 0.10; stroke: #059669; stroke-width: 1; }
    .bar { fill: #6e7681; fill-opacity: 0.14; stroke: #6e7681; stroke-width: 1.2; }
    .bar-a { fill: #3b82f6; fill-opacity: 0.14; stroke: #3b82f6; stroke-width: 1.2; }
    text { font-size: 12px; fill: #6e7681; }
    text.t { font-size: 13px; font-weight: 600; }
    text.s { font-size: 11px; fill: #7d8590; }
    text.a { fill: #3b82f6; }
    text.p { fill: #d97706; }
    text.sans { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e7681"/></marker>
    <marker id="ahf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker>
  </defs>

      <text class="t" x="20" y="40">key msg:42</text>
      <rect class="file" x="130" y="22" width="110" height="30" rx="3"/><text class="a" x="185" y="42" text-anchor="middle">Full r=200 ""</text>
      <rect class="box2" x="260" y="22" width="110" height="30" rx="3"/><text x="315" y="42" text-anchor="middle">Append "Hel"</text>
      <rect class="box2" x="390" y="22" width="110" height="30" rx="3"/><text x="445" y="42" text-anchor="middle">Append "lo w"</text>
      <rect class="box2" x="520" y="22" width="110" height="30" rx="3"/><text x="575" y="42" text-anchor="middle">Append "orld"</text>
      <rect class="file" x="650" y="22" width="130" height="30" rx="3"/><text class="a" x="715" y="42" text-anchor="middle">Full r=204 final</text>
      <text class="s" x="185" y="70" text-anchor="middle">r=200</text><text class="s" x="315" y="70" text-anchor="middle">r=201</text><text class="s" x="445" y="70" text-anchor="middle">r=202</text><text class="s" x="575" y="70" text-anchor="middle">r=203</text><text class="s" x="715" y="70" text-anchor="middle">r=204</text>
      <text class="t" x="20" y="110">live client</text><text x="130" y="110">sees each one, text grows on screen; apply = append if held revision == base, else GetItem(key)</text>
      <text class="t" x="20" y="150">store holds</text><text x="130" y="150">one row: text "Hello world", revision 204 — text = text || ? on each append, body untouched</text>
      <text class="t" x="20" y="190">late client</text><text x="130" y="190">SubscribeSession(tail: N) → one Full item at r=204; it never sees an append it can't apply</text>
      <text class="s" x="20" y="230">journal and wire cost grow with the text; the store rewrites one row per append, never the body</text>
</svg>
