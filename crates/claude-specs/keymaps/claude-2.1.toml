verified = [{ run_id = "781e1e48-9cbd-4ab7-a884-97da4d2d9ff4", spec = "prompt", version = "2.1.312" }, { run_id = "f7384ec7-209c-4673-8ab7-035b3b732323", spec = "prompt_multiline", version = "2.1.312" }, { run_id = "cea4f7e6-d022-4765-b931-cc74d17faff6", spec = "prompt_long", version = "2.1.312" }, { run_id = "205cd43d-7f87-4a05-8d39-8071f95cf590", spec = "tools", version = "2.1.312" }, { run_id = "832a3aec-d838-4be8-bb68-7b9a6e8f8f7f", spec = "permission_allow_once", version = "2.1.312" }, { run_id = "ea29cdf2-9c0c-44fa-b6ea-911fd716b035", spec = "permission_allow_scoped", version = "2.1.312" }, { run_id = "5e0fadac-59a9-48d4-8059-f72b2b7fc408", spec = "permission_deny_feedback", version = "2.1.312" }, { run_id = "2b53ec94-f2cc-495f-ae96-34262f596641", spec = "plan_approve", version = "2.1.312" }, { run_id = "7ef7f656-8b0b-4d6a-a3a6-900e97c2b5c1", spec = "plan_request_changes", version = "2.1.312" }, { run_id = "a4a396ea-a8bc-4079-86a4-05ab91a7dc72", spec = "question_single", version = "2.1.312" }, { run_id = "f07d2fb3-2056-453b-a2f5-cec2c7b4dc76", spec = "question_multi_other", version = "2.1.312" }, { run_id = "bfe23a58-d7d3-455b-ac30-18292d8269a0", spec = "question_mixed", version = "2.1.312" }, { run_id = "2ee7ad79-045e-4d39-a176-6b2f485db00d", spec = "question_tabs", version = "2.1.312" }, { run_id = "ad0a2c7e-974e-471d-9c9e-c17deb7d4b70", spec = "question_other_single", version = "2.1.312" }, { run_id = "4ca2964f-fc2d-49c4-a08f-a67f34801adf", spec = "interrupt", version = "2.1.312" }, { run_id = "2c1c9b92-1011-4ff1-b531-e5593838b27b", spec = "mode_cycle", version = "2.1.312" }, { run_id = "ff3e5efb-249d-419c-b0f7-474456914381", spec = "clear_relink", version = "2.1.312" }, { run_id = "03fa6f60-7eea-4abb-b13c-b53609932d7e", spec = "question_every_shape", version = "2.1.312" }, { run_id = "3062b25c-b31e-47ff-b992-3423cded58b5", spec = "question_cancelled", version = "2.1.312" }, { run_id = "1e6cac89-0953-4383-af70-94e7271df566", spec = "question_skip_reply", version = "2.1.312" }, { run_id = "00903f57-1408-46b9-a2f9-d323e4d0bd35", spec = "subagent", version = "2.1.312" }, { run_id = "7cd25552-df0b-4d68-9ebc-f6a7a2393d10", spec = "background_shell", version = "2.1.312" }, { run_id = "d76fb6fb-d27b-4ec4-8848-83a0233b5969", spec = "task_list", version = "2.1.312" }, { run_id = "0f1fe2d1-62da-461a-98a1-7f298bfea4e3", spec = "file_changes_and_failure", version = "2.1.312" }, { run_id = "7ac99684-194e-4f71-9294-0fcce5b2c068", spec = "image", version = "2.1.312" }, { run_id = "5c4a51b2-6f18-4de7-975b-539096966352", spec = "thinking", version = "2.1.312" }, { run_id = "0dce2eb4-048a-417b-bfd1-6975aa280165", spec = "api_error", version = "2.1.312" }, { run_id = "12df3e58-7841-4e8f-b6ff-c2ad80f78e95", spec = "steer_queued", version = "2.1.312" }, { run_id = "5ac1a8d8-62dd-4fbe-9a24-58e3b47d7194", spec = "steer_send_now", version = "2.1.312" }, { run_id = "57540b78-11e2-42ba-b5f5-5f132d55ea24", spec = "sign_in_problem", version = "2.1.312" }, { run_id = "427853ac-ff3c-43c2-a2ae-f9781e226f16", spec = "plan_auto", version = "2.1.312" }, { run_id = "8ff22a9f-71db-4eaa-a40d-8cfae526d647", spec = "compact_relink", version = "2.1.312" }]

[intent_programs]
prompt = "prompt"
send_now = "send_now"
interrupt = "interrupt"
mode_cycle = "mode_cycle"
permission = "permission_menu"
plan = "plan_menu"
question = "question_form"

[provenance]
recorded_version = "2.1.228"
model = "haiku"
dates = ["2026-08-11", "2026-08-12"]
specs = [
    "prompt_multiline",
    "permission",
    "permission_session",
    "permission_deny_feedback",
    "question_single",
    "question_tabs",
    "question_other_single",
    "question_multi",
    "question_mixed",
    "plan_auto",
    "plan_approve",
    "plan_reject",
    "interrupt",
    "mode_cycle",
]

[keys]
escape = [27]
enter = [13]
tab = [9]
space = [32]
down = [27, 91, 66]
shift_tab = [27, 91, 90]
paste_begin = [27, 91, 50, 48, 48, 126]
paste_end = [27, 91, 50, 48, 49, 126]

[delays]
after_paste = 400
between_pastes = 100
after_toggle = 400
after_move = 300
after_tab = 800
after_editor_open = 800
before_submit = 400
after_review_open = 1000
after_deny = 1500
before_plan_approval = 800
after_menu_text_open = 800
after_other_save = 600

# No has no fixed entry: 2.1.283 in manual mode adds "Yes, and switch to
# auto mode" above it, so a deny is Escape, which Claude takes as No. That
# switch is the entry after the scope entries (auto_switch): 3 on a menu of
# one suggestion or two folded, as 2.1.283 and 2.1.296 draw it.
[menus.permission.entries]
allow_once = 1
allow_scoped = 2

[menus.plan.entries]
approve_auto = 1
approve_manual = 2
request_changes = 3

[verified_shapes.permission_menu]
permission_suggestions = [1]
# 2.1.283, live: two suggestions (a directory and a mode) show as one
# "Yes, and always allow access to <dir> from this project" entry (2)
# between Yes (1) and, in manual mode, "Yes, and switch to auto mode".
permission_folded_suggestions = [2]

# One paste of about 1,100 characters reaches the model wrapped as pasted
# content, which it will not take instructions from; one of about 750 is
# kept as typed. A longer prompt goes as several pastes of at most 700.
[programs.prompt]
stability = "stable"
steps = [
    { step = "paste", text = "prompt_text", pieces = { chars = 700, between = "between_pastes" } },
    { step = "delay", delay = "after_paste" },
    { step = "key", key = "enter" },
]

# A prompt typed while a turn runs: Claude 2.1.283 queues it and hands it to
# the model at the turn's next tool boundary (the steer_queued and
# steer_send_now recordings). What Enter means mid-turn is Claude's choice,
# not a fixed key, so the row holds only from that version and, like a menu,
# is not extrapolated past its minor.
[programs.send_now]
stability = "menu"
since = "2.1.283"
steps = [{ step = "call", program = "prompt" }]

[programs.interrupt]
stability = "stable"
steps = [{ step = "key", key = "escape" }]

[programs.mode_cycle]
stability = "stable"
steps = [{ step = "key", key = "shift_tab" }]

[programs.permission_menu]
stability = "menu"
steps = [
    { step = "digit", digit = { source = "menu_entry", menu = "permission", entry = "allow_once" } },
    { step = "digit", digit = { source = "suggestion" } },
    { step = "digit", digit = { source = "auto_switch" } },
    { step = "if", cond = "denies", then = [{ step = "key", key = "escape" }] },
    { step = "if", cond = "has_feedback", then = [
        { step = "delay", delay = "after_deny" },
        { step = "paste", text = "deny_feedback" },
        { step = "delay", delay = "after_paste" },
        { step = "key", key = "enter" },
    ] },
]

[programs.plan_menu]
stability = "menu"
steps = [
    { step = "if", cond = "has_feedback", then = [], otherwise = [
        { step = "delay", delay = "before_plan_approval" },
    ] },
    { step = "digit", digit = { source = "menu_entry", menu = "plan", entry = "approve_auto" } },
    { step = "digit", digit = { source = "menu_entry", menu = "plan", entry = "approve_manual" } },
    { step = "digit", digit = { source = "menu_entry", menu = "plan", entry = "request_changes" } },
    # The send-back entry opens a field for what to change. Enter on it
    # sends the plan back, with the note when there is one and without
    # one when the field is left empty.
    { step = "if", cond = "sends_back", then = [
        { step = "delay", delay = "after_menu_text_open" },
        { step = "if", cond = "has_feedback", then = [
            { step = "type", text = "plan_feedback" },
            { step = "delay", delay = "before_submit" },
        ] },
        { step = "key", key = "enter" },
    ] },
]

[programs.question_form]
stability = "menu"
steps = [
    { step = "for_each", over = "questions", steps = [
        { step = "if", cond = "is_first", then = [], otherwise = [
            { step = "delay", delay = "after_tab" },
        ] },
        # A skipped question is moved past with Tab. Claude's review screen
        # lists it as unanswered and still submits; only a form of more than
        # one question reaches that screen.
        { step = "if", cond = "skipped", then = [
            { step = "key", key = "tab" },
        ], otherwise = [
            { step = "if", cond = "multi_select", then = [
                { step = "for_each", over = "selected_options", steps = [
                    { step = "move_to", row = "selected_option" },
                    { step = "key", key = "space" },
                    { step = "delay", delay = "after_toggle" },
                ] },
                { step = "if", cond = "has_other", then = [
                    { step = "move_to", row = "other_row" },
                    { step = "key", key = "enter" },
                    { step = "delay", delay = "after_editor_open" },
                    { step = "type", text = "other_text" },
                    { step = "delay", delay = "before_submit" },
                    { step = "key", key = "enter" },
                    { step = "delay", delay = "after_other_save" },
                    { step = "key", key = "space" },
                    { step = "delay", delay = "after_toggle" },
                ] },
                { step = "key", key = "tab" },
            ], otherwise = [
                { step = "if", cond = "has_other", then = [
                    { step = "digit", digit = { source = "other_row" } },
                    { step = "delay", delay = "after_editor_open" },
                    { step = "type", text = "other_text" },
                    { step = "delay", delay = "before_submit" },
                    { step = "key", key = "enter" },
                ], otherwise = [
                    { step = "for_each", over = "selected_options", steps = [
                        { step = "digit", digit = { source = "selected_option" } },
                        { step = "if", cond = "has_previews", then = [
                            { step = "delay", delay = "after_move" },
                            { step = "key", key = "enter" },
                        ] },
                    ] },
                ] },
            ] },
        ] },
    ] },
    { step = "if", cond = "single_question_single_select", then = [], otherwise = [
        { step = "if", cond = "last_question_multi", then = [
            { step = "delay", delay = "after_tab" },
            { step = "key", key = "enter" },
            { step = "delay", delay = "after_review_open" },
            { step = "key", key = "enter" },
        ], otherwise = [
            { step = "delay", delay = "after_tab" },
            { step = "key", key = "enter" },
        ] },
    ] },
]
