name: Release

on:
  push:
    tags:
      - 'v*'
  # A run by hand builds, checks and splits the three binaries at the commit
  # it is started from, and keeps nothing: no attestation, no artifact, no
  # release. Only a pushed tag releases.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # The public halves of the release signing key and its offline backup,
  # comma-separated. The signing seed lives only in the release Mac's
  # release keychain and the backup's off it (docs/RELEASE.md, "The release
  # key"); the binaries built here trust manifests signed with either.
  AMUX_RELEASE_PUBLIC_KEYS: 8d172ee8b9d0eed49f0ac9ffa831a83a1554f262646826ef59fea67836d7d288,c37f64b363171e3b6335b475477e1fcf110f870d8bd1b6be87e92a15183455a0

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # Each platform's build runs to its end, so a run shows every
      # platform's failure at once; the release waits for all three anyway.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: amux-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: amux-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: amux-windows-x86_64
    # The attestation below is signed with this run's identity token and
    # stored on GitHub, beside the release but out of reach of anyone who
    # can only edit the release.
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No Rust cache: a tag's run restores caches main's CI jobs saved, so
      # whatever those jobs run could reach the binaries this job ships, and
      # a cache a tag saves is never read by another tag. Buck2 reads no
      # build cache either (scripts/release-build.py): every action runs
      # here, from scratch.
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
          cache: "false"

      # Python 3.14 unpacks the pinned Buck2 (scripts/buck-tools.py), and
      # Buck2's helpers run as python3, which Windows' installers don't
      # make.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Name Python python3 too
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dir=$(dirname "$(command -v python)")
          [ -e "$dir/python3.exe" ] || cp "$dir/python.exe" "$dir/python3.exe"
          python3 --version

      - name: Build release
        shell: bash
        run: just release-check -- --target ${{ matrix.target }}

      # The shipped binary without symbols, and its symbols beside it under
      # the asset's name, so a crash in a release can be symbolicated.
      - name: Split symbols
        shell: bash
        run: scripts/release-symbols.sh ${{ matrix.target }} ${{ matrix.artifact }}${{ runner.os == 'Windows' && '.exe' || '' }} out

      # Records the shipped binary's digest as built by this workflow at the
      # tagged commit. `just amux deploy` signs a binary only once its attestation
      # verifies, so swapping a release asset and its checksum afterwards
      # gets nothing signed.
      - name: Attest the binary
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/${{ matrix.artifact }}${{ runner.os == 'Windows' && '.exe' || '' }}

      - name: Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: out/

  release:
    name: Create Release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Collect files
        run: mv artifacts/*/* .

      - name: Generate checksums
        run: sha256sum amux-linux-x86_64 amux-macos-arm64 amux-windows-x86_64.exe > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            amux-linux-x86_64
            amux-macos-arm64
            amux-windows-x86_64.exe
            amux-linux-x86_64.debug
            amux-macos-arm64.dSYM.zip
            amux-windows-x86_64.pdb
            checksums.txt
          generate_release_notes: true
