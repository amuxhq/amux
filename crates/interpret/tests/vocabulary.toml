codex = { mark = "full", carriers = ["ask:mcp_form", "ask:mcp_link", "item:ask.form", "item:ask.link", "item:ask.closed.fields"], golden = [" ask final ", " form ", " ASK_OUTCOME_ANSWERED fields=["] }

[[row]]
id = "C18"
item = "Access grant"
claude_pty = { mark = "na" }
claude_sdk = { mark = "na" }
codex = { mark = "full", carriers = ["ask:access", "item:ask.access", "item:ask.closed.grant"], golden = [" ask final ", " access ", " ASK_OUTCOME_ANSWERED granted "] }

[[row]]
id = "C19"
item = "Automatic review"
claude_pty = { mark = "na" }
claude_sdk = { mark = "na" }
