<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1024" height="1024" viewBox="128 128 998 998" role="img" aria-labelledby="title desc">
  <title id="title">amux</title>
  <desc id="desc">A folded blue, violet and coral ribbon forms an A, with an upward arrow cut through its centre.</desc>
  <defs>
    <path id="silhouette" d="
      M 264,784 L 490,330
      C 519,273 566,242 630,242
      C 695,242 740,272 764,319
      L 1028,864
      C 1061,930 1024,1007 944,1007
      L 890,1007 C 831,1007 788,978 761,928
      L 681,760 C 667,732 667,711 676,689
      L 777,477 C 789,452 776,453 763,459
      L 482,563 C 468,568 473,581 484,582
      L 628,595 C 545,677 399,727 264,784 Z
      M 627,617
      C 613,733 539,848 490,932
      C 462,982 414,1007 362,1007
      L 311,1007 C 257,1007 223,977 216,936
      C 206,891 238,857 280,840
      C 433,780 565,728 627,617 Z"/>
    <clipPath id="mark-clip"><use xlink:href="#silhouette"/></clipPath>
    <path id="crown-shape" d="
