[package]
name = "client"
version = "0.2.0"
edition.workspace = true
license.workspace = true
description = "The one client library every amux client calls its node through: the generated stubs over the profile socket or in memory"
publish = false
autotests = false

[dependencies]
agent-dir = { workspace = true }
futures-util = { workspace = true }
hyper-util = { workspace = true }
prost = { workspace = true }
thiserror = { workspace = true }
tonic = { workspace = true }
tower = { workspace = true }
uuid = { workspace = true }
wire = { workspace = true, features = ["grpc"] }

[dev-dependencies]
patience = { workspace = true }
provider-fakes = { workspace = true }
tempfile = { workspace = true }
testnet = { workspace = true }
tokio = { workspace = true }

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true
