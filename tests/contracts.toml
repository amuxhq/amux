# Every promise the design makes that a test must hold, with the tests that
# hold it. `just contracts-check` fails when a contract names no test, a
# named test does not exist or a model property it names is not listed; `just
# contracts-check --table PATH` also writes
# this file as a Markdown table.
#
# source:
#   worked failure  a failure sequence written out step by step, because it
#                   is where designs like this one go wrong
#   invariant       one clause of the invariants table, by its owner
#   testing page    a contract the testing strategy names: a boundary's
#                   contract, a harness rule, a journey story or a contract
#                   carried over from the CI repair
#   model           a property of a protocol model in crates/models: instead
#                   of section and claim it names the property by crate,
#                   machine and sentence as the crate's `properties` binary
#                   lists it, and the checker test that explores it; its
#                   tests are the real-mode stories that demonstrate it
#
# tests, one of:
#   <package>/<target>::<test path>   a Cargo test; <target> is the test
#                                     target, `lib` or `bin:<name>`
#   swift:<Target>/<Class>/<method>   an XCTest method
#   journey:<client>/<story>          a story in journeys/manifest.json

version = 1

# --- Worked failures ---------------------------------------------------------

[[contract]]
id = "stale-replica-open"
source = "worked failure"
section = "Replication and the client model"
claim = "Opening a chat against a replica an hour stale: the source asks after its cursor with a cap, a gap beyond the cap answers Reset with a fresh tail and CaughtUp, a gap within it answers the delta; a chat opened before the source answers paints the stale rows unmarked and swaps the new block in at CaughtUp; with the origin asleep it paints the held rows and Detached, and a send is held by the client library until the chat is current."
tests = [
  "testnet/replication_stories::a_replica_takes_a_tail_live_records_a_delta_and_a_reset_with_markers_in_sequence",
  "store/conformance::a_reset_replaces_the_block_and_keeps_older_rows_for_get",
  "ui-state/spec::open::a_subscribe_to_an_away_host_paints_held_rows_then_detached",
  "ui-runtime/session::an_away_host_paints_its_held_rows_then_detached_with_send_disabled",
  "swift:AmuxCoreTests/ChatModelTests/testAResetSwapsTheWholeSequenceInAtOnceAndFollowsTheNewestRow",
  "swift:AmuxCoreTests/ChatModelTests/testADraftSentWhileCatchingUpIsHandedOnForTheLibraryToHold",
  "ui-state/spec::inputs::a_host_unreachable_rejection_holds_the_prompt_until_the_chat_catches_up",
  "tui/lib::tests::detached_keeps_the_rows_and_disables_send",
]

[[contract]]
id = "crash-between-delivery-and-outbox-delete"
source = "worked failure"
section = "Agent messaging"
claim = "The daemon dies after handing a child's result to the parent's daemon and before deleting the outbox row: on restart the drain re-sends it, the parent's daemon finds the envelope id already in the parent's items and drops it, so the parent reads the result once, on one host or across a link whose acknowledgement was lost; a row for an incarnation the parent has left is dropped, and a row for an away host waits for its presence."
tests = [
  "node/messaging::a_crash_between_hand_off_and_delete_yields_one_item",
  "node/messaging::a_resumed_parent_receives_nothing",
  "node/messaging::a_delivery_waiting_on_its_parents_lane_is_dropped_when_the_parent_resumes",
  "testnet/family_stories::an_away_parents_rows_wait_and_a_stale_incarnation_is_dropped",
  "testnet/spec_families::cross_host_family_journey",
]

[[contract]]
id = "family-follows-the-parents-row"
source = "worked failure"
section = "Agent messaging"
claim = "A parent is stopped or deleted while its far child's host is away: the stop or delete acts on the parent and is never refused for the family, the child carries on while its host cannot hear, and once its host is back and has caught up with the parent's host it stops the child (parent exited) or stops and deletes it (parent no longer listed); a child on the parent's own host follows the same rule at once; a listing that predates the child stops it when the listing shows the parent exited; a parent's host that is only away leaves the child running with its report waiting, and unpairing that host drops the report."
tests = [
  "testnet/family_stories::a_far_child_whose_parent_stopped_while_its_host_was_away_stops_on_return",
  "testnet/family_stories::a_far_child_whose_parent_was_deleted_while_its_host_was_away_is_deleted_on_return",
  "testnet/spec_families::unpairing_the_parents_host_leaves_the_child_and_drops_its_owed_report",
  "testnet/family_stories::an_away_parents_rows_wait_and_a_stale_incarnation_is_dropped",
  "testnet/family_stories::stopping_a_parent_stops_every_descendant_on_every_host",
  "node/registry::delete_aborts_first_and_its_children_here_follow",
  "node/registry::a_spawn_for_an_exited_parent_is_refused",
  "node/registry::a_child_asked_for_while_its_parent_stops_never_outlives_it",
]

