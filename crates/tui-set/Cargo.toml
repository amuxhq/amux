[package]
name = "tui-set"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Declared worlds served by real daemons on the fake providers, for working on the terminal client"
publish = false

# A set is served by `testnet serve` in its own process; this binary drives
# it through the door and runs the real terminal client on one of its hosts.
[dependencies]
agent-dir = { workspace = true }
client = { workspace = true }
settings = { workspace = true }
shot = { path = "../shot" }
tui = { workspace = true }
ui-runtime = { workspace = true }
wire = { workspace = true, features = ["grpc"] }
anyhow = { workspace = true }
clap = { workspace = true }
crossterm = { workspace = true, features = ["event-stream"] }
hyper-util = { workspace = true }
ratatui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
serde_yaml = { workspace = true }
shell-words = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
tower = { workspace = true }

[[bin]]
name = "tui-set"
path = "src/main.rs"
