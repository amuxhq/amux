[package]
name = "amux"
version = "0.8.2"
edition.workspace = true
license.workspace = true
description = "Agent multiplexer - CLI binary"
publish = false

[features]
default = []
bundled = ["store/bundled"]

[[bin]]
name = "amux"
path = "src/main.rs"

[dependencies]
log-file = { workspace = true }
agent = { workspace = true }
agent-dir = { workspace = true }
analytics = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = "0.22"
claude = { workspace = true }
client = { workspace = true }
clap = { workspace = true }
crossterm = { workspace = true }
hyper-util = { workspace = true }
node = { workspace = true }
qrcode = { workspace = true }
quinn = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_ignored = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
settings = { workspace = true }
store = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tui = { workspace = true }
uuid = { workspace = true }
vt100 = { workspace = true }
wire = { workspace = true, features = ["grpc"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
libc = { workspace = true }

[dev-dependencies]
release = { workspace = true, features = ["test-key"] }
pty-host = { workspace = true }
patience = { workspace = true }
bytes = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
jsonwebtoken = { workspace = true }
rcgen = { workspace = true }
agent = { workspace = true }
interpret = { workspace = true }
journal = { workspace = true }
prost = { workspace = true }
provider-fakes = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
version-stamp = { workspace = true }
wire = { workspace = true, features = ["grpc"] }
