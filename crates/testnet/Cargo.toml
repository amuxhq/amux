[package]
name = "testnet"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The many-daemons harness: topologies of production runtimes, faults, observations and the served door"
publish = false

[[bin]]
name = "testnet"
path = "src/bin/testnet.rs"

[dependencies]
agent-core = { workspace = true }
agent-dir = { workspace = true }
anyhow = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
daemon-core = { workspace = true }
futures-util = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
interpret = { workspace = true, features = ["testkind"] }
journal = { workspace = true, features = ["synthetic"] }
models = { workspace = true }
node = { workspace = true }
patience = { workspace = true }
prost = { workspace = true }
provider-fakes = { workspace = true }
quinn = { workspace = true }
release = { workspace = true, features = ["test-key"] }
rcgen = { workspace = true }
regex = "1"
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
shot = { path = "../shot" }
store = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tui = { workspace = true }
unicode-width = "0.2"
uuid = { workspace = true }
wire = { workspace = true, features = ["grpc"] }

[dev-dependencies]
analytics = { workspace = true }
toml = { workspace = true }
ui-state = { workspace = true }
