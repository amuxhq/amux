name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      without-build-host:
        description: "Run the Linux gate on the runner alone, as a fork's pull request does"
        type: boolean
        default: false
      cold:
        description: "Start the macOS jobs with none of the results earlier runs kept, to time them cold"
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to a pull request's branch stops the run of the one before
# it, which the newer one supersedes. On main a job that has started runs to
# the end, and a newer push takes the place of a job still waiting (each
# job's own concurrency): CI on main judges the newest commit, which holds
# every change of the ones it skipped. A run started by hand is apart from
# both.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # The build host whose NativeLink the Linux gate sends its actions to, a
  # machine on the tailnet the runner joins: the repository's BUILD_HOST
  # variable (docs/CI.md, "The Linux gate").
  BUILD_HOST: ${{ vars.BUILD_HOST }}

jobs:
  # Which of the gated jobs below this change runs (scripts/ci_jobs.py,
  # build/ci-jobs.toml; docs/CI.md, "Which jobs a change runs"). The macOS
  # and Windows jobs run only when the change touches what they alone test;
  # each judges everything changed since its last successful run on main, so
  # a commit a newer push took the place of is still judged. A run started by
  # hand runs every job, and so does a decision that failed: each gated job
  # runs unless this job said `false`. The reasons are in the run's summary.
  changes:
    name: Which jobs this change runs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      iphone: ${{ steps.decide.outputs.iphone }}
      mac_app: ${{ steps.decide.outputs.mac_app }}
      macos_tests: ${{ steps.decide.outputs.macos_tests }}
      macos_journeys: ${{ steps.decide.outputs.macos_journeys }}
      windows_tests: ${{ steps.decide.outputs.windows_tests }}
    steps:
      # The history back to each job's last pass, without the files of every
      # commit: the decision reads only the files the change touched.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/py scripts/ci_jobs.py decide

  linux:
    name: Linux gate
    # One running and one waiting per job on main: a newer push takes the
    # place of a waiting one (the workflow's concurrency says why).
    concurrency:
      group: linux-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Measured: with the build host in reach, a landed commit is the time to
    # set up Nix and premerge's cache hits. Without it (a fork's pull
    # request), the runner builds and tests everything itself, on four cores.
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      # A fork's pull request gets no secrets, so no tailnet: it runs on the
      # runner alone, slower but the same checks. So does a repository with
      # no BUILD_HOST variable set.
      REMOTE: ${{ secrets.TS_OAUTH_CLIENT_ID != '' && vars.BUILD_HOST != '' && inputs.without-build-host != true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The protocol and store checks read the latest release tag's
          # schemas, so the history must reach that tag; without the files
          # of every commit, which git fetches when a check reads one. A
          # full clone took 24 s of the gate.
          fetch-depth: 0
          filter: blob:none
      - name: Refuse fixture update flags
        run: scripts/no-update-flags.sh
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
      - name: Join the tailnet
        if: env.REMOTE == 'true'
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ env.BUILD_HOST }}
      - name: Send Buck2's actions to the build host
        if: env.REMOTE == 'true'
        run: echo "AMUX_NATIVELINK=grpc://$BUILD_HOST:50051" >> "$GITHUB_ENV"
      - name: Fetch the pinned tools
        run: nix develop --command true
      # Without the build host, a NativeLink of the runner's own takes its
      # place, so every action still runs sandboxed through a worker. Its
      # cache goes on the runner's larger second disk. Its worker offers the
      # runner's real cores, and a test that takes the whole worker asks
      # for that many (AMUX_LINUX_WORKER_CORES), so it runs alone as it
      # would on the build host.
      - name: Start a NativeLink on the runner
        if: env.REMOTE != 'true'
        run: |
          sudo mkdir -p /mnt/nativelink && sudo chown "$(id -u):$(id -g)" /mnt/nativelink
          echo "AMUX_LINUX_WORKER_CORES=$(nproc)" >> "$GITHUB_ENV"
          nohup nix develop --command scripts/py scripts/nativelink.py serve /mnt/nativelink --cores "$(nproc)" > /mnt/nativelink/log 2>&1 &
          for _ in $(seq 60); do nc -z 127.0.0.1 50051 && exit 0; sleep 1; done
          cat /mnt/nativelink/log; exit 1
      # The gate every landing passes: through Buck2, every test, the
      # repository's and the JavaScript's checks (the npm audit and deny
      # among them) and Clippy, so a commit the landing queue or a premerge
      # already tested is cache hits; and beside them the checks that stay
      # scripts.
      # Without it, the Android app's half runs beside this one, in the
      # job below: all of it on one four-core runner takes longer than a
      # test run's bound.
      - name: Run the gate (just premerge)
        run: nix develop --command just ${{ env.REMOTE == 'true' && 'premerge' || 'premerge-half workspace' }}
      - name: Say what Buck2 ran and what came from the cache
        if: always()
        # Each build's log, then each test run's, each oldest first.
        run: |
          cat > "$RUNNER_TEMP/summaries.sh" <<'EOF'
          for log in buck-out/v2/log/*_build_*.pb.zst buck-out/v2/log/*_test_*.pb.zst; do
            [ -e "$log" ] || continue
            scripts/buck2 log summary "$log" | grep -E '^Showing|^- (Local|Remote|Cached|Other) actions' || true
          done
          EOF
          nix develop --command sh "$RUNNER_TEMP/summaries.sh"

  # The Android app's half of the gate (`just premerge-half android`), on a
  # runner of its own, when the Linux gate has no build host to share the
  # work with: a fork's pull request, or a run by hand without it. With the
  # build host, the Linux gate runs all of the gate and this does nothing.
  android:
    name: Linux gate, Android app
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      REMOTE: ${{ secrets.TS_OAUTH_CLIENT_ID != '' && vars.BUILD_HOST != '' && inputs.without-build-host != true }}
    steps:
      - if: env.REMOTE != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.REMOTE != 'true'
        uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
      - name: Fetch the pinned tools
        if: env.REMOTE != 'true'
        run: nix develop --command true
      # Without the build host, a NativeLink of the runner's own takes its
      # place, so every action still runs sandboxed through a worker. Its
      # cache goes on the runner's larger second disk. Its worker offers the
      # runner's real cores, and a test that takes the whole worker asks
      # for that many (AMUX_LINUX_WORKER_CORES), so it runs alone as it
      # would on the build host.
      - name: Start a NativeLink on the runner
        if: env.REMOTE != 'true'
        run: |
          sudo mkdir -p /mnt/nativelink && sudo chown "$(id -u):$(id -g)" /mnt/nativelink
          echo "AMUX_LINUX_WORKER_CORES=$(nproc)" >> "$GITHUB_ENV"
          nohup nix develop --command scripts/py scripts/nativelink.py serve /mnt/nativelink --cores "$(nproc)" > /mnt/nativelink/log 2>&1 &
          for _ in $(seq 60); do nc -z 127.0.0.1 50051 && exit 0; sleep 1; done
          cat /mnt/nativelink/log; exit 1
      - name: Run the Android app's half of the gate
        if: env.REMOTE != 'true'
        run: nix develop --command just premerge-half android

  # The workspace's tests on Windows (docs/CI.md, "The Windows job"). The
  # build host's Linux worker compiles and links every Windows binary, which
  # the landing gate already built (`just premerge` runs `just
  # check-windows`), so that step is cache hits; then a NativeLink on this
  # runner, in front of the build host's cache, runs the tests on a Windows
  # worker of its own, so the runner compiles nothing and a test whose
  # inputs haven't changed is a cache hit. It runs only when the change
  # reaches what only Windows tests (the `changes` job). A fork's pull
  # request, with no tailnet, tests under Cargo on the runner.
  windows:
    name: Windows
    # One running and one waiting per job on main: a newer push takes the
    # place of a waiting one (the workflow's concurrency says why).
    concurrency:
      group: windows-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: false
    runs-on: windows-latest
    timeout-minutes: 60
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.windows_tests != 'false' }}
    env:
      REMOTE: ${{ secrets.TS_OAUTH_CLIENT_ID != '' && vars.BUILD_HOST != '' && inputs.without-build-host != true }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Refuse fixture update flags
        run: scripts/no-update-flags.sh
      # Python 3.14 unpacks the pinned Buck2 (scripts/buck-tools.py: the
      # runner has no zstd). Windows' Python installers make only `python`,
      # and `python3` is a stub that offers the Microsoft Store; Buck2 runs
      # one helper here by that name (it fetches the git dependencies, which
      # runs locally).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Name the runner's Python python3 too
        run: |
          dir=$(dirname "$(command -v python)")
          [ -e "$dir/python3.exe" ] || cp "$dir/python.exe" "$dir/python3.exe"
          python3 --version
      - if: env.REMOTE == 'true'
        uses: ./.github/actions/setup-just
      - name: Join the tailnet
        if: env.REMOTE == 'true'
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ env.BUILD_HOST }}
      - name: Build every Windows binary on the build host
        if: env.REMOTE == 'true'
        run: AMUX_NATIVELINK="grpc://$BUILD_HOST:50051" just check-windows
      # The tests' results from earlier runs: the build host's cache can't
      # be written from here, so they are kept in GitHub's (the NativeLink
      # config, build/nativelink/windows.json5, says why that is enough).
      - name: Restore the Windows tests' results
        if: env.REMOTE == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/test-results
          key: windows-test-results-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            windows-test-results-${{ github.sha }}-
            windows-test-results-
      # One step, so the NativeLink it starts in the background is still
      # running while the tests do.
      - name: Run the tests on a Windows worker
        if: env.REMOTE == 'true'
        run: |
          rm -f "$RUNNER_TEMP/nativelink/port"
          scripts/py scripts/nativelink.py windows "$RUNNER_TEMP/nativelink" --remote "grpc://$BUILD_HOST:50051" \
            --results "$RUNNER_TEMP/test-results" > "$RUNNER_TEMP/nativelink.log" 2>&1 &
          # It listens on a port the system picks (scripts/nativelink.py).
          port=$(scripts/py -c 'import pathlib, socket, sys, time
          port = pathlib.Path(sys.argv[1])
          for _ in range(60):
              try:
                  number = int(port.read_text())
                  socket.create_connection(("127.0.0.1", number), 1).close()
                  print(number); sys.exit(0)
              except (OSError, ValueError):
                  time.sleep(1)
          sys.exit("nativelink did not start")' "$RUNNER_TEMP/nativelink/port") || { cat "$RUNNER_TEMP/nativelink.log"; exit 1; }
          AMUX_NATIVELINK="grpc://127.0.0.1:$port" just test-windows
      - name: Say what Buck2 ran and what came from the cache
        if: always() && env.REMOTE == 'true'
        run: |
          for log in buck-out/v2/log/*_build_*.pb.zst buck-out/v2/log/*_test_*.pb.zst; do
            [ -e "$log" ] || continue
            scripts/buck2 log summary "$log" | grep -E '^Showing|^- (Local|Remote|Cached|Other) actions' || true
          done
      - name: Show NativeLink's log
        if: failure() && env.REMOTE == 'true'
        run: tail -n 300 "$RUNNER_TEMP/nativelink.log" || true
      # Buck2's event logs and NativeLink's, which has when the worker
      # fetched each test's inputs and when it ran it.
      - name: Keep Buck2's and NativeLink's logs
        if: always() && env.REMOTE == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: buck2-logs-windows
          path: |
            buck-out/v2/log/*_build_*.pb.zst
            buck-out/v2/log/*_test_*.pb.zst
            ${{ runner.temp }}/nativelink.log
          retention-days: 7
          if-no-files-found: ignore
      # NativeLink is still running and may still be writing the results;
      # the cache's archiver fails on a file that changes under it.
      - name: Stop NativeLink
        if: always() && env.REMOTE == 'true'
        run: taskkill //IM nativelink.exe //F || true
      - name: Keep the Windows tests' results
        if: always() && env.REMOTE == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/test-results
          key: windows-test-results-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      # Without the build host: what the Windows tests ran under before
      # Buck2, on the runner's own four cores. A fork's run reads the Rust
      # cache main's runs saved; a run by hand on main without the build
      # host is what saves it.
      - if: env.REMOTE != 'true'
        uses: ./.github/actions/setup-rust
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
          nextest: "true"
          sccache: "true"
      - name: Run the workspace tests under Cargo
        if: env.REMOTE != 'true'
        run: just cargo-test -- --profile ci --exclude models

  # The Apple apps and the workspace's tests on macOS, through Buck2
  # (docs/CI.md, "The macOS jobs"). Buck2 runs each build action itself
  # (AMUX_BUILD_HERE) and a NativeLink on the runner runs the tests; its
  # store, every output and result, is kept in GitHub's cache between runs,
  # so an action whose inputs haven't changed is a hit. The build host isn't
  # used: it can't run a Mac's actions, and across the ~100 ms between it
  # and GitHub's runners its CAS cost more than building did. Four jobs side
  # by side, one per Rust graph a cold run compiles: the iPhone app's bridge
  # for the simulator, the Mac app's bridge for the Mac, the workspace's
  # tests for this Mac, and the part of them the terminal journeys start.
  #
  # Each runs only when the change reaches what it alone tests (the
  # `changes` job, build/ci-jobs.toml), so they are four jobs rather than a
  # matrix, whose entries a job's `if` cannot see; they share their steps
  # through the YAML anchor `macos-steps`, and each sets what the matrix
  # did as JOB_* variables.
  #
  # Both app jobs build in `dev`, the bridge unoptimised (apps/apple/defs.bzl's
  # bridge()): its Rust then shares the development workspace's third-party
  # graph, and a cold build of it took half the time phone-dev's did (iPhone
  # app: 1,323 s of first-party compiles against 3,274; Mac app 937 s
  # against 1,177 s in all). A developer's builds keep phone-dev.
  #
  # Everything under apps/apple but the Mac app builds first; then the
  # golden simulator is made and booted, and the package suites and the
  # hosted app suite run on it. A booted simulator is some 240 processes
  # holding about 3 GB of the runner's 7 GB and a load of 150 to 350 on its
  # three cores: compiling beside it took the job to 21 minutes on a deep
  # change, and stalled every process for 20 s at a time, long enough for
  # NativeLink to give up on reading a blob and fail the build. The phone's
  # shipping build is left to `just ios release` on the Mac: its bridge is a
  # fat-LTO link of the whole Rust graph for one more target, and it reruns
  # on every Rust change.
  iphone:
    name: iPhone app
    runs-on: macos-26
    timeout-minutes: 100
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.iphone != 'false' }}
    # One running and one waiting, as every job here: the organisation has
    # five macOS runners and a run takes four, so a burst of landings had
    # queued nine macOS jobs, each behind the last. A running job finishes
    # and keeps its store.
    concurrency:
      group: macos-iphone-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    env:
      AMUX_BUILD_HERE: "1"
      JOB_KEY: iphone
      JOB_NAME: iPhone app
      # The most the job's CAS holds, so the four jobs' stores and the other
      # jobs' caches fit in GitHub's 10 GB for the repository; compressed, a
      # store is about a fifth of this.
      JOB_CAS_GIB: "6"
      JOB_BUILD: >-
        scripts/buck2 build --target-platforms root//build/platforms:ios-sim-app-shipping-dev
        $(scripts/buck2 uquery "attrregexfilter(default_target_platform, ios-sim, //apps/apple/...)")
      JOB_RUN: >-
        scripts/buck2 test --build-default-info --target-platforms root//build/platforms:ios-sim-app-shipping-dev
        $(scripts/buck2 uquery "attrregexfilter(default_target_platform, ios-sim, //apps/apple/...)")
        --exclude mac
    steps: &macos-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Refuse fixture update flags
        run: scripts/no-update-flags.sh
      # What the runner does every ten seconds, kept with Buck2's logs.
      - name: Sample the runner's load and memory
        run: nohup scripts/ci-sample-system.sh > "$RUNNER_TEMP/system.log" 2>&1 &
      # Spotlight indexed every output Buck2 wrote and every blob NativeLink
      # stored, on the runner's three cores.
      - name: Turn Spotlight off
        run: sudo mdutil -a -i off
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version | grep -Fx 'Xcode 26.6'
      - name: Assert simulator runtime and device type
        if: env.JOB_KEY == 'iphone'
        run: |
          xcrun simctl list runtimes --json | jq -e '.runtimes[] | select(.identifier == "com.apple.CoreSimulator.SimRuntime.iOS-26-5" and .isAvailable == true)'
          xcrun simctl list devicetypes --json | jq -e '.devicetypes[] | select(.identifier == "com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro")'
      # Python 3.14 unpacks the pinned Buck2 and NativeLink
      # (scripts/buck-tools.py).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      # The pinned toolchain Buck2's Rust rules call by path, with the
      # phone's targets; Buck2 keeps its own outputs, so no Cargo cache.
      - uses: ./.github/actions/setup-rust
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
          cache: "false"
      # The harness drives terminal sessions in tmux.
      - name: Install tmux
        run: brew install tmux
      # The newest store any run of this job kept. A run started with
      # `cold` starts from nothing, to time a cold build.
      - name: Restore the store of earlier runs
        if: inputs.cold != true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/nativelink/cas
            ${{ runner.temp }}/nativelink/cas.exec
            ${{ runner.temp }}/nativelink/ac
            ${{ runner.temp }}/nativelink/ac.exec
          key: macos-${{ env.JOB_KEY }}-store-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            macos-${{ env.JOB_KEY }}-store-${{ github.sha }}-
            macos-${{ env.JOB_KEY }}-store-
            ${{ env.JOB_FALLBACK || format('macos-{0}-store-', env.JOB_KEY) }}
      - name: Start a NativeLink on the runner
        run: |
          nohup scripts/py scripts/nativelink.py macos "$RUNNER_TEMP/nativelink" --cas-gib "${{ env.JOB_CAS_GIB }}" \
            > "$RUNNER_TEMP/nativelink.log" 2>&1 &
          for _ in $(seq 60); do nc -z 127.0.0.1 50051 && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/nativelink.log"; exit 1
      - name: Build ${{ env.JOB_NAME }}
        if: env.JOB_BUILD
        timeout-minutes: 60
        env:
          AMUX_NATIVELINK: grpc://127.0.0.1:50051
        run: scripts/rerun-on-cache-timeout.sh '${{ env.JOB_BUILD }}'
      # Made once everything is built (the iPhone job says why), with Buck2 and
      # NativeLink stopped so the booting device has their memory too; then
      # NativeLink starts again so its worker hands every test the device's
      # udid (AMUX_SIMULATOR_UDID, scripts/nativelink.py): a test that
      # looked the device up itself asked CoreSimulator while the runner
      # compiled on every core, and `simctl list` took over three minutes.
      - name: Make the golden simulator
        if: env.JOB_KEY == 'iphone'
        run: |
          scripts/buck2 kill
          pkill -f "$RUNNER_TEMP/nativelink/config.json5" || true
          for _ in $(seq 30); do pgrep -f "$RUNNER_TEMP/nativelink/config.json5" > /dev/null || break; sleep 1; done
          just ios simulator golden
          udid=$(scripts/py apps/apple/Tools/ios_simulators.py udid golden)
          echo "AMUX_SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
      - name: Start NativeLink again with the simulator
        if: env.JOB_KEY == 'iphone'
        run: |
          nohup scripts/py scripts/nativelink.py macos "$RUNNER_TEMP/nativelink" --cas-gib "${{ env.JOB_CAS_GIB }}" \
            >> "$RUNNER_TEMP/nativelink.log" 2>&1 &
          for _ in $(seq 60); do nc -z 127.0.0.1 50051 && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/nativelink.log"; exit 1
      # Bounded below the job's timeout, so a run that runs out of time
      # still keeps what it finished: a job stopped by its own timeout or
      # cancelled doesn't get to save the results, and every run after it
      # started cold again.
      - name: Run ${{ env.JOB_NAME }}
        timeout-minutes: 75
        env:
          AMUX_NATIVELINK: grpc://127.0.0.1:50051
        run: scripts/rerun-on-cache-timeout.sh '${{ env.JOB_RUN }}'
      - name: Say what Buck2 ran and what came from the cache
        if: always()
        run: |
          for log in buck-out/v2/log/*_build_*.pb.zst buck-out/v2/log/*_test_*.pb.zst; do
            [ -e "$log" ] || continue
            scripts/buck2 log summary "$log" | grep -E '^Showing|^- (Local|Remote|Cached|Other) actions' || true
          done
      - name: Show NativeLink's log
        if: failure()
        run: tail -n 300 "$RUNNER_TEMP/nativelink.log" || true
      # Buck2's event logs, for `scripts/buck2 log what-ran`, `log
      # critical-path` and `log show`: what each action waited for, staged
      # and ran, which is how a slow run is explained.
      - name: Keep Buck2's event logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: buck2-logs-${{ env.JOB_KEY }}
          path: |
            buck-out/v2/log/*_build_*.pb.zst
            buck-out/v2/log/*_test_*.pb.zst
            ${{ runner.temp }}/nativelink.log
            ${{ runner.temp }}/system.log
          retention-days: 7
          if-no-files-found: ignore
      # NativeLink is still running, and stopped mid-action (a cancelled
      # run) it is still writing the results: the cache's archiver failed
      # on a file that changed under it, so a cancelled run kept nothing.
      - name: Stop NativeLink
        if: always()
        run: |
          pkill -f "$RUNNER_TEMP/nativelink/config.json5" || true
          for _ in $(seq 30); do pgrep -f "$RUNNER_TEMP/nativelink/config.json5" > /dev/null || break; sleep 1; done
          du -sh "$RUNNER_TEMP"/nativelink/cas* "$RUNNER_TEMP"/nativelink/ac* || true
      - name: Keep the store
        id: save
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/nativelink/cas
            ${{ runner.temp }}/nativelink/cas.exec
            ${{ runner.temp }}/nativelink/ac
            ${{ runner.temp }}/nativelink/ac.exec
          key: macos-${{ env.JOB_KEY }}-store-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      # Only the newest store of each job is worth keeping, and GitHub's
      # cache evicts the least recently used past 10 GB for the whole
      # repository: an older store, read by the run that restored it, can
      # outlive another job's newer cache.
      - name: Drop this job's older stores
        if: always() && steps.save.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          scripts/py scripts/ci_cache.py prune macos-${{ env.JOB_KEY }}-store-
          --except macos-${{ env.JOB_KEY }}-store-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      # The runner ends what a job leaves running one process at a time,
      # waiting for each to go. In the iPhone job Buck2's daemon took 14 s
      # to two minutes to go on that signal, against a second or two in the
      # others. By now the logs and the store are kept, so nothing depends
      # on how the daemon exits: it gets a short `buck2 kill` and then a
      # hard kill. The sampler and the `sleep` it is in go too, children
      # first, with the sampler held still so it starts no other: started
      # in the background, they ignore the runner's first signal, and a
      # `sleep` left behind cost 21 s.
      - name: Stop Buck2 and the sampler
        if: always()
        run: |
          for sampler in $(pgrep -f scripts/ci-sample-system.sh); do
            kill -STOP "$sampler" || continue
            pkill -KILL -P "$sampler" || true
            kill -KILL "$sampler" || true
          done
          scripts/bounded 15 "$(scripts/py scripts/buck-tools.py path buck2)" kill || true
          pkill -9 -x buck2 || true

  # The Mac app, its storybook and screens built, and its tests run on the
  # runner, the same way.
  mac-app:
    name: Mac app
    runs-on: macos-26
    timeout-minutes: 100
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.mac_app != 'false' }}
    # One running and one waiting, as every job here: the organisation has
    # five macOS runners and a run takes four, so a burst of landings had
    # queued nine macOS jobs, each behind the last. A running job finishes
    # and keeps its store.
    concurrency:
      group: macos-mac-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    env:
      AMUX_BUILD_HERE: "1"
      JOB_KEY: mac
      JOB_NAME: Mac app
      JOB_CAS_GIB: "6"
      JOB_RUN: >-
        scripts/buck2 test --build-default-info --target-platforms root//build/platforms:macos-app-shipping-dev
        $(scripts/buck2 uquery "attrregexfilter(default_target_platform, macos, //apps/apple/...)")
    steps: *macos-steps

  # Every workspace test that isn't Linux-only but the terminal journeys:
  # the macOS half of what the Linux gate runs. Its CAS holds every test
  # binary of the workspace: a cold run's outputs are 9.5 GB on disk, 1.9 GB
  # compressed. Every test binary is built before any test runs: run beside
  # the compiles of a deep change, on three cores, the system suites crawled
  # (the built `amux` binary's suite took 9 minutes, a dozen of its tests
  # over a minute and one past its three) and testnet's failed on timing.
  macos-tests:
    name: macOS tests
    runs-on: macos-26
    timeout-minutes: 100
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.macos_tests != 'false' }}
    # One running and one waiting, as every job here: the organisation has
    # five macOS runners and a run takes four, so a burst of landings had
    # queued nine macOS jobs, each behind the last. A running job finishes
    # and keeps its store.
    concurrency:
      group: macos-tests-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    env:
      AMUX_BUILD_HERE: "1"
      JOB_KEY: tests
      JOB_NAME: macOS tests
      JOB_CAS_GIB: "12"
      JOB_BUILD: >-
        scripts/py build/checks/inputs.py && scripts/buck2 build $(scripts/buck2 uquery "kind(_amux_test, //crates/...)
        - attrfilter(labels, journey, //crates/...) - attrfilter(labels, live, //crates/...)
        - attrfilter(labels, nightly, //crates/...) - attrfilter(labels, linux-only, //crates/...)")
      JOB_RUN: >-
        just test //crates/... --exclude journey
    steps: *macos-steps

  # The terminal journeys, which take the whole worker and miss their waits
  # beside compiles, so in the tests job they ran last, after everything
  # else had built: 642 s of a cold run's 28 minutes. Before Buck2 they were
  # a job of their own too.
  macos-journeys:
    name: macOS journeys
    runs-on: macos-26
    timeout-minutes: 100
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.macos_journeys != 'false' }}
    # One running and one waiting, as every job here: the organisation has
    # five macOS runners and a run takes four, so a burst of landings had
    # queued nine macOS jobs, each behind the last. A running job finishes
    # and keeps its store.
    concurrency:
      group: macos-journeys-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    env:
      AMUX_BUILD_HERE: "1"
      JOB_KEY: journeys
      JOB_NAME: macOS journeys
      JOB_CAS_GIB: "8"
      # With no store of its own yet, the tests job's, which holds
      # everything the journeys build.
      JOB_FALLBACK: macos-tests-store-
      JOB_RUN: >-
        just test //crates/testnet:terminal-journeys
    steps: *macos-steps
