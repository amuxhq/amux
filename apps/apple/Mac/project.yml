# The Mac app's project. Separate from the iPhone app's (../project.yml) so
# neither app's recipes generate, build or check the other's targets; both
# link the same Swift packages and the same Rust bridge.
name: AmuxMac

options:
  bundleIdPrefix: sh.amux
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"
  minimumXcodeGenVersion: "2.46.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # The bridge's Mac slice is built for Apple silicon alone
    # (apps/apple/Tools/ios-rust.py --mac).
    ARCHS: arm64

packages:
  AmuxCore:
    path: ../Packages/AmuxCore

schemes:
  AmuxMac:
    build:
      targets:
        AmuxMac: all
        AmuxMacTests: [test]
    test:
      targets:
        - AmuxMacTests

targets:
  AmuxMac:
    type: application
    platform: macOS
    sources:
      - path: Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Amux
        CFBundleName: Amux
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_NAME: Amux
        PRODUCT_BUNDLE_IDENTIFIER: sh.amux.desktop
        # Written by `just mac release`; the build number is the version,
        # since no store keeps a ledger of builds.
        MARKETING_VERSION: "0.0.1"
        CURRENT_PROJECT_VERSION: "0.0.1"
        # Distributed outside the App Store and signed with Developer ID, so
        # the hardened runtime is on and the sandbox is off: the app talks to
        # amux's sockets under ~/.amux and installs amux into ~/.amux/bin.
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        # Development builds sign ad hoc; a distribution build is signed with
        # the Developer ID certificate, chosen by its type, at release.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    dependencies:
      - package: AmuxCore
        product: AmuxCore
      - package: AmuxCore
        product: AmuxValues

  # The app's screens and model, compiled without its entry point into a test
  # bundle that runs in the test runner rather than in the app: the screens
  # are drawn into windows that are never put on screen, so a run shows
  # nothing on the desktop and needs nobody's input (docs/MAC.md).
  AmuxMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - AmuxMacApp.swift
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.amux.desktop.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
    dependencies:
      - package: AmuxCore
        product: AmuxCore
      - package: AmuxCore
        product: AmuxValues
