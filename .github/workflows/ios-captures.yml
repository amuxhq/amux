# The real interaction journeys and the accessibility sweep, dispatched by
# hand.
name: iOS captures

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  captures:
    name: iOS captures
    runs-on: macos-26
    # The capture suites drive the app on the golden device through served
    # networks. Leave room for the uploads.
    timeout-minutes: 270
    env:
      # Build actions in Buck2 itself, tests on the runner's worker, as in
      # CI's macOS jobs (docs/CI.md, "The macOS jobs").
      AMUX_BUILD_HERE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version | grep -Fx 'Xcode 26.6'
      - name: Assert simulator runtime and device type
        run: |
          xcrun simctl list runtimes --json | jq -e '.runtimes[] | select(.identifier == "com.apple.CoreSimulator.SimRuntime.iOS-26-5" and .isAvailable == true)'
          xcrun simctl list devicetypes --json | jq -e '.devicetypes[] | select(.identifier == "com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro")'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      # The journeys' tools still build with Cargo (`just ios tools`).
      - uses: ./.github/actions/setup-rust
        with:
          targets: aarch64-apple-ios-sim
          shared-key: ios-captures
      - name: Install tmux
        run: brew install tmux
      # The iPhone app job's store, read-only, so the app and the UI tests
      # it already built are hits.
      - name: Restore the iPhone app job's store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/nativelink/cas
            ${{ runner.temp }}/nativelink/cas.exec
            ${{ runner.temp }}/nativelink/ac
            ${{ runner.temp }}/nativelink/ac.exec
          key: macos-iphone-store-${{ github.sha }}-
          restore-keys: macos-iphone-store-
      - name: Start a NativeLink on the runner
        run: |
          nohup scripts/py scripts/nativelink.py macos "$RUNNER_TEMP/nativelink" > "$RUNNER_TEMP/nativelink.log" 2>&1 &
          for _ in $(seq 60); do nc -z 127.0.0.1 50051 && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/nativelink.log"; exit 1
      # Every suite here drives the golden device; the small one is not used.
      - name: Boot the golden simulator
        run: just ios simulator golden
      - name: Run the capture suites
        env:
          AMUX_NATIVELINK: grpc://127.0.0.1:50051
        run: just ios captures
      - name: Upload journeys and the audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-captures
          path: |
            target/journeys/phone
            target/ios/accessibility
          if-no-files-found: warn
          retention-days: 7
