buildscript.run = true

# tree-sitter's build-dependency asks for preserve_order, which Cargo keeps
# to the build script (its host dependencies resolve apart from the
# product's); reindeer would turn it on for every crate. Nothing of ours
# asks for it, and the build script never uses serde_json.
omit_features = ["indexmap", "preserve_order"]
