  "node/agent_names::a_given_name_is_kept_and_a_missing_one_is_a_word_pair",
  "node/agent_names::an_assigned_name_avoids_other_agents_and_the_repositorys_branches",
  "interpret/lib::shared::tests::since_when_moves_only_when_the_phase_changes",
  "ui-view/views::the_fleet_places_families_by_their_loudest_member_newest_first",
  "tui/lib::tests::home_keeps_its_order_while_agents_stream_and_moves_one_whose_turn_ended",
]

[[contract]]
id = "free-tier-relay-host-is-away"
source = "invariant"
section = "Fleet"
claim = "A trusted host the relay alone reaches while the account is on the free tier is away, not online, since the relay lists it and carries nothing to it; a direct route to it, or the account going Pro, makes it online again; a client draws away from the daemon's word."
tests = [
  "testnet/spec_network::free_tier_relay_only_host_is_away",
]

[[contract]]
id = "compacting-reads-until-the-compaction-lands"
