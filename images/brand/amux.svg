    <linearGradient id="blue-foot" gradientUnits="userSpaceOnUse" x1="375" y1="787" x2="458" y2="1007">
      <stop stop-color="#123dc5"/>
      <stop offset=".53" stop-color="#136cf7"/>
      <stop offset="1" stop-color="#2c87ff"/>
    </linearGradient>
  </defs>
  <g id="artwork" clip-path="url(#mark-clip)">
    <use id="body" xlink:href="#silhouette" fill="url(#blue-ribbon)"/>
    <use id="rear-light" xlink:href="#silhouette" fill="url(#rear-glow)"/>
    <use id="crown" xlink:href="#crown-shape" fill="url(#crown-spectrum)"/>
    <use id="crown-highlight" xlink:href="#crown-shape" fill="url(#crown-light)"/>
    <path id="front-fold" fill="url(#warm-fold)" d="
      M 711.75,614 C 707,663 747,700 805,727
      C 884,766 1006,801 1045,899
      L 1060,1030 L 745,1030 L 650,760 Z"/>
    <path id="left-foot" fill="url(#blue-foot)" d="
      M 627,617 C 613,733 539,848 490,932
      C 462,982 414,1007 362,1007 L 311,1007
      C 257,1007 223,977 216,936 C 206,891 238,857 280,840
      C 433,780 565,728 627,617 Z"/>
  </g>
