[package]
name = "claude-specs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
autotests = false

[dependencies]
claude = { path = "../claude", features = ["pty"] }
claude-protocol.workspace = true
bytes = { workspace = true }
chrono = { workspace = true }
futures-core = "0.3"
replay-support = { path = "../replay-support" }
pty-host = { workspace = true }
redaction = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
uuid = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[[bin]]
name = "claude-probe"
path = "src/bin/claude_probe/main.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"
