# The keys, delays and programs the terminal Claude recording harness types
# Claude's input with, as the recorded Claude version draws its menus.

[intent_programs]
prompt = "prompt"
send_now = "send_now"
interrupt = "interrupt"
mode_cycle = "mode_cycle"
permission = "permission_menu"
plan = "plan_menu"
question = "question_form"

[keys]
escape = [27]
enter = [13]
tab = [9]
space = [32]
down = [27, 91, 66]
shift_tab = [27, 91, 90]
paste_begin = [27, 91, 50, 48, 48, 126]
paste_end = [27, 91, 50, 48, 49, 126]

[delays]
after_paste = 400
between_pastes = 100
after_toggle = 400
after_move = 300
after_tab = 800
after_editor_open = 800
before_submit = 400
after_review_open = 1000
after_deny = 1500
before_plan_approval = 800
after_menu_text_open = 800
after_other_save = 600

# No has no fixed entry: 2.1.283 in manual mode adds "Yes, and switch to
# auto mode" above it, so a deny is Escape, which Claude takes as No. That
# switch is the entry after the scope entries (auto_switch): 3 on a menu of
# one suggestion or two folded, as 2.1.283 and 2.1.296 draw it.
[menus.permission.entries]
allow_once = 1
allow_scoped = 2

[menus.plan.entries]
approve_auto = 1
approve_manual = 2
request_changes = 3

[verified_shapes.permission_menu]
permission_suggestions = [1]
# 2.1.283, live: two suggestions (a directory and a mode) show as one
# "Yes, and always allow access to <dir> from this project" entry (2)
# between Yes (1) and, in manual mode, "Yes, and switch to auto mode".
permission_folded_suggestions = [2]

# One paste of about 1,100 characters reaches the model wrapped as pasted
# content, which it will not take instructions from; one of about 750 is
# kept as typed. A longer prompt goes as several pastes of at most 700.
[programs.prompt]
steps = [
    { step = "paste", text = "prompt_text", pieces = { chars = 700, between = "between_pastes" } },
    { step = "delay", delay = "after_paste" },
    { step = "key", key = "enter" },
]

# A prompt typed while a turn runs: Claude 2.1.283 queues it and hands it to
# the model at the turn's next tool boundary (the steer_queued and
# steer_send_now recordings). What Enter means mid-turn is Claude's choice,
# not a fixed key, so it has its own row.
[programs.send_now]
steps = [{ step = "call", program = "prompt" }]

[programs.interrupt]
steps = [{ step = "key", key = "escape" }]

[programs.mode_cycle]
steps = [{ step = "key", key = "shift_tab" }]

[programs.permission_menu]
steps = [
    { step = "digit", digit = { source = "menu_entry", menu = "permission", entry = "allow_once" } },
    { step = "digit", digit = { source = "suggestion" } },
    { step = "digit", digit = { source = "auto_switch" } },
    { step = "if", cond = "denies", then = [{ step = "key", key = "escape" }] },
    { step = "if", cond = "has_feedback", then = [
        { step = "delay", delay = "after_deny" },
        { step = "paste", text = "deny_feedback" },
        { step = "delay", delay = "after_paste" },
        { step = "key", key = "enter" },
    ] },
]

[programs.plan_menu]
steps = [
    { step = "if", cond = "has_feedback", then = [], otherwise = [
        { step = "delay", delay = "before_plan_approval" },
    ] },
    { step = "digit", digit = { source = "menu_entry", menu = "plan", entry = "approve_auto" } },
    { step = "digit", digit = { source = "menu_entry", menu = "plan", entry = "approve_manual" } },
    { step = "digit", digit = { source = "menu_entry", menu = "plan", entry = "request_changes" } },
    # The send-back entry opens a field for what to change. Enter on it
    # sends the plan back, with the note when there is one and without
    # one when the field is left empty.
    { step = "if", cond = "sends_back", then = [
        { step = "delay", delay = "after_menu_text_open" },
        { step = "if", cond = "has_feedback", then = [
            { step = "type", text = "plan_feedback" },
            { step = "delay", delay = "before_submit" },
        ] },
        { step = "key", key = "enter" },
    ] },
]

[programs.question_form]
steps = [
    { step = "for_each", over = "questions", steps = [
        { step = "if", cond = "is_first", then = [], otherwise = [
            { step = "delay", delay = "after_tab" },
        ] },
        # A skipped question is moved past with Tab. Claude's review screen
        # lists it as unanswered and still submits; only a form of more than
        # one question reaches that screen.
        { step = "if", cond = "skipped", then = [
            { step = "key", key = "tab" },
        ], otherwise = [
            { step = "if", cond = "multi_select", then = [
                { step = "for_each", over = "selected_options", steps = [
                    { step = "move_to", row = "selected_option" },
                    { step = "key", key = "space" },
                    { step = "delay", delay = "after_toggle" },
                ] },
                { step = "if", cond = "has_other", then = [
                    { step = "move_to", row = "other_row" },
                    { step = "key", key = "enter" },
                    { step = "delay", delay = "after_editor_open" },
                    { step = "type", text = "other_text" },
                    { step = "delay", delay = "before_submit" },
                    { step = "key", key = "enter" },
                    { step = "delay", delay = "after_other_save" },
                    { step = "key", key = "space" },
                    { step = "delay", delay = "after_toggle" },
                ] },
                { step = "key", key = "tab" },
            ], otherwise = [
                { step = "if", cond = "has_other", then = [
                    { step = "digit", digit = { source = "other_row" } },
                    { step = "delay", delay = "after_editor_open" },
                    { step = "type", text = "other_text" },
                    { step = "delay", delay = "before_submit" },
                    { step = "key", key = "enter" },
                ], otherwise = [
                    { step = "for_each", over = "selected_options", steps = [
                        { step = "digit", digit = { source = "selected_option" } },
                        { step = "if", cond = "has_previews", then = [
                            { step = "delay", delay = "after_move" },
                            { step = "key", key = "enter" },
                        ] },
                    ] },
                ] },
            ] },
        ] },
    ] },
    { step = "if", cond = "single_question_single_select", then = [], otherwise = [
        { step = "if", cond = "last_question_multi", then = [
            { step = "delay", delay = "after_tab" },
            { step = "key", key = "enter" },
            { step = "delay", delay = "after_review_open" },
            { step = "key", key = "enter" },
        ], otherwise = [
            { step = "delay", delay = "after_tab" },
            { step = "key", key = "enter" },
        ] },
    ] },
]
