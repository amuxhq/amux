syntax = "proto3";

package amux.v1;

import "amux/v1/records.proto";
import "amux/v1/session.proto";

// The conversations the node a client is attached to holds: its own
// agents' and its copies of other hosts' agents', and the files they
// reference. A copy may be stale, and its stream says so.
//
// A local service, answered by the node the connection ends at from its
// store, for local agents and copies alike, so a client never needs to
// know where an agent lives to read it. Served on the profile socket and
// the phone's entry in memory; on an agent's tools socket, only for the
// agent's own children. Never on a link: a paired daemon keeps its copy
// through PeerService instead.
//
// Two reads make the node ask the owner while the caller waits: a page
// older than its copy holds, and a file it has not fetched yet. Both are
// the copy filling itself. The node asks the owner's PeerService as
// itself, checks what arrives, keeps it, and answers from its copy; the
// caller's call is not passed on.

service SessionService {
  // One conversation from this node's copy: the first event names the
  // generation its rows belong to, then a tail, CaughtUp, and what follows.
  rpc SubscribeSession(SubscribeSessionRequest) returns (stream SubscribeSessionResponse);
  // Older items, a page at a time.
  rpc ListItems(ListItemsRequest) returns (ListItemsResponse);
  rpc GetItem(GetItemRequest) returns (GetItemResponse);
  // A file a conversation references. One this node does not hold yet it
  // fetches from the agent's host, checks against its hash and keeps.
  rpc GetBlob(GetBlobRequest) returns (GetBlobResponse);
}

// A client tails. There is no cursor: resuming from one is how a paired
// daemon's copy follows its source, on PeerService.FollowSession.
message SubscribeSessionRequest {
  bytes agent_id = 1;
  // How many of the newest rows to start from.
  uint32 tail = 2;
}

message SubscribeSessionResponse {
  SessionEvent event = 1;
}

message ListItemsRequest {
  bytes agent_id = 1;
  // Items before this order; absent, the newest.
  optional uint64 before_order = 2;
  uint32 page_size = 3;
}

// By order, newest first; exhausted means no older history exists.
message ListItemsResponse {
  repeated Item items = 1;
  bool exhausted = 2;
}

message GetItemRequest {
  bytes agent_id = 1;
  string key = 2;
}

message GetItemResponse {
  Item item = 1;
}

message GetBlobRequest {
  bytes agent_id = 1;
  // The SHA-256 a BlobRef names.
  bytes hash = 2;
}

// The file's bytes alone; the caller named the hash.
message GetBlobResponse {
  bytes bytes = 1;
}
