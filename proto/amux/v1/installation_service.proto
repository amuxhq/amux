syntax = "proto3";

package amux.v1;

import "amux/v1/records.proto";

// The installation's front door: the installation itself and its profiles.
// Each profile's own account connection, pairing and peers are
// ProfileAdminService, on that profile's socket.

// Local Unix socket and in-process only. Calls are not retried by any
// client; a mutation that loses its reply is re-run by the person.
service InstallationService {
  rpc GetInstallation(Empty) returns (Installation);
  rpc Shutdown(Empty) returns (Empty);
  rpc ListProfiles(Empty) returns (ListProfilesResponse);
  rpc CreateProfile(CreateProfileRequest) returns (Profile);
  // Names a profile, or lets the installation pick or create one.
  rpc BindProfile(BindProfileRequest) returns (Profile);
  rpc RenameProfile(RenameProfileRequest) returns (Profile);
  rpc DeleteProfile(DeleteProfileRequest) returns (Empty);
  // Every profile now, then again whenever any of them changes: a new or
  // removed profile, a sign-in or sign-out, its relay link, its account's
  // name, picture or access. Each message is the whole list.
  rpc SubscribeProfiles(Empty) returns (stream ListProfilesResponse);
  // Signs a profile in with the device flow, run by the daemon: the first
  // event is the code to show the person and the page to open, the last is
  // the signed-in profile. A profile that already holds agents or paired
  // hosts asks first, with an adopt event, unless the request already
  // adopts; AnswerSignIn answers it. The stream's closing abandons the
  // sign-in.
  rpc SignIn(SignInRequest) returns (stream SignInEvent);
  rpc AnswerSignIn(AnswerSignInRequest) returns (Empty);
  // Reads the profile's account again now (its name, picture and access),
  // as after a purchase; the daemon also reads it whenever it refreshes the
  // account's token.
  rpc RefreshProfile(RefreshProfileRequest) returns (Profile);
}

message Installation { string version = 1; }

message Profile {
  bytes id = 1;
  string label = 2;
  string email = 3;
  string account_name = 4;
  string socket_path = 5;
  CloudStanding cloud = 6;
  // The account's picture, an https URL; empty when it has none.
  string picture_url = 7;
  // What the account may do, as amux.sh last said; absent until the
  // daemon has read it, and for a profile never signed in.
  Access access = 8;
  // The account's identifier at its service, kept after a sign-out: what
  // makes two profiles' accounts the same. Empty for a profile never signed
  // in.
  string account_subject = 9;
}

// What an account may do. `pro` is the whole gate; the rest explains it.
message Access {
  bool pro = 1;
  // When access ends, or ended, in milliseconds since the epoch; absent
  // when nothing ends.
  optional int64 until_ms = 2;
  // Why the account has it; absent when nothing was ever bought or given.
  oneof grant {
    // Given without a purchase: complimentary, a trial, a beta.
    Empty granted = 3;
    Purchase purchased = 4;
  }
}

message Purchase {
  PurchaseStore store = 1;
  // Whether it charges again; a cancelled subscription runs to its end.
  bool will_renew = 2;
  // When it charges again, in milliseconds since the epoch.
  optional int64 renews_at_ms = 3;
}

enum PurchaseStore {
  PURCHASE_STORE_UNSPECIFIED = 0;
  PURCHASE_STORE_APP_STORE = 1;
  PURCHASE_STORE_WEB = 2;
}

// A profile's standing with its cloud account: what the person asked for
// and, while signed in, what its relay link is doing.
message CloudStanding {
  oneof standing {
    // Never signed in.
    Empty unbound = 1;
    // Signed out, still tied to its account.
    Empty signed_out = 2;
    RelayLink signed_in = 3;
  }
}

// What a signed-in profile's relay link is doing.
message RelayLink {
  oneof state {
    Empty connecting = 1;
    RelayConnected connected = 2;
    Empty retrying = 3;
    // The account service refused the profile's credentials.
    Empty sign_in_again = 4;
    // The cloud refused this build as too old for its protocol.
    Empty version_mismatch = 5;
  }
}

message RelayConnected {
  Tier tier = 1;
  RelayCarrier carrier = 2;
}

enum Tier {
  TIER_UNSPECIFIED = 0;
  TIER_FREE = 1;
  TIER_PRO = 2;
}

enum RelayCarrier {
  RELAY_CARRIER_UNSPECIFIED = 0;
  RELAY_CARRIER_QUIC = 1;
  RELAY_CARRIER_TCP = 2;
}

message ListProfilesResponse { repeated Profile profiles = 1; }

message CreateProfileRequest { optional string label = 1; }

message BindProfileRequest {
  optional bytes profile_id = 1;
  string cloud_url = 2;
  string staged_refresh_token = 3;
  bool adopt_non_pristine = 4;
  // The OAuth client the refresh token was issued to; empty is the CLI's.
  // A token refreshes only under the client that obtained it.
  string client_id = 5;
}

message RenameProfileRequest {
  bytes profile_id = 1;
  string name = 2;
}

message DeleteProfileRequest {
  bytes profile_id = 1;
}

message SignInRequest {
  // The profile to sign in; absent lets the installation pick: the profile
  // already bound to this account, else the one that holds nothing yet,
  // else a new one.
  optional bytes profile_id = 1;
  // The account service; empty is https://amux.sh.
  string cloud_url = 2;
  // Sign in a profile that already holds agents or paired hosts without
  // asking.
  bool adopt_non_pristine = 3;
}

message SignInEvent {
  oneof of {
    SignInCode code = 1;
    // The chosen profile holds agents or paired hosts: answer with
    // AnswerSignIn, naming this sign-in.
    SignInAdopt adopt = 2;
    // Signed in; the stream ends.
    Profile signed_in = 3;
  }
}

// What the person does to sign in: open `verification_uri_complete`, or
// open `verification_uri` and type `user_code`.
message SignInCode {
  string verification_uri = 1;
  string verification_uri_complete = 2;
  string user_code = 3;
  // When the code stops working, in milliseconds since the epoch.
  int64 expires_at_ms = 4;
}

message SignInAdopt {
  bytes sign_in_id = 1;
  // The profile that would be signed in.
  Profile profile = 2;
}

message AnswerSignInRequest {
  bytes sign_in_id = 1;
  // Sign the profile in anyway; false abandons the sign-in.
  bool adopt = 2;
}

message RefreshProfileRequest { bytes profile_id = 1; }
