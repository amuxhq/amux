syntax = "proto3";

package amux.v1;

import "amux/v1/records.proto";

// The caller: who a call is for, when a node carries it to another host.
//
// A node that passes a call on to the host it is addressed to writes the
// caller beside it, encoded, in the `amux-caller-bin` header, the way a
// proxy says whom it passes a request on for. The node takes the caller
// from the connection the call came in on, replacing any header a client
// sent, so a client cannot say who it is.
//
// The caller's host is not in here: it is whoever the link's handshake
// authenticated, so a host speaks only for its own people and its own
// agents. A call on a link with this header is a host-service call made
// for that person or agent. A call on a link without it is the paired
// daemon asking for itself, which only PeerService answers; a host service
// refuses it, and PeerService refuses a call that carries the header.

message Caller {
  oneof of {
    Person person = 1;
    AgentCaller agent = 2;
  }
}

// One of the calling host's own agents, with what its host states about it
// from its own row as the call leaves: the answering host takes these as
// the caller's word and does not judge them from its copy of that row.
message AgentCaller {
  bytes agent_id = 1;
  // Its name on its host, as the answering host writes it beside what the
  // agent sends.
  string name = 2;
  // The incarnation that is calling. When the caller is the parent of the
  // agent the call acts on (a create, a message, input or a resume), the
  // answering host records it as the newest incarnation of the parent the
  // child has heard from, and the child's reports are for it.
  uint32 incarnation = 3;
  // The caller's own permission level: what caps a subagent it starts.
  // Unspecified when its permission has no level amux knows.
  PermissionLevel permission_level = 4;
}
