[package]
name = "store"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The profile store: one SQLite file per profile holding own and replica agent rows"
publish = false
autotests = false

[features]
# The store as a value, for the property checker: canonical dumps, restore
# and the block views its checks judge.
explore = []

[dependencies]
prost = { workspace = true }
rusqlite = { workspace = true, features = ["bundled"] }
thiserror = { workspace = true }
wire = { workspace = true }

[dev-dependencies]
store = { path = ".", features = ["explore"] }
tempfile = { workspace = true }

[[test]]
name = "integration"
path = "tests/integration.rs"
