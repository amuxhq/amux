# Reindeer turns the workspace's third-party dependencies (Cargo.toml and
# Cargo.lock) into Buck targets in third-party/rust/BUCK. Run `just buckify`
# after changing a dependency; the generated file is never edited by hand.
# Per-crate guidance lives in third-party/rust/fixups/<crate>/fixups.toml.
manifest_path = "Cargo.toml"
third_party_dir = "third-party/rust"

# Crate sources are downloaded from crates.io at build time, pinned by the
# checksums in Cargo.lock, rather than vendored into the repository.
vendor = false

# First-party crates have hand-written BUCK files beside their Cargo.toml.
include_workspace_members = false
include_top_level = false

# Build scripts' `cargo:rustc-link-lib` and `cargo:rustc-link-search` are
# honoured, as Cargo does, so a -sys crate's own build script can build and
# link its C library.
rustc_link_lib = true
rustc_link_search = true

# Cargo's CARGO_PKG_* variables, for crates that read them with env!().
cargo_env = true

[buck]
file_name = "BUCK"
rust_library = "cargo.rust_library"
rust_binary = "cargo.rust_binary"
buildscript_genrule = "buildscript_run"
buckfile_imports = """
load("@prelude//rust:cargo_buildscript.bzl", "buildscript_run")
load("@prelude//rust:cargo_package.bzl", "cargo")
"""
generated_file_header = """
# @generated by `just buckify` (reindeer). Do not edit.
"""

# Every target the workspace is built for. Reindeer resolves features for
# each, as Cargo would; third-party/rust/PACKAGE maps Buck's configuration
# to these names.
[platform.macos-arm64]
target = "aarch64-apple-darwin"

[platform.linux-x86_64]
target = "x86_64-unknown-linux-gnu"

[platform.windows-msvc]
target = "x86_64-pc-windows-msvc"

[platform.ios-arm64]
target = "aarch64-apple-ios"

[platform.ios-sim-arm64]
target = "aarch64-apple-ios-sim"

[platform.android-arm64]
target = "aarch64-linux-android"

[platform.android-x86_64]
target = "x86_64-linux-android"

[platform.wasm32]
target = "wasm32-unknown-unknown"
