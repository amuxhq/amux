]

[[contract]]
id = "resume-after-graceful-exit"
source = "worked failure"
section = "Agent lifecycle"
claim = "Resuming an exited agent writes the next spec, starts its process and flips the row live under the same subscription; the new incarnation's items flow on the same revision sequence, upserting by key what it re-derives, and the client does nothing special."
