# The test net's own tmux configuration. ctl starts every tmux server with
# this file and nothing else, so how keys reach the terminal client is the
# same on every machine whatever the operator's own ~/.tmux.conf says.

# Pass keys on as a program asks for them: legacy bytes by default, and
# xterm's modifyOtherKeys form (Ctrl+A as ESC[27;5;97~) to a program that
# turns it on, as Claude Code does. Many people run tmux this way, and the
# terminal client must read both.
set -s extended-keys on
set -s extended-keys-format xterm

# Escape reaches the program at once, not after tmux waits to see whether
# it starts a sequence.
set -s escape-time 0

set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g history-limit 10000
