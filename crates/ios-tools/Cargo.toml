[package]
name = "ios-tools"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The phone's developer tools: `cargo run -p ios-tools -- verify` runs the iOS verification stages"
publish = false
autotests = false

[dependencies]
app-runtime = { workspace = true, features = ["schema"] }
ui-state = { workspace = true, features = ["schema"] }
schemars = { workspace = true }
ui-view = { workspace = true, features = ["schema"] }
wire = { workspace = true, features = ["schema"] }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true
