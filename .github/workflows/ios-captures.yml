# The real interaction journeys and the accessibility sweep, dispatched by
# hand.
name: iOS captures

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  captures:
    name: iOS captures
    runs-on: macos-26
    # The capture suites drive the app on the golden device through served
    # networks. Leave room for the uploads.
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version | grep -Fx 'Xcode 26.6'
      - name: Assert simulator runtime and device type
        run: |
          xcrun simctl list runtimes --json | jq -e '.runtimes[] | select(.identifier == "com.apple.CoreSimulator.SimRuntime.iOS-26-5" and .isAvailable == true)'
          xcrun simctl list devicetypes --json | jq -e '.devicetypes[] | select(.identifier == "com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro")'
      # The gate's cache: this job builds the same bridge and tools, and a
      # cache of its own was evicted between the green runs that saved it.
      - uses: ./.github/actions/setup-rust
        with:
          targets: aarch64-apple-ios-sim
          shared-key: ios-gate
          save-if: "false"
      - name: Install build tools
        run: brew install xcodegen
      # Reuse the bridge and Xcode compilation cache the iOS gate already saved,
      # read-only so manual capture runs never bloat the cache budget.
      - name: Fingerprint the bridge's inputs
        id: bridge
        run: echo "fingerprint=$(scripts/py -B apps/apple/Tools/ios-rust.py --fingerprint)" >> "$GITHUB_OUTPUT"
      - name: Restore the bridge built from these sources
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/ios/AmuxAppDebugTools.xcframework
            target/ios/AmuxApp.xcframework
            target/ios/AmuxApp.xcframework.stand-in
            target/ios/rust-stamp.json
            target/ios/framework.sha256
          key: ios-bridge-xcode-26.6-${{ hashFiles('.github/workflows/ios.yml') }}-${{ steps.bridge.outputs.fingerprint }}
      - name: Restore what Xcode compiled before
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ios/xcode-cache
          key: ios-xcode-cache-26.6-
          restore-keys: ios-xcode-cache-26.6-
      # Every suite here drives the golden device; the small one is not used.
      - name: Boot the golden simulator
        run: just ios simulator golden
      - name: Run the capture suites
        env:
          AMUX_XCODE_CACHE: "1"
        run: just ios captures
      - name: Upload journeys and the audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-captures
          path: |
            target/journeys/phone
            target/ios/accessibility
          if-no-files-found: warn
          retention-days: 7
