[package]
name = "interpret"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The per-kind interpreters: provider facts and inputs in, journal steps and effects out"
publish = false
autotests = false

[dependencies]
attachments = { workspace = true }
base64 = "0.22"
chrono = { workspace = true }
claude-protocol = { workspace = true }
codex-protocol = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
redaction = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
sha2 = { workspace = true }
shell-words = { workspace = true }
wire = { workspace = true }

[features]
# The test kind: an interpreter over an authored fact vocabulary, for
# exercising the agent process's lifecycle without a provider's format.
testkind = []

[dev-dependencies]
toml = { workspace = true }

[[test]]
name = "integration"
path = "tests/integration.rs"
