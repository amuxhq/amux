name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check-and-clippy:
    name: Check and Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-just
      - name: Run Clippy
        run: just lint

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-30
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-just
      - name: Check formatting
        run: just fmt-check

  miri:
    name: Pointer checks over the C ABI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-30
          components: miri, rust-src
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-just
      - name: Run the C ABI tests under the checking interpreter
        run: just miri

  sanitizers:
    name: Sanitizers (${{ matrix.kind }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        kind: [address, thread]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-30
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: sanitize-${{ matrix.kind }}
      - uses: ./.github/actions/setup-just
      - name: Run the unsafe code's tests under the sanitizer
        run: just sanitize ${{ matrix.kind }}

  codegen-and-policy:
    name: Codegen and dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The compatibility check reads the latest release tag's schema.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-just
      - name: Check committed protobuf code
        run: just codegen-check
      - name: Check the protocol still reads what the latest release wrote
        run: just proto-compat
      - name: Enforce dependency boundaries
        run: just dependency-policy
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny@0.20.2,cargo-shear@1.14.0
      - name: Check dependency advisories, licences and sources
        run: just deny
      - name: Check every dependency is used
        run: just shear
      - name: Check the state-machine cores carry no runtime, lock or await
        run: just cores-check
      - name: Check provider messages go through the protocol crates
        run: just typed-provider-check
      - name: Check the test suite catalogue
        run: just tests-check
      - name: Run the scripts' own unit tests
        run: just script-tests
      - name: Check the documentation's links, figures and map
        run: just docs-check

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Refuse fixture update flags
        shell: bash
        run: scripts/no-update-flags.sh
      - uses: dtolnay/rust-toolchain@1.98.0
      # Named, because the weekly offline tests restore the Linux one.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - uses: ./.github/actions/setup-just
      - uses: ./.github/actions/setup-nextest
      # testnet's ctl test drives the terminal client in tmux; Linux runners
      # have it already.
      - name: Install tmux on macOS
        if: runner.os == 'macOS'
        run: brew install tmux
      - name: Run workspace tests
        # The ci profile reports every failing test, not only the first: a
        # platform that stops early hides the failures behind it until the
        # next run.
        # This is the fast lane and, on Linux and macOS, the system lane too:
        # the built amux binary's process, attach, overlap and supervise_cli
        # suites, node's supervisor suite and the survive-daemon system
        # journey are ordinary test suites, compiled out on Windows. The
        # protocol models run in the models job instead, on Linux only.
        run: just test -- --profile ci --exclude models
      - name: Keep the test report
        # Every test's result and time, and a failing test's output, in
        # JUnit form: target/nextest/ci/junit.xml.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

  platform-free:
    name: Simulated stories and doctests
    # What reads the same on every platform runs once, on Linux, rather than
    # in each test job, as the models do.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - uses: ./.github/actions/setup-just
      - uses: ./.github/actions/setup-nextest
      - name: Walk the simulated stories by seed
        # The same stories under TESTNET_MODE=simulated, a few seeds each;
        # a failure prints the seed and the `just sim --seed` that reruns
        # it. It builds what the workspace test run builds.
        run: just sim
      - name: Run doctests
        run: just doctest

  models:
    name: Models (${{ matrix.model }})
    # The protocol models explore every state of the real code at their CI
    # bounds, minutes of every core each; one job per model keeps
    # each model's run beside the others rather than after them, and none
    # of them on the platform test jobs.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Every protocol model, a module of the models' integration test
        # binary: `just tests-check` fails when one is missing here.
        model: [client, composed, family, lifecycle, path, presence, relay, replication, single_daemon, socket, supervisor, switch]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      # Named, because the nightly bounds restore it.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: models
      - uses: ./.github/actions/setup-just
      - uses: ./.github/actions/setup-nextest
      - name: Check the model at its CI bounds
        run: just test-crate models -- -E 'binary_id(models::integration) & test(/^${{ matrix.model }}::/)'

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-just
      - name: Build product release
        run: just release-check

  terminal-journeys:
    name: Terminal journeys (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-just
      - name: Install tmux on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Install tmux on macOS
        if: runner.os == 'macOS'
        run: brew install tmux
      - name: Run terminal journeys
        # Every terminal story in the manifest, one after another; a failure
        # does not stop the rest, and the job fails if any story did.
        run: just journey terminal all
      - name: Upload the terminal journeys' results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-journeys-${{ matrix.os }}
          path: target/journeys
          if-no-files-found: warn
          retention-days: 7

  ios:
    name: iOS target check
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-just
      - name: Check iOS device and simulator graphs
        run: just mobile-check
