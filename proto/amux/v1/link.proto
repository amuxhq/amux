syntax = "proto3";

package amux.v1;

import "amux/v1/records.proto";
import "google/rpc/status.proto";

// Host-to-host link control: what crosses a link's control stream, the
// preface of every other stream it carries, and the host each end
// announces.

// Host-to-host control envelope exchanged on the link's control stream.
message Message {

  oneof body {
    Hello hello = 1;
    HelloAck hello_ack = 2;
    NeighborUp neighbor_up = 3;
    NeighborDown neighbor_down = 4;
    Reauth reauth = 5;
    LinkClose link_close = 6;
    Addresses addresses = 7;
    ObservedAddress observed_address = 8;
    ForwardRefused forward_refused = 9;
    RefreshCredential refresh_credential = 10;
  }
}

// The handshake carries the sender's current neighbor snapshot; everything
// after it is a delta (NeighborUp/NeighborDown) by definition.
message Hello {
  uint32 protocol_version = 1;
  Host host = 2;
  repeated Host neighbors = 3;
  optional string auth_token = 4;
  // 16 random bytes drawn when the sender's runtime starts and kept for its
  // life. A link that arrives carrying a different runtime instance id than
  // an earlier link from the same host proves that earlier link belongs to
  // a process that no longer exists, however healthy it still looks.
  bytes runtime_instance_id = 5;
  // Every interface address the sender can be reached at, with its
  // listener's port, as host:port; never loopback or link-local.
  repeated string addrs = 6;
  // The address the relay last told the sender its packets come from, as
  // host:port. Only a paid host is told one: it is the candidate hole
  // punching works from, so a receiver keeps it apart from `addrs`.
  optional string public_addr = 7;
}

message HelloAck {
  oneof outcome {
    HelloAccepted accepted = 1;
    google.rpc.Status error = 2;
  }
}

message HelloAccepted {
  uint32 protocol_version = 1;
  Host host = 2;
  repeated Host neighbors = 3;
  // The acceptor's; see `Hello.runtime_instance_id`.
  bytes runtime_instance_id = 4;
  // The acceptor's; see `Hello.addrs`.
  repeated string addrs = 5;
  // The address the relay saw the sender's packets come from, as host:port.
  // Only a relay sets it, and only for a paid host: it is the candidate
  // hole punching works from.
  optional string observed_addr = 6;
  // The acceptor's; see `Hello.public_addr`.
  optional string public_addr = 7;
}

// "I have a direct link to this host." Strictly adjacency: a node never
// advertises anything it learned from someone else.
message NeighborUp {
  Host host = 1;
}

// "I lost my last direct link to this host."
message NeighborDown {
  bytes host_id = 1;
}

// The sender's address list changed; the whole new list, replacing the one
// its Hello or an earlier Addresses carried.
message Addresses {
  repeated string addrs = 1;
  optional string public_addr = 2;
}

// The relay's view of where the sender's packets now come from, sent to a
// paid host when it changes after the handshake.
message ObservedAddress {
  string addr = 1;
}

// A forwarder could not deliver packets naming `dst`, sent on the control
// link they arrived on. The packets themselves are dropped, never answered.
message ForwardRefused {
  bytes dst = 1;
  ForwardRefusal reason = 2;
}

enum ForwardRefusal {
  FORWARD_REFUSAL_UNSPECIFIED = 0;
  FORWARD_REFUSAL_NO_ROUTE = 1;
  FORWARD_REFUSAL_PAYMENT_REQUIRED = 2;
  FORWARD_REFUSAL_RATE_LIMITED = 3;
  FORWARD_REFUSAL_SHUTTING_DOWN = 4;
}

// Fire-and-forget credential refresh on the cloud link, sent before the
// current token expires. There is no acknowledgement — the protocol never
// acknowledges housekeeping; it only signals state changes. The receiver's
// only answers are silence (refresh accepted, the link continues) or
// `LinkClose(AUTH_EXPIRED)` (the sender reconnects with a fresh token).
message Reauth {
  string auth_token = 1;
}

// From the relay to a link whose plan is free: another link of the same
// account has just presented a paid plan, so this link's credential is
// likely out of date. The receiver fetches a fresh credential and presents
// it with `Reauth`, as its own refresh would, and answers nothing else. It
// names no plan: the fresh credential says the plan, and the relay judges by
// that alone.
message RefreshCredential {}

message Capabilities {
  // The host serves as a cloud relay.
  bool cloud_relay = 1;
  // The agent kinds this host can run, from its platform: terminal Claude
  // is not hosted on Windows.
  repeated Kind kinds = 2;
}

// "The link is closed now, here's why." No grace period: a receiver treats
// the link as gone the moment this arrives.
message LinkClose {
  LinkCloseReason reason = 1;
  optional google.rpc.Status error = 2;
}

enum LinkCloseReason {
  LINK_CLOSE_REASON_UNSPECIFIED = 0;
  LINK_CLOSE_REASON_USER_SHUTDOWN = 1;
  LINK_CLOSE_REASON_AUTH_EXPIRED = 2;
  LINK_CLOSE_REASON_PROTOCOL_ERROR = 3;
  // The peers share no protocol version; the older one needs updating.
  LINK_CLOSE_REASON_VERSION_MISMATCH = 4;
  LINK_CLOSE_REASON_USER_REVOKED = 5;
}

message Host {
  bytes host_id = 1;
  string name = 2;
  string version = 3;
  Capabilities capabilities = 4;
  Platform platform = 5;
  optional bool account_signed_in = 6;
}

// The operating system a machine runs, as its build knows it.
enum Platform {
  // Not said: a host never adjacent, or a system amux does not name.
  PLATFORM_UNSPECIFIED = 0;
  PLATFORM_MACOS = 1;
  PLATFORM_LINUX = 2;
  PLATFORM_WINDOWS = 3;
  PLATFORM_IOS = 4;
}
