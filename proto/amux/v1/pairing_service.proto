syntax = "proto3";

package amux.v1;

// Pairing: how two hosts come to trust each other, through PairingService
// with a one-shot secret, or over SSH.

service PairingService {
  rpc Pair(stream PairMessage) returns (stream PairMessage);
}

message PairMessage {
  oneof body {
    bytes spake2_message = 1;
    bytes key_confirmation = 2;
    bytes sealed_identity = 3;
    PairingError error = 4;
    PairingComplete pairing_complete = 5;
    PairingAbandoned pairing_abandoned = 6;
  }
  // Set on the joining side's first message: which kind of secret it
  // presents, so a window that takes either a PIN or a QR secret runs the
  // exchange with that one. A window with one secret ignores it.
  PairingSecretKind secret_kind = 7;
}

enum PairingSecretKind {
  PAIRING_SECRET_KIND_UNSPECIFIED = 0;
  PAIRING_SECRET_KIND_PIN = 1;
  PAIRING_SECRET_KIND_QR = 2;
}

message PairingComplete {}
message PairingAbandoned {}

// Why a pairing was refused: sent in the stream, or carried in the details
// of the status a refusal ends the stream with, so the other side tells
// refusals apart without reading their words.
message PairingError {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    NOT_IN_PAIRING_MODE = 1;
    INVALID_PIN = 2;
    PROTOCOL_VIOLATION = 3;
    TIMEOUT = 4;
    USER_REJECTED = 5;
    SELF_PAIRING = 6;
    // The peer claimed a host this one already trusts under another key.
    // The detail is the sentence a person is shown, naming that host.
    ALREADY_PAIRED = 7;
    // Too many wrong secrets closed the window.
    LOCKED = 8;
  }

  Reason reason = 1;
  string detail = 2;
}

message PairingIdentity {
  bytes host_id = 1;
  bytes pubkey = 2;
  string name = 3;
  // Authenticated along with the responder identity by SPAKE2 sealing.
  int64 expires_at_ms = 4;
}
