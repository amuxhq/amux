name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check-and-clippy:
    name: Check and Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - name: Check workspace
        run: just check
      - name: Run Clippy
        run: just lint

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-30
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - name: Check formatting
        run: just fmt-check

  miri:
    name: Pointer checks over the C ABI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-30
          components: miri, rust-src
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - name: Run the C ABI tests under the checking interpreter
        run: just miri

  codegen-and-policy:
    name: Codegen and dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - name: Check committed protobuf code
        run: just codegen-check
      - name: Enforce dependency boundaries
        run: just dependency-policy
      - name: Check the state-machine cores carry no runtime, lock or await
        run: just cores-check
      - name: Check provider messages go through the protocol crates
        run: just typed-provider-check
      - name: Check the test suite catalogue
        run: just tests-check
      - name: Check the documentation's links, figures and map
        run: just docs-check
      - name: Check nothing names a removed mechanism
        run: just deletion-ledger-check

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Refuse fixture update flags
        shell: bash
        run: scripts/no-update-flags.sh
      - uses: dtolnay/rust-toolchain@1.98.0
      # Named, because the weekly offline tests restore the macOS one.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - uses: extractions/setup-just@v2
      # testnet's ctl test drives the terminal client in tmux; Linux runners
      # have it already.
      - name: Install tmux on macOS
        if: runner.os == 'macOS'
        run: brew install tmux
      - name: Run workspace tests
        # Report every failing test binary, not only the first: a platform
        # that stops early hides the failures behind it until the next run.
        # This is the fast lane and, on Linux and macOS, the system lane too:
        # the built amux binary's process, attach, overlap and supervise_cli
        # suites, node's supervisor suite and the survive-daemon system
        # journey are ordinary test targets, compiled out on Windows. The
        # protocol models run in the models job instead, on Linux only.
        run: just test -- --no-fail-fast --exclude models

  platform-free:
    name: Simulated stories, doctests and contracts
    # What reads the same on every platform runs once, on Linux, rather than
    # in each test job, as the models do.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - uses: extractions/setup-just@v2
      - name: Walk the simulated stories by seed
        # The same stories under TESTNET_MODE=simulated, a few seeds each;
        # a failure prints the seed and the `just sim --seed` that reruns
        # it. It builds what the workspace test run builds.
        run: just sim
      - name: Check every design contract names tests that exist
        # Lists the binaries of the same build, so it compiles nothing more.
        # The contracts name tests of Unix processes, PTYs and sockets, which
        # Windows does not build.
        run: just contracts-check
      - name: Run doctests
        run: just doctest

  models:
    name: Models (${{ matrix.target }})
    # The protocol models explore every state of the real code at their CI
    # bounds, minutes of every core each; one job per test target keeps
    # each model's run beside the others rather than after them, and none
    # of them on the platform test jobs.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Every protocol-models test target: `just tests-check` fails when
        # one is missing here.
        target: [client, composed, family, lifecycle, path, presence, relay, replication, single_daemon, supervisor, switch]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      # Named, because the nightly bounds restore it.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: models
      - uses: extractions/setup-just@v2
      - name: Check the model at its CI bounds
        run: just test-crate models -- --test ${{ matrix.target }}

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - name: Build product release
        run: just release-check

  terminal-journeys:
    name: Terminal journeys (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - name: Install tmux on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Install tmux on macOS
        if: runner.os == 'macOS'
        run: brew install tmux
      - name: Run terminal journeys
        # Every terminal story in the manifest, one after another; a failure
        # does not stop the rest, and the job fails if any story did.
        run: just journey terminal all
      - name: Upload the terminal journeys' results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-journeys-${{ matrix.os }}
          path: target/journeys
          if-no-files-found: warn
          retention-days: 7

  codex-socket-windows:
    name: Codex Unix socket on Windows (report)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Report whether Codex listens on a Unix socket
        # amux keeps Codex on stdio on Windows, with no attach; this only
        # says whether that could change. It never fails the job.
        continue-on-error: true
        shell: pwsh
        run: |
          npm install -g @openai/codex@0.160.0
          $socket = Join-Path $env:RUNNER_TEMP 'codex.sock'
          $errors = Join-Path $env:RUNNER_TEMP 'codex.err'
          $server = Start-Process -PassThru -NoNewWindow -FilePath cmd.exe `
            -ArgumentList '/c', 'codex', 'app-server', '--listen', "unix://$socket" `
            -RedirectStandardError $errors
          $verdict = 'did not listen within 30 seconds'
          for ($i = 0; $i -lt 60; $i++) {
            if ($server.HasExited) { $verdict = "exited with code $($server.ExitCode)"; break }
            if (Test-Path $socket) {
              try {
                $client = [System.Net.Sockets.Socket]::new(
                  [System.Net.Sockets.AddressFamily]::Unix,
                  [System.Net.Sockets.SocketType]::Stream,
                  [System.Net.Sockets.ProtocolType]::Unspecified)
                $client.Connect([System.Net.Sockets.UnixDomainSocketEndPoint]::new($socket))
                $client.Dispose()
                $verdict = 'listens, and a client connects'
              } catch {
                $verdict = "listens, but a client could not connect: $($_.Exception.Message)"
              }
              break
            }
            Start-Sleep -Milliseconds 500
          }
          if (-not $server.HasExited) { taskkill /T /F /PID $server.Id | Out-Null }
          "Codex $(codex --version) on Windows, ``app-server --listen unix://``: $verdict" |
            Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY
          Get-Content $errors -ErrorAction SilentlyContinue | Select-Object -Last 20

  embedded:
    name: Embedded client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - name: Check provider-free client graph
        run: just embedded-check
      - name: Test embedded ownership boundary
        run: just embedded-test

  ios:
    name: iOS target check
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - name: Check iOS device and simulator graphs
        run: just mobile-check

  # A change reaches the phone only through these paths. Whatever else the
  # bridge reads crosses to Swift as the generated mirrors in apps/apple,
  # which a workspace test holds to the Rust definitions, so a shape change
  # upstream cannot land without touching the app. Behaviour upstream is the
  # workspace tests' to judge; the iOS target check above compiles the
  # bridge's graph on every push.
  ios-changes:
    name: iOS changes
    runs-on: ubuntu-latest
    outputs:
      phone: ${{ steps.filter.outputs.phone }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            phone:
              - 'apps/apple/**'
              - 'crates/app-ffi/**'
              - 'crates/app-embedded/**'
              - 'crates/app-runtime/**'
              - 'crates/xtask/**'
              - 'scripts/**'
              - 'justfile'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'

  ios-gate:
    name: iOS gate
    needs: ios-changes
    if: needs.ios-changes.outputs.phone == 'true'
    runs-on: macos-26
    # The gate builds the app and runs the suites one simulator can answer.
    # The capture suites are not here: see `just ios captures`.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Refuse fixture update flags
        shell: bash
        run: scripts/no-update-flags.sh
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version | grep -Fx 'Xcode 26.6'
      - name: Assert simulator runtime and device type
        run: |
          xcrun simctl list runtimes --json | jq -e '.runtimes[] | select(.identifier == "com.apple.CoreSimulator.SimRuntime.iOS-26-5" and .isAvailable == true)'
          xcrun simctl list devicetypes --json | jq -e '.devicetypes[] | select(.identifier == "com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro")'
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      # Named, because the nightly iOS captures job restores it.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ios-gate
      - uses: extractions/setup-just@v2
      - name: Install build tools
        run: brew install xcodegen
      - name: Run the iOS gate
        run: just ios gate
      - name: Upload component snapshot comparisons and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-component-snapshots
          path: target/ios/component-snapshots
          if-no-files-found: warn
          retention-days: 7
      - name: Upload the shipped-scope audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-scope-audit
          path: target/ios/scope-audit
          if-no-files-found: warn
          retention-days: 7
